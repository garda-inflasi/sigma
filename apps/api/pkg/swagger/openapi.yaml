  /v1/audit:
    get:
      summary: Daftar jejak audit (terbaru lebih dulu)
      description: |
        Filter dijalankan di server dan hasilnya dipaginasi dengan cursor. Butuh izin `audit.lihat`.
        Tabel `audit_log` bersifat append-only. Urutan: waktu menurun, lalu ID (BIGINT, numerik) menurun. Cursor memuat
        waktu dan ID baris terakhir; cursor yang bukan hasil halaman sebelumnya (termasuk cursor lama berisi UUID) dijawab 400.
      operationId: auditList
      tags:
        - Audit
      security:
        - BearerAuth: []
      parameters:
        - name: dari
          in: query
          description: Batas bawah waktu (inklusif), RFC 3339 atau YYYY-MM-DD
          schema:
            type: string
        - name: sampai
          in: query
          description: Batas atas waktu (eksklusif); bila bertanggal YYYY-MM-DD mencakup seluruh hari itu
          schema:
            type: string
        - name: aktor
          in: query
          description: ID akun persis, atau potongan nama/email aktor
          schema:
            type: string
        - name: aksi
          in: query
          schema:
            type: string
            example: ASSIGN_ROLE
        - name: entitas
          in: query
          schema:
            type: string
            example: pengguna
        - name: hasil
          in: query
          schema:
            type: string
            enum: [BERHASIL, GAGAL, DITOLAK]
        - name: entitas_id
          in: query
          description: ID objek persis (jejak satu objek)
          schema:
            type: string
        - name: peran
          in: query
          description: Peran aktor persis (snapshot saat aksi)
          schema:
            type: string
        - name: correlation_id
          in: query
          description: Semua baris dari satu permintaan
          schema:
            type: string
        - name: q
          in: query
          description: Pencarian bebas (tak peka huruf besar-kecil) pada aksi, entitas, id entitas, nama/email aktor, dan correlation id
          schema:
            type: string
        - name: limit
          in: query
          description: Ukuran halaman (bawaan 50, maksimum 200)
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          description: Nilai `next_cursor` dari halaman sebelumnya
          schema:
            type: string
      responses:
        "200":
          description: Satu halaman jejak audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPageResponse"
        "400":
          description: Filter atau cursor tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `audit.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/audit/export:
    get:
      summary: Ekspor jejak audit ke CSV
      description: |
        Memakai filter yang sama dengan `/v1/audit` (limit dan cursor diabaikan). CSV bertitik koma
        dengan BOM UTF-8, terbaru lebih dulu, paling banyak 20.000 baris (`X-Export-Truncated: true`
        bila terpotong; persempit filter). Sel yang diawali `=`, `+`, `-`, `@` diberi awalan `'`
        agar tidak dibaca sebagai rumus. Ekspor dicatat sebagai `EKSPOR_DATA`. Butuh izin `audit.lihat`.
      operationId: auditExport
      tags:
        - Audit
      security:
        - BearerAuth: []
      parameters:
        - name: dari
          in: query
          schema:
            type: string
        - name: sampai
          in: query
          schema:
            type: string
        - name: aktor
          in: query
          schema:
            type: string
        - name: aksi
          in: query
          schema:
            type: string
        - name: entitas
          in: query
          schema:
            type: string
        - name: hasil
          in: query
          schema:
            type: string
            enum: [BERHASIL, GAGAL, DITOLAK]
        - name: entitas_id
          in: query
          schema:
            type: string
        - name: peran
          in: query
          schema:
            type: string
        - name: correlation_id
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Berkas CSV
          headers:
            X-Export-Rows:
              description: Jumlah baris data
              schema:
                type: integer
            X-Export-Truncated:
              description: "`true` bila hasil dipotong pada batas baris"
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Filter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `audit.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/audit/{id}:
    get:
      summary: Detail satu entri audit dengan diff sebelum/sesudah
      description: |
        `perubahan` meratakan objek `sebelum`/`sesudah` menjadi daftar bidang yang berbeda
        (path bertitik; larik dibandingkan utuh). Butuh izin `audit.lihat`.
      operationId: auditDetail
      tags:
        - Audit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            ID BIGINT entri (string desimal), atau kode (ID lama baris yang dibuat sebelum migrasi 000115, UUID teks atau
            `demo-audit-NNNN`) sebagai alias. Angka murni selalu dibaca sebagai ID. ID yang salah bentuk (nol, negatif, berawalan
            nol) atau kode lebih panjang dari 64 karakter dijawab 404, sama dengan ID yang tidak ada.
          schema:
            anyOf:
              - $ref: "#/components/schemas/IdBigint"
              - type: string
                maxLength: 64
      responses:
        "200":
          description: Entri audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditDetailResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `audit.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entri tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/master/komoditas:
    get:
      summary: Mendaftar komoditas master
      operationId: listKomoditas
      tags:
        - Master Data
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Pencarian pada kode atau nama (tanpa peka huruf besar-kecil)
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Ukuran halaman (maksimum 500). Tanpa limit, seluruh baris dikembalikan.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Daftar komoditas
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil pencarian (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterKomoditasListResponse"
        "403":
          description: Tanpa izin `master.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/master/wilayah:
    get:
      summary: Mendaftar wilayah (kabupaten/kota)
      operationId: listWilayah
      tags:
