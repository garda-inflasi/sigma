        bawah_pct: {type: number, format: double, description: Batas bawah rentang 80% terhadap harga dasar (persen)}
        atas_pct: {type: number, format: double, description: Batas atas rentang 80% terhadap harga dasar (persen)}
        model_versi: {type: string, example: v2.3.1}
        mape: {type: number, format: double, example: 7.6}
        sumber: {type: string, enum: [MODEL, DEMO]}

    PrediksiTitik:
      type: object
      description: Titik seri grafik. Riwayat hanya `aktual`; titik sambung memuat keduanya; proyeksi memuat `proyeksi`, `bawah`, `atas`.
      properties:
        tanggal: {type: string, format: date}
        aktual: {type: integer}
        proyeksi: {type: integer}
        bawah: {type: integer}
        atas: {type: integer}

    PrediksiFaktor:
      type: object
      properties:
        nama: {type: string}
        kontribusi: {type: number, format: double, description: Poin persen terhadap perubahan harga proyeksi}
        detail: {type: string}

    PrediksiProyeksi:
      type: object
      properties:
        komoditas_kode: {type: string}
        komoditas_nama: {type: string}
        kabupaten_kode: {type: string}
        kabupaten_nama: {type: string}
        horizon_hari: {type: integer}
        harga_kini: {type: integer}
        perubahan_pct: {type: number, format: double}
        bawah_pct: {type: number, format: double}
        atas_pct: {type: number, format: double}
        seri:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiTitik"
        faktor:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiFaktor"
        narasi: {type: string}
        model:
          type: object
          properties:
            nama: {type: string}
            versi: {type: string}
            mape: {type: number, format: double}
            dilatih: {type: string, format: date}
        rekomendasi:
          type: array
          items: {type: string}
        sumber: {type: string, enum: [MODEL, DEMO]}

    PrediksiModel:
      type: object
      properties:
        id: {type: string, example: MDL-CBM-KRT-v2.3.1}
        komoditas_kode: {type: string}
        komoditas_nama: {type: string}
        nama: {type: string}
        versi: {type: string}
        mape: {type: number, format: double}
        drift: {type: number, format: double}
        status: {type: string, enum: [PRODUKSI, KANDIDAT, ARSIP]}
        dilatih_pada: {type: string, format: date-time}
        sumber: {type: string, enum: [MODEL, DEMO]}
        catatan: {type: string}
        baseline_mape:
          type: number
          format: double
          nullable: true
          description: MAPE baseline naif pada backtest yang sama; null bila tidak diukur (model demo).
        mape_realisasi:
          type: number
          format: double
          nullable: true
          description: Rata-rata |galat| proyeksi model yang sudah jatuh tempo; null bila belum ada.
        n_evaluasi: {type: integer}

    PrediksiBulkModelRequest:
      type: object
      required: [action, ids]
      properties:
        action: {type: string, enum: [promosi, arsip]}
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, example: MDL-CBM-KRT-v2.4.0-rc1}

    PrediksiBulkModelResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          type: object
          properties:
            berhasil: {type: integer}
            gagal: {type: integer}
            detail:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  alasan: {type: string}

    PrediksiSimulasiRequest:
      type: object
      required: [komoditas_kode]
      properties:
        komoditas_kode: {type: string, example: CBM-KRT}
        kabupaten_kode: {type: string, pattern: '^[0-9]{4}$', description: Bawaan 1171}
        horizon_hari: {type: integer, minimum: 1, maximum: 365, description: Bawaan 14}
        hujan_pct: {type: number, minimum: 0, maximum: 300, description: Curah hujan sentra terhadap normal (100 = normal). Bawaan 100}
        pasokan_pct: {type: number, minimum: -50, maximum: 100, description: Perubahan pasokan antardaerah (persen). Bawaan 0}
        subsidi_pct: {type: number, minimum: 0, maximum: 100, description: Subsidi ongkos angkut (persen). Bawaan 0}

    PrediksiSimulasi:
      type: object
      properties:
        id: {type: string}
        komoditas_kode: {type: string}
        komoditas_nama: {type: string}
        kabupaten_kode: {type: string}
        horizon_hari: {type: integer}
        harga_kini: {type: integer}
        proyeksi: {type: integer}
        dasar_pct: {type: number, format: double, description: Perubahan proyeksi model tanpa skenario}
        hasil_pct: {type: number, format: double}
        bawah_pct: {type: number, format: double}
        atas_pct: {type: number, format: double}
        efek:
          type: array
          items:
            type: object
            properties:
              faktor: {type: string}
              parameter: {type: number, format: double}
              koefisien: {type: number, format: double}
              efek_pct: {type: number, format: double}
              sumber: {type: string, enum: [ASUMSI]}
        model_versi: {type: string}
        sumber_model: {type: string, enum: [MODEL, DEMO]}
        terbatas: {type: boolean}
        catatan: {type: string}
        dibuat_pada: {type: string, format: date-time}

    PrediksiSimulasiResponse:
      type: object
      properties:
        code: {type: string, example: "201"}
        message: {type: string, example: "Created"}
        data:
          $ref: "#/components/schemas/PrediksiSimulasi"

    PrediksiKomoditasRequest:
      type: object
      required: [komoditas_kode]
      properties:
        komoditas_kode: {type: string, example: CBM-KRT}

    PrediksiStatusMl:
      type: object
      properties:
        dikonfigurasi: {type: boolean}
        tersedia: {type: boolean}
        versi: {type: string}

    PrediksiStatusMlResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          $ref: "#/components/schemas/PrediksiStatusMl"

    PrediksiModelResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          $ref: "#/components/schemas/PrediksiModel"

    PrediksiSegarkanResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          type: object
          properties:
            proyeksi: {type: integer}

    PrediksiEvaluasiResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          type: object
          properties:
            dievaluasi: {type: integer}

    PrediksiRingkasanListResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiRingkasan"

    PrediksiProyeksiResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          $ref: "#/components/schemas/PrediksiProyeksi"

    PrediksiModelListResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiModel"
