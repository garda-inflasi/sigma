openapi: "3.0.3"

info:
  title: Garda Inflasi API
  description: |
    API untuk platform Garda Inflasi — sistem pengendalian inflasi daerah
    terintegrasi dengan AI/ML, real-time monitoring, dan early warning system.

    ## Authentication

    Semua endpoint kecuali `/healthz`, `/v1/auth/login`, `/v1/auth/refresh`,
    `/v1/auth/forgot-password`, `/v1/auth/reset-password`, `/v1/auth/aktivasi`, `/v1/auth/mfa/validate`, dan
    `/v1/auth/sso/*` memerlukan
    JWT Bearer token yang dikirim via header `Authorization: Bearer <token>`.

    Token diperoleh dari endpoint `POST /v1/auth/login`.

    ## Batas laju endpoint auth publik

    `POST /v1/auth/login`, `/v1/auth/mfa/validate`, `/v1/auth/forgot-password`, `/v1/auth/reset-password`,
    `/v1/auth/aktivasi` (satu ember) dan `/v1/auth/sso/google/authorize` + `/callback` (ember sendiri) dibatasi per IP klien
    (`AUTH_RATE_LIMIT_PER_MENIT`, bawaan 10 per menit), selain batas global API. Kelebihan dijawab 429 dengan
    kode `RATE_LIMITED`, header `Retry-After`, dan `data.sisa_detik` (kontrak yang sama dengan batas laju
    BFF web, yang meneruskannya tanpa diubah). Permintaan yang ditolak tidak diperiksa dan tidak dihitung
    sebagai percobaan lockout akun. IP klien diambil dari `X-Forwarded-For` hanya bila berasal dari proxy
    tepercaya (`TRUSTED_PROXIES`).
  version: "1.0.0"
  contact:
    name: FMIPA USK × Kanwil DJPb

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.garda-inflasi.dev
    description: Development

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/login:
    post:
      summary: Login pengguna
      description: |
        Akun dengan MFA aktif tidak langsung menerima sesi: respons berisi `mfa_required: true` dan `mfa_token`
        (berlaku 5 menit), yang ditukar dengan kode OTP di `POST /v1/auth/mfa/validate`. Akun yang wajib MFA
        (peran strategis, manajerial, koordinator lapangan, admin, atau bertanda `mfa_wajib`, bila `MFA_ENFORCE`
        menyala; bawaan hanya di produksi) tetapi belum setup menerima sesi dengan `mfa_setup_diwajibkan: true`:
        semua endpoint selain `/v1/auth/mfa/setup`, `/v1/auth/mfa/verify`, ganti password, keluar, dan profil
        menjawab 403 dengan kode `MFA_SETUP_REQUIRED`.

        **Lockout akun (satu mekanisme).** Kegagalan dihitung per email ternormalisasi (huruf kecil, tanpa spasi tepi),
        bukan per akun, jadi email terdaftar dan tidak terdaftar mendapat jawaban yang sama persis (anti-enumerasi).
        Lima kegagalan berturut-turut dalam satu jendela 15 menit — kata sandi login, kode OTP login, kode setup MFA,
        kata sandi lama saat ganti kata sandi, dan konfirmasi kata sandi di nonaktifkan-MFA / kode-cadangan-baru memakai
        hitungan yang sama — mengunci akun selama 15 menit sejak
        kegagalan kelima. Selama terkunci semua percobaan (juga dengan kata sandi benar) dijawab 423 `ACCOUNT_LOCKED`
        tanpa diperiksa dan tanpa memperpanjang kunci. Hitungan dihapus saat login berhasil lengkap (kata sandi dan,
        bila ada, OTP) atau saat admin membuka kunci (`POST /v1/users/{id}/buka-kunci`). Akun nonaktif baru
        dijawab 403 `ACCOUNT_INACTIVE` setelah kata sandi terbukti benar; kata sandi salah tetap 401.
      operationId: authLogin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email atau password salah (kode `INVALID_CREDENTIALS`; sama untuk email yang tidak terdaftar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Akun tidak aktif (kode `ACCOUNT_INACTIVE`), hanya dijawab setelah kata sandi benar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AkunTerkunci"
        "429":
          $ref: "#/components/responses/BatasLaju"

  /v1/auth/sso/status:
    get:
      summary: Penyedia SSO yang aktif
      description: |
        Publik. Halaman masuk memanggilnya dari server untuk memutuskan apakah tombol "Masuk dengan Google"
        ditampilkan. `google: true` berarti SSO Google dikonfigurasi (SSO_GOOGLE_*), bukan bahwa penerbit
        sedang terjangkau.
      operationId: authSSOStatus
      tags:
        - Authentication
      responses:
        "200":
          description: Status SSO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOStatusResponse"

  /v1/auth/sso/google/authorize:
    post:
      summary: Memulai masuk dengan Google (OIDC Authorization Code + PKCE S256)
      description: |
        Publik, dipanggil BFF dari server ke server. Membangkitkan `state`, `nonce`, dan `code_verifier`,
        menyimpannya di server (state dan binding hanya sebagai hash SHA-256, umur 10 menit, sekali pakai),
        lalu mengembalikan URL otorisasi Google. `binding` adalah rahasia yang mengikat alur ke browser
        pemulai: BFF menyimpannya di cookie httpOnly (SameSite=Lax) dan mengirimnya kembali pada callback.
        Penemuan konfigurasi penerbit dilakukan malas; bila penerbit tidak terjangkau jawabannya 503
        `SSO_UNAVAILABLE` dan tidak ada state tersimpan.
      operationId: authSSOGoogleAuthorize
      tags:
        - Authentication
      responses:
        "200":
          description: URL otorisasi dan binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOAuthorizeResponse"
        "429":
          $ref: "#/components/responses/BatasLaju"
        "503":
          description: |
            `SSO_NOT_CONFIGURED` (SSO_GOOGLE_* belum diisi) atau `SSO_UNAVAILABLE` (penerbit tidak terjangkau)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/sso/google/callback:
    post:
      summary: Menyelesaikan masuk dengan Google
      description: |
        Publik, dipanggil BFF dari server ke server dengan `code` dan `state` dari pengalihan Google serta
        `binding` dari cookie browser. State dipakai sekali (dihapus pada percobaan pertama apa pun hasilnya).
        Kode ditukar dengan verifier PKCE yang tersimpan, lalu ID token diverifikasi (tanda tangan lewat JWKS,
        penerbit, audiens, kedaluwarsa, nonce) dan `email_verified` wajib benar; `SSO_GOOGLE_HOSTED_DOMAIN`
        (bila diisi) mewajibkan klaim `hd` yang sama.

        Tidak ada pendaftaran mandiri: akun harus sudah ada dan AKTIF. Pemetaan: subjek (`sub`) yang sudah
        bertaut lebih dulu, lalu email (tak peka huruf besar-kecil). Masuk SSO pertama menautkan
        `sso_provider`/`sso_subject`; email milik akun yang sudah bertaut ke subjek lain ditolak (409) dan
        diaudit. Akun tidak aktif atau terkunci ditolak dengan aturan yang sama dengan login kata sandi.

        Hasil sama dengan `POST /v1/auth/login`: sesi penuh, atau `mfa_required` dan `mfa_token` untuk akun
        ber-MFA (ditukar di `POST /v1/auth/mfa/validate`). Audit LOGIN memuat `metadata.metode = sso_google`; untuk
        akun ber-MFA metode itu dibawa token tantangan sehingga entri LOGIN setelah OTP memuat `metode` dan `mfa`.
      operationId: authSSOGoogleCallback
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOCallbackRequest"
      responses:
        "200":
          description: Sesi diterbitkan atau tantangan MFA (bentuk sama dengan login berhasil)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal, atau `SSO_STATE_INVALID` (state tidak dikenal, sudah dipakai, kedaluwarsa, atau binding tidak cocok)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`SSO_EXCHANGE_FAILED`: kode ditolak, tanda tangan/penerbit/audiens/nonce ID token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            `SSO_EMAIL_UNVERIFIED`, `SSO_DOMAIN_NOT_ALLOWED`, `SSO_ACCOUNT_NOT_FOUND` (tidak ada akun untuk
            email itu), atau `SSO_ACCOUNT_INACTIVE`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`SSO_ACCOUNT_CONFLICT`: akun sudah tertaut ke identitas Google yang berbeda"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: "`SSO_ACCOUNT_LOCKED`: akun terkunci karena terlalu banyak percobaan (header `Retry-After` memuat sisa kunci)"
          headers:
            Retry-After:
              description: Sisa kunci dalam detik
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/BatasLaju"
        "503":
          description: "`SSO_NOT_CONFIGURED` atau `SSO_UNAVAILABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/refresh:
    post:
      summary: Refresh token
      operationId: authRefresh
      description: |
        Menukar refresh token dengan access token baru dan refresh token pengganti (rotasi). Token lama
        langsung hangus; penukaran bersifat atomik sehingga dua permintaan serentak dengan token yang sama
        tidak mungkin keduanya memutar.

        **Jendela toleransi (10 detik).** Token yang baru saja diputar lalu disajikan lagi (mis. dua tab
        menyegarkan sesi bersamaan) dijawab 200 dengan access token baru tetapi **tanpa** `refresh_token`:
        pertahankan refresh token yang diterima permintaan pertama. Setelah jendela itu, menyajikan token yang
        sudah diputar dianggap pencurian: seluruh sesi dicabut (termasuk access token-nya) dan `TOKEN_REUSE`
        dicatat di audit. Token yang dicabut karena keluar atau `Cabut` hanya dijawab 401.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      summary: Logout dari sesi ini
      operationId: authLogout
      description: |
        Mengakhiri hanya sesi yang sedang dipakai (klaim `sid`) dan memasukkan jti access token ke daftar
        cabut; sesi di perangkat lain tetap hidup. Untuk keluar di semua perangkat gunakan
        `POST /v1/auth/logout-all`. Badan opsional `refresh_token` dipakai untuk menentukan sesi bila
        access token tidak membawa `sid` (token terbitan sebelum fitur sesi).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout-all:
    post:
      summary: Keluar dari semua perangkat
      operationId: authLogoutAll
      description: |
        Mengakhiri semua sesi pengguna, termasuk yang sedang dipakai. Seluruh access token dan refresh
        token pengguna berhenti berlaku seketika. Tercatat di audit (`LOGOUT_ALL`).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Semua sesi diakhiri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsRevokedResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/sessions:
    get:
      summary: Daftar sesi aktif milik sendiri
      operationId: authListSessions
      description: |
        Sesi aktif (perangkat yang sedang masuk) milik pengguna yang memanggil, yang terakhir dipakai
        paling awal. `saat_ini` menandai sesi pemanggil. Tersedia untuk semua peran.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/sessions/{id}:
    delete:
      summary: Cabut satu sesi milik sendiri
      operationId: authRevokeSession
      description: |
        Mencabut sesi lain milik pengguna yang memanggil. Access token dan refresh token sesi itu
        berhenti berlaku seketika. Sesi yang sedang dipakai tidak dapat dicabut di sini (gunakan
        `POST /v1/auth/logout`). Tercatat di audit (`REVOKE_SESSION`).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id sesi dari `GET /v1/auth/sessions`
      responses:
        "200":
          description: Sesi dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Sesi yang sedang dipakai tidak dapat dicabut dari daftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Sesi tidak ada, sudah berakhir, atau milik pengguna lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/sessions/revoke-others:
    post:
      summary: Cabut semua sesi lain
      operationId: authRevokeOtherSessions
      description: |
        Mencabut semua sesi pengguna selain yang sedang dipakai ("keluar dari perangkat lain").
        Tercatat di audit (`REVOKE_OTHER_SESSIONS`).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Jumlah sesi yang dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsRevokedResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Access token tidak membawa `sid` (terbitan sebelum fitur sesi); masuk ulang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      summary: Mendapatkan profil pengguna saat ini
      operationId: authMe
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/change-password:
    post:
      summary: Mengubah password
      operationId: authChangePassword
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: |
            Password berhasil diubah. Penanda `wajib_ganti_password` dimatikan. Sesi yang sedang dipakai
            tetap hidup (id sesi sama) dengan access dan refresh token baru; semua sesi lain dicabut.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          description: Password baru terlalu lemah atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password lama salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Password akun berubah di sela verifikasi password lama dan penyimpanan password baru (mis. reset oleh
            admin atau penggantian serentak). Tidak ada yang ditimpa; muat ulang lalu coba lagi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AkunTerkunci"

  /v1/auth/forgot-password:
    post:
      summary: Meminta reset password (mengirim email)
      operationId: authForgotPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: |
            Selalu mengembalikan sukses untuk mencegah email enumeration.
            Email reset akan dikirim jika email terdaftar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/BatasLaju"

  /v1/auth/reset-password:
    post:
      summary: Mereset password dengan token dari email
      description: |
        Token berlaku 30 menit dan hanya dapat dipakai satu kali (dipakai secara atomik: permintaan serentak
        dengan token sama hanya satu yang berhasil). Setelah berhasil, penanda wajib ganti password dimatikan,
        seluruh sesi lama dicabut, dan token lain milik akun yang sama dihanguskan. Tautan di email mengarah
        ke halaman web `/reset-password?token=...` (alamat dasar dari env `APP_PUBLIC_URL`).
      operationId: authResetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Password melanggar kebijakan (pesan memuat alasannya) atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid, sudah dipakai, atau kedaluwarsa (pesan membedakan kedaluwarsa dari tidak valid/terpakai)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/BatasLaju"

  /v1/auth/aktivasi:
    post:
      summary: Mengaktifkan akun undangan dengan menetapkan kata sandi pertama
      description: |
        Publik. Token berasal dari tautan di email undangan (`/aktivasi?token=...`, alamat dasar dari env
        `APP_PUBLIC_URL`): 256 bit acak, hanya hash-nya yang disimpan, berlaku 72 jam, dan hanya dapat dipakai satu
        kali. Dalam satu transaksi atomik token ditandai terpakai, kata sandi disimpan, status akun menjadi `AKTIF`
        (dari `MENUNGGU`), dan `wajib_ganti_password` dimatikan; permintaan serentak dengan token yang sama hanya
        satu yang berhasil. Kata sandi diperiksa dengan kebijakan yang sama dengan atur ulang kata sandi (maksimal
        72 karakter, batas bcrypt) dan kata sandi yang melanggar kebijakan **tidak** menghanguskan tautan. Tautan
        tidak berlaku bila undangan diganti (kirim ulang), akun tidak lagi `MENUNGGU`, atau email akun diubah
        sesudah undangan dikirim. Tidak menerbitkan sesi: pengguna masuk lewat `POST /v1/auth/login` (lockout dan
        MFA tetap berlaku di satu tempat). Tercatat di audit (`AKTIVASI_AKUN`, aktor = pemilik akun).
      operationId: authAktivasi
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AktivasiRequest"
      responses:
        "200":
          description: Akun aktif; masuk dengan kata sandi yang baru ditetapkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Kata sandi melanggar kebijakan (pesan memuat alasannya) atau badan tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tautan tidak valid, sudah dipakai, diganti undangan baru, atau kedaluwarsa (pesan membedakan kedaluwarsa)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/BatasLaju"

  /v1/auth/mfa/setup:
    post:
      summary: Memulai setup MFA (menghasilkan rahasia TOTP dan QR)
      description: |
        Rahasia disimpan bersegel AES (versi kunci tertera) dan belum aktif sampai `/v1/auth/mfa/verify`.
        Memanggil ulang sebelum verifikasi mengganti rahasia. Terbuka juga bagi sesi yang wajib setup MFA.
        Rahasia hanya ditulis bila MFA belum aktif (409 bila permintaan lain sudah mengaktifkannya): MFA yang baru
        diaktifkan tidak dimatikan oleh setup yang berjalan serentak.
      operationId: authMFASetup
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rahasia TOTP berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MFA sudah aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Kunci enkripsi MFA (AES_KEY) belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/verify:
    post:
      summary: Memverifikasi kode pertama dan mengaktifkan MFA
      description: |
        Menerbitkan kode cadangan (sekali tampil, hanya hash yang tersimpan) dan sesi baru: semua sesi lama
        dicabut dan sesi baru tidak lagi dibatasi ke setup MFA. Kode salah dihitung terhadap batas kunci akun.
      operationId: authMFAVerify
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA berhasil diaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponse"
        "400":
          description: Kode TOTP tidak valid (kode `MFA_CODE_INVALID`) atau setup belum dimulai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            MFA sudah aktif (mis. diaktifkan permintaan lain), atau rahasia setup diganti permintaan lain setelah
            kode diverifikasi (mulai ulang setup). MFA hanya diaktifkan bila rahasia yang tersimpan masih yang
            kodenya diverifikasi, sehingga aktivasi serentak tidak menerbitkan dua set kode cadangan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AkunTerkunci"

  /v1/auth/mfa/validate:
    post:
      summary: Menukar token tantangan MFA dan kode OTP dengan sesi
      description: |
        Publik (belum ada sesi). `code` adalah kode TOTP enam digit atau kode cadangan (huruf besar/kecil dan
        tanda hubung diabaikan). Kode TOTP hanya berlaku sekali per langkah waktu 30 detik; kode cadangan sekali
        pakai. Kode salah dihitung terhadap batas kunci akun yang sama dengan kata sandi salah. Bila token
        tantangan berasal dari masuk dengan Google, audit LOGIN yang ditulis di sini memuat `metode: sso_google`
        selain `mfa`.
      operationId: authMFAValidate
      tags:
        - Multi-Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAValidateRequest"
      responses:
        "200":
          description: Sesi diterbitkan (bentuk sama dengan login berhasil)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            Token tantangan tidak valid atau kedaluwarsa (kode `MFA_CHALLENGE_EXPIRED`; masuk ulang), atau kode
            salah (kode `MFA_CODE_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AkunTerkunci"
        "429":
          $ref: "#/components/responses/BatasLaju"

  /v1/auth/mfa/backup-codes:
    post:
      summary: Menerbitkan kode cadangan baru
      description: |
        Kode lama hangus. Memerlukan konfirmasi kata sandi, yang dihitung lockout akun seperti ganti kata sandi:
        kata sandi salah terhitung, akun terkunci dijawab 423 tanpa memeriksa kata sandi. Kode polos hanya tampil
        sekali.
      operationId: authMFABackupCodes
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: Kode cadangan baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFABackupCodesResponse"
        "400":
          description: MFA belum aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AkunTerkunci"

  /v1/auth/mfa/disable:
    post:
      summary: Menonaktifkan MFA
      description: |
        Memerlukan konfirmasi kata sandi, yang dihitung lockout akun seperti ganti kata sandi: kata sandi salah
        terhitung, akun terkunci dijawab 423 tanpa memeriksa kata sandi. Rahasia dan semua kode cadangan dihapus.
        Ditolak (403) untuk akun yang MFA-nya diwajibkan.
      operationId: authMFADisable
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA berhasil dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: MFA diwajibkan untuk akun ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          $ref: "#/components/responses/AkunTerkunci"

  /v1/users:
    get:
      summary: Mendaftar pengguna (cari, filter, urut, dan paginasi di server)
      description: |
        Memerlukan izin `pengguna.kelola`. Pencarian, filter, urutan, dan paginasi dijalankan di server.
        Filter digabung dengan AND; parameter kosong sama dengan tidak ada. Nilai yang tidak dikenal
        (peran, status, lapis, mfa, terkunci, sort, arah) atau `search` lebih dari 100 karakter dijawab 400.

        **Urutan.** `sort` hanya menerima kolom di daftar putih; tanpa `sort` urutannya `dibuat_pada` menurun
        (terbaru dulu), dan dengan `sort` tanpa `arah` urutannya menaik. Urutan selalu total: `id` menjadi
        tiebreaker pada arah yang sama, jadi paginasi stabil dan `desc` adalah kebalikan persis `asc`.
        `nama`, `email`, dan `lembaga` tak peka huruf besar-kecil; `peran` dan `status` mengikuti urutan deklarasi
        enum (peran: hierarki lapis, bukan abjad); `terakhir_masuk` menaruh akun yang belum pernah masuk selalu
        paling akhir pada kedua arah.

        **Filter terkunci** memakai tabel lockout (01-F): akun yang `terkunci_sampai`-nya belum lewat.
        Filter yang sama dipakai ekspor CSV pengguna.
      operationId: listUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PenggunaSearch"
        - $ref: "#/components/parameters/PenggunaPeran"
        - $ref: "#/components/parameters/PenggunaStatus"
        - $ref: "#/components/parameters/PenggunaLapis"
        - $ref: "#/components/parameters/PenggunaMfa"
        - $ref: "#/components/parameters/PenggunaTerkunci"
        - name: sort
          in: query
          schema:
            type: string
            enum: [nama, email, peran, lembaga, status, terakhir_masuk, dibuat_pada]
            default: dibuat_pada
          description: Kolom urutan
        - name: arah
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Arah urutan. Bawaan `asc` bila `sort` diberikan, selain itu `desc`.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Halaman
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Jumlah item per halaman
      responses:
        "200":
          description: Satu halaman pengguna beserta jumlah seluruh yang cocok dengan filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          description: Parameter tidak sah (nilai filter/urutan tidak dikenal, boolean bukan `true`/`false`, limit di luar 1-100)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Membuat pengguna baru
      operationId: createUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal, termasuk `id` yang bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email atau `id` sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}:
    get:
      summary: Mendapatkan detail pengguna
      operationId: getUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      responses:
        "200":
          description: Detail pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Mengubah sebagian data pengguna
      description: |
        Memerlukan izin `pengguna.kelola`. Hanya kolom yang dikirim yang ditulis. Mengganti `peran` (lapis ikut
        diturunkan dari peran kecuali `lapis` dikirim) atau menonaktifkan akun mengakhiri semua sesinya. Tercatat
        di audit (`UPDATE_USER`, sebelum/sesudah; perubahan peran masuk ke riwayat peran).

        **Akun `MENUNGGU`** (undangan): `status` tidak dapat diubah lewat endpoint ini (409; aktivasi hanya lewat
        tautan undangan, membatalkan undangan = menghapus akun), dan `MENUNGGU` tidak dapat dipasang pada akun lain
        (400). Mengubah `email` akun `MENUNGGU` menghanguskan tautan yang terlanjur dikirim ke alamat lama.

        **Pemegang terakhir** `pengguna.kelola`: mengganti peran atau menonaktifkan pengguna aktif terakhir yang
        memegang izin itu lewat perannya dijawab 409 `LAST_PERMISSION_HOLDER`. Galat basis data dijawab 500
        (bukan 404).
      operationId: updateUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Pengguna diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validasi gagal, peran tidak dikenal, atau status `MENUNGGU` dipasang manual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar, status akun `MENUNGGU` diubah, atau perubahan menghapus pemegang terakhir `pengguna.kelola` (`LAST_PERMISSION_HOLDER`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Menghapus pengguna
      description: |
        Memerlukan izin `pengguna.kelola`. Menghapus akun beserta sesinya (juga untuk membatalkan undangan akun
        `MENUNGGU`). Tercatat di audit (`DELETE_USER`).

        Akun sendiri ditolak (400). Pengguna yang masih dirujuk data lain (tugas, entri harga, audit) dijawab 409:
        nonaktifkan sebagai gantinya. Menghapus pemegang terakhir `pengguna.kelola` dijawab 409
        `LAST_PERMISSION_HOLDER`.
      operationId: deleteUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      responses:
        "200":
          description: Pengguna dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Menghapus akun sendiri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Pengguna masih tercatat sebagai pelaku data yang tidak boleh kehilangan asalnya (penginput, validator,
            atau penerbit entri harga; petugas atau pembuat tugas; pembuat kartu intervensi; penyusun brief;
            pemromosi model; pembuat skenario; pengaju perubahan master). Nonaktifkan akun sebagai gantinya
            (`PATCH /v1/users/{id}` dengan `status: NONAKTIF`). Juga dijawab 409 bila menghapus pemegang terakhir
            `pengguna.kelola` (`LAST_PERMISSION_HOLDER`). Sesi, token, kode MFA, izin langsung, undangan, dan
            preferensi notifikasi ikut terhapus; jejak audit dan log eksekusi dilepas dari akun (aktor menjadi kosong).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/reset-password:
    post:
      summary: Mengatur ulang kata sandi pengguna (oleh admin)
      description: |
        Memerlukan izin `pengguna.kelola`. Menetapkan kata sandi sementara tanpa tahu yang lama: akun wajib
        menggantinya saat masuk dan semua sesinya diakhiri. Tercatat di audit (`RESET_PASSWORD_ADMIN`, tanpa kata
        sandi). Akun `MENUNGGU` ditolak (409): gunakan `POST /v1/users/{id}/undang-ulang`.
      operationId: resetUserPassword
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordAdminRequest"
      responses:
        "200":
          description: Kata sandi diatur ulang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Kata sandi tidak memenuhi kebijakan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Akun masih menunggu aktivasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/roles:
    put:
      summary: Mengganti peran pengguna
      description: |
        Memerlukan izin `pengguna.kelola`. Mengganti peran (lapis ikut diturunkan) dan mengakhiri semua sesi
        pengguna supaya izin baru berlaku. Tercatat di audit (`ASSIGN_ROLE`, sebelum/sesudah) dan masuk ke
        `GET /v1/users/{id}/riwayat-peran`. Mengganti peran pemegang terakhir `pengguna.kelola` dijawab 409
        `LAST_PERMISSION_HOLDER`.
      operationId: assignUserRole
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "200":
          description: Peran diganti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Peran hilang atau tidak dikenal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Perubahan menghapus pemegang terakhir `pengguna.kelola` (`LAST_PERMISSION_HOLDER`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/buka-kunci:
    post:
      summary: Membuka kunci login pengguna (lockout)
      description: |
        Memerlukan izin `pengguna.kelola`. Menghapus hitungan percobaan gagal dan kunci login email pengguna itu
        sehingga ia dapat masuk lagi seketika. Idempoten: akun yang tidak terkunci dijawab 200 dengan
        `terkunci_sebelumnya: false`. Tercatat di audit trail (aksi `UNLOCK_USER`). Daftar dan detail pengguna
        memuat `terkunci_sampai` selama akun terkunci.
      operationId: bukaKunciUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      responses:
        "200":
          description: Kunci dibuka (atau akun memang tidak terkunci)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BukaKunciResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `pengguna.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/reset-mfa:
    post:
      summary: Mereset MFA seorang pengguna (kehilangan autentikator)
      description: |
        Memerlukan izin `pengguna.kelola`. Menonaktifkan MFA pengguna, mengosongkan rahasia TOTP terenkripsi,
        langkah TOTP anti-ulang, dan semua kode cadangan, lalu mengakhiri **semua sesi** pengguna itu (access
        token lama langsung ditolak). Semuanya dalam satu transaksi. Tercatat di audit trail (aksi `RESET_MFA`,
        sebelum/sesudah `mfa_aktif`).

        **Idempoten:** pengguna tanpa MFA dijawab 200 dengan `mfa_aktif_sebelumnya: false`; tidak ada yang
        berubah dan sesinya tidak dicabut (rahasia setup yang belum diverifikasi, bila ada, ikut dibersihkan).

        **Akun sendiri ditolak (400).** Pemilik akun memakai `POST /v1/auth/mfa/disable` yang meminta kata sandi
        dan menghormati MFA wajib; tanpa larangan ini sesi admin yang dibajak dapat melucuti MFA-nya sendiri.

        Peran yang mewajibkan MFA tidak dilepas: bila MFA diwajibkan lingkungan, login berikutnya pengguna itu
        mendapat `mfa_setup_diwajibkan: true` dan hanya endpoint setup MFA yang terbuka.
      operationId: resetUserMfa
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      responses:
        "200":
          description: MFA direset (atau pengguna memang tanpa MFA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetMFAResponse"
        "400":
          description: Akun sendiri tidak boleh direset lewat endpoint admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `pengguna.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/riwayat-peran:
    get:
      summary: Riwayat perubahan peran seorang pengguna
      description: |
        Memerlukan izin `pengguna.kelola`. Dibaca dari jejak audit (`audit_log`), terbaru lebih dulu: pembuatan
        akun dengan peran awalnya (`CREATE_USER`, `dari` null), `PUT /v1/users/{id}/roles` (`ASSIGN_ROLE`), dan
        `PATCH /v1/users/{id}` yang mengubah `peran` (`UPDATE_USER`), serta aksi lain yang mencatat peran
        sebelum/sesudah pada entitas pengguna (mis. undangan). Aksi yang peran sesudahnya sama dengan sebelumnya
        (mis. PATCH nama saja) dan aksi yang gagal atau ditolak tidak ikut. Akun yang dibuat lewat seeder tidak
        punya entri pembuatan. `aktor` null bila aksinya tanpa pelaku; `aktor.id` null bila akun pelaku sudah
        dihapus (nama dari snapshot audit tetap terbaca). `id` tiap entri adalah id baris audit
        (`GET /v1/audit/{id}`).
      operationId: getUserRoleHistory
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Jumlah entri terbaru yang dikembalikan
      responses:
        "200":
          description: Riwayat peran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiwayatPeranResponse"
        "400":
          description: Limit di luar 1-200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `pengguna.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/revoke-sessions:
    post:
      summary: Paksa keluar seorang pengguna
      operationId: revokeUserSessions
      description: |
        Mengakhiri semua sesi pengguna (izin `pengguna.kelola`). Access token dan refresh token
        pengguna itu berhenti berlaku seketika; ia dapat masuk lagi. Tercatat di audit (`FORCE_LOGOUT`).
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      responses:
        "200":
          description: Jumlah sesi yang dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForceLogoutResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/roles:
    get:
      summary: Matriks peran dengan izinnya yang berlaku
      description: |
        Memerlukan izin `pengguna.kelola`. Izin yang berlaku dibaca dari basis data (RBAC Opsi B, 02-C): `permissions`
        adalah izin peran saat ini, `bawaan` adalah matriks bawaan di kode (pembanding "pulihkan bawaan"), dan
        `versi` adalah kunci optimistis untuk `PUT /v1/roles/{id}/permissions`. Urutan peran baku (14 peran).
      operationId: listRoles
      tags:
        - User Management
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar peran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tidak memiliki izin `pengguna.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/roles/{id}/permissions:
    put:
      summary: Mengganti seluruh izin satu peran
      description: |
        Memerlukan izin `pengguna.kelola`. Mengganti himpunan izin peran (daftar kosong eksplisit sah). Perubahan
        berlaku pada request berikutnya di proses API ini (cache izin dibuang) dan paling lambat satu umur cache
        (bawaan 15 detik) di replika lain; token yang membawa salinan izin lama dijawab `401 PERMISSIONS_CHANGED`
        sampai disegarkan lewat refresh. Tercatat di audit (`UPDATE_ROLE_PERMISSIONS`, sebelum/sesudah).
        Mengganti dengan himpunan yang sama tidak menulis apa pun (versi tetap, tanpa audit).

        Kunci optimistis: `versi` harus sama dengan versi peran saat ini, kalau tidak `409 ROLE_VERSION_CONFLICT`
        (data berisi peran saat ini) dan tidak ada yang ditimpa. Nama izin harus ada di katalog
        (`400 UNKNOWN_PERMISSION`); katalog didefinisikan di kode. Perubahan yang membuat sistem tidak punya
        lagi pengguna aktif pemegang `pengguna.kelola` lewat perannya ditolak (`409 LAST_PERMISSION_HOLDER`).
      operationId: updateRolePermissions
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Kunci peran (nilai enum `peran`, mis. `OPS_MAHASISWA`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolePermissionsRequest"
      responses:
        "200":
          description: Peran setelah diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponseEnvelope"
        "400":
          description: "Validasi gagal atau izin di luar katalog (`UNKNOWN_PERMISSION`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tidak memiliki izin `pengguna.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Peran tidak dikenal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`ROLE_VERSION_CONFLICT` (diubah admin lain; data berisi peran saat ini) atau `LAST_PERMISSION_HOLDER`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/permissions:
    get:
      summary: Katalog izin
      description: |
        Memerlukan izin `pengguna.kelola`. Katalog 35 izin `domain.aksi` yang dikenal sistem, dengan deskripsi dan
        kelompok. Katalog didefinisikan di kode (route merujuk nama-namanya); UI tidak dapat menciptakan izin baru.
      operationId: listPermissions
      tags:
        - User Management
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Katalog izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tidak memiliki izin `pengguna.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/permissions:
    get:
      summary: Izin seorang pengguna (dari peran dan langsung)
      description: |
        Memerlukan izin `pengguna.kelola`. `izin_peran` dari perannya, `langsung` izin langsung (aktif dan yang
        sudah kedaluwarsa sebagai riwayat), dan `efektif` gabungan yang berlaku sekarang.
      operationId: listUserPermissions
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      responses:
        "200":
          description: Ringkasan izin pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPermissionsResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tidak memiliki izin `pengguna.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Pengguna tidak ditemukan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Memberi izin langsung kepada pengguna
      description: |
        Memerlukan izin `pengguna.kelola`. `alasan` wajib (maks. 500 karakter); `berlaku_sampai` (RFC 3339) opsional
        dan harus di masa depan, kosong berarti tanpa batas. Pemberi (`diberikan_oleh`) diambil dari token.
        Izin yang sudah dimiliki lewat peran ditolak (`409 PERMISSION_ALREADY_VIA_ROLE`) dan izin langsung yang masih
        berlaku ditolak (`409 DIRECT_PERMISSION_EXISTS`: cabut dulu bila ingin mengubah); baris yang sudah
        kedaluwarsa diganti. Berlaku pada request berikutnya; token pengguna yang membawa salinan lama dijawab
        `401 PERMISSIONS_CHANGED` sampai disegarkan. Tercatat di audit (`GRANT_USER_PERMISSION`).
      operationId: grantUserPermission
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantUserPermissionRequest"
      responses:
        "201":
          description: Izin langsung diberikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectPermissionEnvelope"
        "400":
          description: "Validasi gagal, izin di luar katalog (`UNKNOWN_PERMISSION`), alasan kosong, atau masa berlaku sudah lewat"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tidak memiliki izin `pengguna.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Pengguna tidak ditemukan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`PERMISSION_ALREADY_VIA_ROLE` atau `DIRECT_PERMISSION_EXISTS`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/permissions/{izin}:
    delete:
      summary: Mencabut izin langsung pengguna
      description: |
        Memerlukan izin `pengguna.kelola`. Menghapus izin langsung, aktif maupun yang sudah kedaluwarsa. Berlaku
        pada request berikutnya. Tercatat di audit (`REVOKE_USER_PERMISSION`).
      operationId: revokeUserPermission
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
        - name: izin
          in: path
          required: true
          schema:
            type: string
          description: Nama izin, mis. `kpi.lihat`
      responses:
        "200":
          description: Izin langsung dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeDirectPermissionResponse"
        "401":
          description: "Token tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tidak memiliki izin `pengguna.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Tidak ada izin langsung itu (`DIRECT_PERMISSION_NOT_FOUND`), atau `id` pengguna bukan UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/bulk:
    post:
      summary: Menjalankan aksi massal pada pengguna
      description: |
        Aksi `aktifkan` dan `nonaktifkan` melewati akun berstatus `MENUNGGU` (undangan): akun itu aktif hanya lewat
        `POST /v1/auth/aktivasi` dan dibatalkan dengan menghapusnya; jumlah `berhasil` hanya menghitung akun yang
        berubah.
      operationId: bulkUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUserRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUserResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Aksi `nonaktifkan` ditolak seluruhnya karena akan menghapus pemegang terakhir `pengguna.kelola` (`LAST_PERMISSION_HOLDER`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/undang:
    post:
      summary: Mengundang pengguna lewat email (kata sandi pertama ditetapkan pemiliknya)
      description: |
        Memerlukan izin `pengguna.kelola`. Membuat akun berstatus `MENUNGGU` tanpa kata sandi beserta satu undangan
        (token acak 256-bit, hanya hash-nya disimpan, berlaku 72 jam) dalam satu transaksi, lalu mengirim email
        berisi tautan `/aktivasi?token=...`. `id` dibuat server (UUID acak). Email dirapikan ke huruf
        kecil dan unik tanpa peduli huruf besar-kecil. Akun yang menunggu berperilaku seperti email tak terdaftar di
        login dan lupa kata sandi (tidak ada celah enumerasi). Kegagalan mengirim email (SMTP tidak dikonfigurasi,
        menolak, atau tidak menjawab dalam 10 detik) tidak membatalkan akun: `email_terkirim` bernilai `false` dan
        undangan dikirim ulang lewat `POST /v1/users/{id}/undang-ulang`. Tercatat di audit (`UNDANG_PENGGUNA`,
        tanpa token).
      operationId: undangUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndangPenggunaRequest"
      responses:
        "201":
          description: Akun dan undangan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndanganResponse"
        "400":
          description: Isian tidak valid (pesan merinci semua isian yang salah) atau peran/kabupaten tidak dikenal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `pengguna.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/undang-ulang:
    post:
      summary: Mengirim ulang undangan akun yang masih menunggu aktivasi
      description: |
        Memerlukan izin `pengguna.kelola`. Hanya untuk akun `MENUNGGU`. Semua undangan hidup akun itu dicabut dan
        diganti satu undangan baru (72 jam sejak sekarang) dalam satu transaksi; tautan lama langsung tidak
        berlaku. Dikirim ke email akun saat ini. Tercatat di audit (`UNDANG_ULANG_PENGGUNA`).
      operationId: undangUlangUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID pengguna (UUID kanonik). ID yang bukan UUID dijawab 404 tanpa menyentuh basis data
      responses:
        "200":
          description: Undangan baru dibuat (periksa `email_terkirim`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndanganResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `pengguna.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan, atau `id` bukan UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Akun tidak sedang menunggu aktivasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/impor:
    post:
      summary: Impor pengguna dari CSV (periksa dulu, lalu buat sebagai undangan)
      description: |
        Memerlukan izin `pengguna.kelola`. `csv` adalah teks berkas; header `nama,email,peran,lembaga,kabupaten_kode`
        (`kabupaten_kode` boleh tidak ada kolomnya; urutan kolom bebas; kolom lain ditolak), UTF-8 dengan atau tanpa
        BOM, pemisah koma atau titik koma (dideteksi dari header), CRLF atau LF. Maksimal 500 baris data dan 512 KB;
        baris yang seluruhnya kosong dilewati. Peran adalah id peran (huruf besar-kecil bebas). Nama, email, dan
        lembaga tidak boleh diawali `=`, `+`, `-`, atau `@` (dibaca sebagai rumus di spreadsheet).

        `dry_run: true` hanya mengurai dan memeriksa (tanpa menulis dan tanpa audit) lalu mengembalikan hasil per
        baris. `dry_run: false` memeriksa ulang dengan data terkini dan membuat akun `MENUNGGU` untuk baris yang sah
        dalam **satu transaksi** (semua atau tidak sama sekali); baris tidak sah tidak dibuat dan dilaporkan per
        baris tanpa menggagalkan yang lain. Bila sebuah email didaftarkan pihak lain di antara pemeriksaan dan
        penulisan, seluruh penulisan dibatalkan (409) dan impor diulang. Email undangan dikirim sesudah komit di
        latar belakang (konkurensi terbatas); kegagalan kirim tercatat di audit (`KIRIM_UNDANGAN`, `GAGAL`) dan
        akunnya tetap ada. `email_aktif: false` berarti SMTP tidak dikonfigurasi (tidak ada email dikirim).
        Audit: `UNDANG_PENGGUNA` per akun (`metadata.sumber = impor`) dan satu `IMPOR_PENGGUNA` berisi ringkasan.
      operationId: imporUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImporPenggunaRequest"
      responses:
        "200":
          description: Hasil pemeriksaan atau impor per baris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImporPenggunaResponse"
        "400":
          description: |
            Berkas ditolak seluruhnya: bukan UTF-8, kosong, tanpa baris data, header salah (kolom wajib hilang,
            kolom tak dikenal atau ganda), kutip tak berpasangan, lebih dari 500 baris, atau `csv`/`dry_run` tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `pengguna.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ada email yang didaftarkan pihak lain saat impor berjalan; tidak ada akun yang dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Teks CSV melebihi 512 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/ekspor:
    get:
      summary: Ekspor pengguna ke CSV
      description: |
        Memerlukan izin `pengguna.kelola`. CSV (titik koma, UTF-8 dengan BOM) berisi kolom tetap
        `id,nama,email,peran,lapis,lembaga,kabupaten_kode,status,mfa_aktif,terakhir_masuk,dibuat_pada`; tidak pernah
        memuat kata sandi, rahasia MFA, kode cadangan, atau token. Sel yang diawali `=`, `+`, `-`, `@`, tab, atau CR
        diberi awalan apostrof (anti injeksi rumus). Filter dan validasinya sama dengan `GET /v1/users` (`search`,
        `peran`, `status`, `lapis`, `mfa`, `terkunci`; nilai asing dijawab 400), ditambah `ids`
        untuk "ekspor yang dipilih" (maksimal 500 id; id yang tidak ada diabaikan; `ids` yang hanya berisi pemisah
        ditolak, bukan berubah menjadi semua pengguna). Maksimal 20.000 baris; sisanya ditandai
        `X-Export-Truncated`. Ekspor adalah keluarnya data pribadi (UU PDP): dicatat sebagai `EKSPOR_DATA` SEBELUM
        berkas diserahkan; bila audit gagal dicatat, berkas tidak diserahkan (500).
      operationId: eksporUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PenggunaSearch"
        - $ref: "#/components/parameters/PenggunaPeran"
        - $ref: "#/components/parameters/PenggunaStatus"
        - $ref: "#/components/parameters/PenggunaLapis"
        - $ref: "#/components/parameters/PenggunaMfa"
        - $ref: "#/components/parameters/PenggunaTerkunci"
        - name: ids
          in: query
          schema:
            type: string
          description: ID pengguna (UUID) dipisah koma (maksimal 500). Entri yang bukan UUID diabaikan; bila tidak ada yang tersisa, 400.
          example: 6f1c1a52-0a57-4b9a-8f0e-0d1f6f3c9a11,0b6c0d3e-77a3-4f0f-9d2c-1c0a8f6a2b34
      responses:
        "200":
          description: Berkas CSV
          headers:
            Content-Disposition:
              schema:
                type: string
              description: '`attachment; filename="pengguna-YYYY-MM-DD.csv"`'
            X-Export-Rows:
              schema:
                type: integer
              description: Jumlah baris data
            X-Export-Truncated:
              schema:
                type: string
                enum: ["true"]
              description: Ada bila hasil dipotong pada batas 20.000 baris
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: '`ids` tidak valid atau lebih dari 500, atau nilai filter tidak dikenal (sama dengan `GET /v1/users`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `pengguna.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Gagal menyusun berkas atau mencatat audit (berkas tidak diserahkan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga:
    get:
      summary: Mendaftar entri harga
      description: |
        Entri terbaru lebih dulu, disaring dan dipaginasi di server. Memerlukan izin `harga.lihat`.
        Jumlah seluruh hasil filter ada di header `X-Total-Count`.
      operationId: listHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - $ref: "#/components/parameters/HargaWilayah"
        - $ref: "#/components/parameters/HargaKomoditas"
        - name: pasar_id
          in: query
          schema:
            type: string
        - name: urut
          in: query
          description: Kosong untuk entri terbaru lebih dulu; `skor` untuk skor anomali tertinggi lebih dulu (prioritas antrean validasi)
          schema:
            type: string
            enum: [skor]
        - name: dari
          in: query
          description: Tanggal awal (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: sampai
          in: query
          description: Tanggal akhir (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Satu halaman entri harga
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil filter (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Mencatat entri harga baru
      description: |
        Entri disimpan berstatus DIAJUKAN atas nama pengguna. Memerlukan izin `harga.input`. Tercatat di audit trail.
        Header `Idempotency-Key` bersifat opsional di sini; bila dikirim, kiriman ulang oleh pengguna yang sama
        mengembalikan entri semula (200).
      operationId: createHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHargaRequest"
      responses:
        "201":
          description: Entri harga dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "400":
          description: Validasi gagal, komoditas atau pasar tidak ada, atau waktu pencatatan di masa depan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/saya:
    get:
      summary: Mendaftar entri harga milik pengguna yang masuk
      description: Riwayat petugas lapangan. Memerlukan izin `harga.input`. Parameter dan header sama dengan `GET /v1/harga`.
      operationId: listHargaSaya
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Entri milik pengguna
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/ringkasan:
    get:
      summary: Jumlah entri harga per status
      operationId: getHargaRingkasan
      tags:
        - Harga
