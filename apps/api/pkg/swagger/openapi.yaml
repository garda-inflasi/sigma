          type: string
          example: "200"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntriHarga"

    FlagValidasi:
      type: object
      description: |
        Hasil cek otomatis saat entri disimpan. `di_luar_rentang`: di luar `batas_harga` yang berlaku;
        `outlier`: |z-score| robust (median dan MAD histori resmi 30 hari sekabupaten) di atas 3,5, hanya
        bila histori minimal 5 harga; `duplikat`: pasar, komoditas, tipe, dan kode pedagang sama dalam 3 jam;
        `luar_geofence`: titik GPS di luar radius pasar; `tanpa_lokasi`: tanpa koordinat; `bentrok`: dipertahankan
        walau berbeda dari harga petugas lain.
      properties:
        di_luar_rentang:
          type: boolean
        outlier:
          type: boolean
        duplikat:
          type: boolean
        luar_geofence:
          type: boolean
        tanpa_lokasi:
          type: boolean
        bentrok:
          type: boolean
        median:
          type: integer
          description: Harga pembanding (median histori resmi, atau harga acuan master bila histori kurang)
        jarak_meter:
          type: integer
          description: Jarak titik GPS dari pasar

