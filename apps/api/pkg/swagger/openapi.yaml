  /v1/cold-storage:
    get:
      summary: Ringkasan cold storage — fasilitas, stok tersimpan, dan agregat food loss
      description: |
        Satu permintaan memuat seluruh data layar Cold storage & food loss:
        kartu fasilitas (selalu semua fasilitas), satu halaman stok yang dapat
        disaring/diurutkan, dan ringkasan seluruh stok.

        `stok` mengikuti filter, urutan, dan halaman. `meta.volume_hasil_ton`
        menjumlahkan seluruh hasil filter. `ringkasan` mencakup seluruh stok dan
        **tidak** terpengaruh filter. Urutan bawaan adalah sisa masa simpan
        tersingkat lebih dulu; id lot menjadi pemutus seri agar urutan antar-halaman stabil.

        Memerlukan izin `coldstorage.lihat`.
      operationId: getColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      parameters:
        - name: cold_storage_id
          in: query
          schema:
            type: string
            maxLength: 255
          description: Hanya stok pada fasilitas ini
          example: CS-03
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Cari pada nama komoditas atau pemilik (tanpa membedakan huruf besar/kecil)
          example: tomat
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                sisa_masa_simpan,
                komoditas,
                fasilitas,
                volume,
                masuk,
                risiko,
                pemilik,
              ]
            default: sisa_masa_simpan
          description: Kolom pengurutan stok
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Jumlah lot stok per halaman
      responses:
        "200":
          description: Data cold storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColdStorageResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `coldstorage.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage/bulk:
    post:
      summary: Menjalankan aksi massal pada lot stok cold storage
      description: |
        Aksi bersifat advisori: tidak mengubah stok, tetapi tercatat di audit trail
        (`BULK_<aksi>`). Lot yang tidak ditemukan dihitung pada `gagal`.

        Izin yang diperlukan bergantung pada aksi:

        | Aksi | Izin |
        |---|---|
        | `rencanakan_distribusi` | `logistik.kelola` |
        | `rekomendasi_olahan` | `coldstorage.kelola` |
      operationId: bulkColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkColdStorageRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkColdStorageResponse"
        "400":
          description: Validasi gagal, aksi tidak valid, atau tidak ada lot yang dipilih
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Peran tidak memiliki izin untuk aksi ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

