        dokumen:
          type: integer
          description: Respons yang berhasil diambil (disimpan di bronze)
        baris_dibaca:
          type: integer
        baris_diambil:
          type: integer
          description: Baris silver yang ditulis
        baris_tak_terpetakan:
          type: integer
        baris_tidak_valid:
          type: integer
        baris_ditolak:
          type: integer
