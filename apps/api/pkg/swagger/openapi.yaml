            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Daftar pasar
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil pencarian (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/master/komoditas/bulk:
    post:
      summary: Menjalankan aksi massal pada master komoditas
      description: |
        Mengubah status komoditas per item. Izin dibedakan menurut aksi:
        `setujui` membutuhkan `master.setujui` (STRATEGIS_BPS, STRATEGIS_FMIPA);
        `ajukan_perubahan` dan `arsipkan` membutuhkan `master.ajukan`
        (ADMIN_SISTEM, MANAJER_DATA, MANAJER_PROGRAM). Pemegang salah satunya
        melewati rute tetapi mendapat 403 untuk aksi yang bukan haknya.

        Transisi yang sah, dinilai per kode:
        - `ajukan_perubahan`: AKTIF → MENUNGGU_PERSETUJUAN
        - `setujui`: MENUNGGU_PERSETUJUAN → AKTIF, `versi` bertambah satu
        - `arsipkan`: AKTIF atau MENUNGGU_PERSETUJUAN → DIARSIPKAN (tidak ada pemulihan)

        Kode tak dikenal atau status yang tidak sesuai tidak menggagalkan permintaan;
        item itu dilaporkan di `rincian` dengan `berhasil: false` dan `pesan`. Kode
        ganda diproses sekali. Aksi yang mengubah data dicatat di audit trail.
      operationId: bulkKomoditas
      tags:
        - Master Data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkKomoditasRequest"
      responses:
        "200":
          description: Aksi massal diproses; lihat `rincian` untuk hasil tiap kode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkKomoditasResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Peran tidak memiliki izin untuk aksi ini (setujui tanpa master.setujui, atau ajukan/arsipkan tanpa master.ajukan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage:
    get:
      summary: Ringkasan cold storage — fasilitas, stok tersimpan, dan agregat food loss
      description: |
        Satu permintaan memuat seluruh data layar Cold storage & food loss:
        kartu fasilitas (selalu semua fasilitas), satu halaman stok yang dapat
        disaring/diurutkan, dan ringkasan seluruh stok.

        `stok` mengikuti filter, urutan, dan halaman. `meta.volume_hasil_ton`
        menjumlahkan seluruh hasil filter. `ringkasan` mencakup seluruh stok dan
        **tidak** terpengaruh filter. Urutan bawaan adalah sisa masa simpan
        tersingkat lebih dulu; id lot (BIGINT, diurutkan secara numerik) menjadi pemutus seri agar urutan antar-halaman stabil.

        Memerlukan izin `coldstorage.lihat`.
      operationId: getColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      parameters:
        - name: cold_storage_id
          in: query
          schema:
            type: string
            maxLength: 64
          description: >-
            Hanya stok pada fasilitas ini: UUID fasilitas atau kodenya (alias, mis. `CS-03`). Fasilitas yang
            tidak ada menghasilkan daftar kosong (bukan galat).
          example: CS-03
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Cari pada nama komoditas atau pemilik (tanpa membedakan huruf besar/kecil)
          example: tomat
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                sisa_masa_simpan,
                komoditas,
                fasilitas,
                volume,
                masuk,
                risiko,
                pemilik,
              ]
            default: sisa_masa_simpan
          description: Kolom pengurutan stok
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Jumlah lot stok per halaman
      responses:
        "200":
          description: Data cold storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColdStorageResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `coldstorage.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage/bulk:
    post:
      summary: Menjalankan aksi massal pada lot stok cold storage
      description: |
        `rencanakan_distribusi` dan `rekomendasi_olahan` bersifat advisori (tidak mengubah stok);
        `tandai_prioritas_jual` mengubah status lot dan `buang` mengeluarkan seluruh sisa lot
        (transaksi KELUAR per lot). Semua tercatat di audit trail (`BULK_<aksi>`). Lot yang tidak
        ditemukan atau sudah habis dihitung pada `gagal`; `rincian` memuat hasil per lot.

        `ids` adalah ID BIGINT lot (string desimal atau angka JSON); ID yang bukan bilangan bulat positif
        (mis. kode lama `STK-…` atau UUID) ditolak dengan 400.

        Izin yang diperlukan bergantung pada aksi:

        | Aksi | Izin |
        |---|---|
        | `rencanakan_distribusi` | `logistik.kelola` |
        | `rekomendasi_olahan` | `coldstorage.kelola` |
        | `tandai_prioritas_jual` | `coldstorage.kelola` |
        | `buang` | `coldstorage.kelola` |
      operationId: bulkColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkColdStorageRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkColdStorageResponse"
        "400":
          description: Validasi gagal, aksi tidak valid, atau tidak ada lot yang dipilih
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Peran tidak memiliki izin untuk aksi ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage/fasilitas/{id}:
    get:
      summary: Detail fasilitas cold storage (riwayat suhu, lot, transaksi)
      description: Memerlukan izin `coldstorage.lihat`.
      operationId: getColdStorageFasilitas
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            UUID fasilitas, atau kodenya sebagai alias (mis. `CS-01`, tautan lama tetap berlaku). Teks yang
            bukan UUID dan lebih panjang dari 64 karakter, serta fasilitas yang tidak ada, dijawab 404.
          schema:
            type: string
            maxLength: 64
          example: CS-01
        - name: jam
          in: query
          description: Rentang riwayat suhu dalam jam (bawaan 48, maksimum 720; paling banyak 1000 titik terbaru)
          schema:
            type: integer
            minimum: 1
            maximum: 720
            default: 48
      responses:
        "200":
          description: Detail fasilitas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailFasilitasResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `coldstorage.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Fasilitas tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Mengubah kapasitas, batas alarm suhu, atau status fasilitas
      description: |
        Memerlukan izin `coldstorage.kelola`. Perubahan tercatat di audit trail
        (`UBAH_FASILITAS_COLD_STORAGE`, dengan keadaan sebelum/sesudah). Kapasitas tidak boleh
        lebih kecil dari stok tersimpan (409); suhu minimum harus lebih kecil dari maksimum (400).
      operationId: patchColdStorageFasilitas
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID fasilitas, atau kodenya sebagai alias (mis. `CS-01`). Selain itu 404.
          schema:
            type: string
            maxLength: 64
          example: CS-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UbahFasilitasRequest"
      responses:
        "200":
          description: Fasilitas setelah perubahan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FasilitasColdStorageResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `coldstorage.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Fasilitas tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Kapasitas lebih kecil dari stok tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage/telemetri:
    post:
      summary: Menerima pembacaan suhu/kelembapan dari sensor atau gateway
      description: |
        Memerlukan izin `coldstorage.kelola` (akun layanan untuk gateway sensor). Idempoten:
        pembacaan dengan fasilitas dan waktu yang sama dilewati (`duplikat`). Suhu aktual fasilitas
        diturunkan dari pembacaan terbaru. Pembacaan di luar batas alarm dilaporkan pada
        `di_luar_rentang` (integrasi ke EWS menunggu rule engine 10-B). Fasilitas berstatus RENCANA
        menolak telemetri (409). Tercatat di audit trail (`INGEST_TELEMETRI`).
      operationId: ingestColdStorageTelemetri
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestTelemetriRequest"
      responses:
        "200":
          description: Pembacaan diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestTelemetriResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `coldstorage.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Fasilitas tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Fasilitas belum beroperasi (RENCANA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage/transaksi:
    post:
      summary: Mencatat transaksi stok (masuk, keluar, pindah)
      description: |
        Atomik dan terkunci per lot/fasilitas, sehingga dua permintaan serentak pada lot yang sama
        tidak dapat melampaui stok. `MASUK` membuat lot baru (fasilitas harus OPERASIONAL dan muat);
        `KELUAR` mengurangi lot (alasan wajib; lot menjadi HABIS bila kosong); `PINDAH` memindahkan
        seluruh atau sebagian lot ke fasilitas tujuan OPERASIONAL yang muat (sebagian membentuk lot baru).
        Izin: `coldstorage.kelola`; `PINDAH` juga boleh oleh `logistik.kelola`. Tercatat di audit trail
        (`TRANSAKSI_STOK_<JENIS>`, dengan keadaan lot sebelum/sesudah).

        ID transaksi dan lot dibuat basis data (BIGINT identity), bukan aplikasi. `lot_id` (wajib untuk
        `KELUAR` dan `PINDAH`) adalah ID BIGINT lot sebagai string desimal atau angka JSON; ID yang salah
        bentuk (kode lama `STK-…`, UUID, nol, negatif, pecahan) ditolak dengan 400, dan lot yang tidak ada 404.
        `fasilitas_id` dan `fasilitas_tujuan_id` menerima UUID fasilitas maupun kodenya (alias).
      operationId: createColdStorageTransaksi
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransaksiStokRequest"
      responses:
        "201":
          description: Transaksi tercatat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransaksiStokResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin untuk jenis transaksi ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lot, fasilitas, atau komoditas tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stok lot tidak cukup, lot sudah habis, fasilitas tidak beroperasi, atau kapasitas tidak cukup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/spasial/wilayah:
    get:
      summary: Mendaftar wilayah sebagai marker peta
      description: |
        Memerlukan izin `spasial.lihat`. Setiap kabupaten/kota dengan komoditas yang deviasi harganya
        terbesar (mutlak) pada periode neraca terbaru. Status: defisit (delta > 10), waspada (> 5),
        surplus (< -6), selain itu normal.
      operationId: listSpasialWilayah
      tags:
        - Spasial
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpasialMarkerListResponse"
        "403":
          description: Tanpa izin `spasial.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/spasial/geometri:
    get:
      summary: Geometri wilayah (FeatureCollection GeoJSON)
      description: |
        Memerlukan izin `spasial.lihat`. Geometri disimpan sebagai GeoJSON tanpa PostGIS dan
        disederhanakan (Douglas-Peucker) menurut `zoom`: toleransi 0,05° (zoom ≤ 6), 0,02° (≤ 8),
        0,008° (≤ 10), tanpa penyederhanaan (≥ 11). Data demo berupa **poligon perkiraan**
        (`properties.sumber = DEMO`, `perkiraan = true`), bukan batas administratif resmi.
      operationId: listSpasialGeometri
      tags:
        - Spasial
      security:
        - BearerAuth: []
      parameters:
        - name: zoom
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 22
            default: 8
        - name: bbox
          in: query
          description: "minLng,minLat,maxLng,maxLat; hanya wilayah yang kotak pembatasnya beririsan"
          schema:
            type: string
          example: "95.30,5.53,95.34,5.57"
      responses:
        "200":
          description: FeatureCollection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpasialGeometriResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `spasial.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/spasial/lokasi:
    get:
      summary: Wilayah untuk satu titik
      description: |
        Memerlukan izin `spasial.lihat`. Wilayah yang poligonnya memuat titik (bila tumpang tindih,
        yang pusatnya terdekat); bila tidak ada, wilayah dengan pusat terdekat (`di_dalam = false`).
      operationId: lokasiSpasial
      tags:
        - Spasial
      security:
        - BearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Wilayah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpasialLokasiResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `spasial.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Belum ada data wilayah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/spasial/optimasi-rute:
    post:
      summary: Menghitung (dan menyimpan) rencana distribusi optimal surplus ke defisit
      description: |
        Masalah transportasi min-cost flow atas neraca satu komoditas dan periode: pasokan = wilayah
        bersurplus, kebutuhan = wilayah berdefisit. Penyelesaian eksak (bukan serakah): volume tersalur
        dimaksimalkan lebih dulu, lalu ton-km diminimalkan. Jarak memakai cache `jarak_antar_wilayah`
        (mis. hasil OSRM) bila ada, selain itu jarak garis lurus × `faktor_jalan`; waktu tempuh dihitung
        pada 45 km/jam. `maks_jam_tempuh` melarang rute yang terlalu lama (komoditas mudah rusak).
        `penyesuaian` mensimulasikan skenario pasokan (ton positif menambah surplus); skenario tidak
        dapat disimpan.

        Simulasi memerlukan `spasial.lihat`. `simpan = true` memerlukan `logistik.kelola`: rencana
        ditulis ke `optimasi_rute`, rute menjadi usulan di `/v1/spasial/rute` (sumber `OPTIMASI`),
        rencana lama untuk komoditas dan periode yang sama ditandai `DIGANTIKAN`, dan aksi tercatat
        di audit trail (`OPTIMASI_RUTE`, `entitas_id` = ID BIGINT rencana).

        ID rencana dan rute dibuat basis data (BIGINT identity), bukan aplikasi: `optimasi_id` adalah ID
        itu sebagai string desimal dan `optimasi_kode` kode tampilannya (mis. `OPT-000042`). Menghapus
        rencana menghapus rutenya (CASCADE).
      operationId: optimasiRute
      tags:
        - Spasial
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimasiRuteRequest"
      responses:
        "200":
          description: Rencana distribusi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimasiRuteResponse"
        "400":
          description: Validasi gagal, atau skenario (penyesuaian) disertai `simpan`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `spasial.lihat`, atau `simpan` tanpa `logistik.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Belum ada neraca untuk komoditas dan periode itu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Rencana optimasi yang pernah disimpan
      description: Memerlukan izin `spasial.lihat`. Paling banyak 20 rencana, terbaru dulu.
      operationId: listOptimasiRute
      tags:
        - Spasial
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar rencana
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RencanaOptimasiListResponse"
        "403":
          description: Tanpa izin `spasial.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/spasial/neraca:
    get:
      summary: Neraca surplus/defisit per komoditas dan wilayah
      description: Memerlukan izin `spasial.lihat`. Tanpa `periode` dipakai periode terbaru. Data demo berlabel `sumber` DEMO.
      operationId: listSpasialNeraca
      tags:
        - Spasial
      security:
        - BearerAuth: []
      parameters:
        - name: komoditas
          in: query
          description: Kode komoditas
          schema:
            type: string
        - name: periode
          in: query
          description: Tanggal awal periode (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daftar neraca
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpasialNeracaListResponse"
        "403":
          description: Tanpa izin `spasial.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Format periode salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/spasial/rute:
    get:
      summary: Usulan rute distribusi dari sentra surplus ke wilayah tertekan
      description: Memerlukan izin `spasial.lihat`. Terurut dari biaya terbesar.
      operationId: listSpasialRute
      tags:
        - Spasial
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar rute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpasialRuteListResponse"
        "403":
          description: Tanpa izin `spasial.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/spasial/kandidat-cold-storage:
    get:
      summary: Kandidat lokasi cold storage
      description: Memerlukan izin `spasial.lihat`. Terurut dari skor tertinggi.
      operationId: listSpasialKandidat
      tags:
        - Spasial
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar kandidat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpasialKandidatListResponse"
        "403":
          description: Tanpa izin `spasial.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/policy-brief:
    get:
      summary: Mendaftar policy brief
      description: Seluruh brief, periode terbaru lebih dulu.
      operationId: listPolicyBrief
      tags:
        - Policy Brief
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyBriefListResponse"
        "403":
          description: Tanpa izin `brief.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/policy-brief/{id}:
    get:
      summary: Policy brief lengkap
      description: |
        Isi brief per bagian (ringkasan, temuan, risiko, rekomendasi untuk Pemda dan TPID) beserta
        lampiran sitasi sumber tiap angka, label draf yang wajib ditampilkan, dan jejak penyusunan
        (model, versi prompt, dan hash prompt bila LLM dipakai). Dipakai klien untuk memantau brief
        berstatus `DIPROSES` sampai `DRAF` atau `GAGAL`.
      operationId: getPolicyBrief
      tags:
        - Policy Brief
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: PB-2026-11
      responses:
        "200":
          description: Brief lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyBriefDetailResponse"
        "403":
          description: Tanpa izin `brief.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Brief tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/policy-brief/generate:
    post:
      summary: Menyusun draf policy brief
      description: |
        Memulai penyusunan draf untuk satu periode bulanan atas nama pemanggil (penyusun diambil dari
        token) dan segera menjawab brief berstatus `DIPROSES`; penyusunan berjalan di latar belakang dan
        dipantau lewat `GET /v1/policy-brief/{id}` sampai `DRAF` (atau `GAGAL`).

        Server lebih dulu merangkum data nyata (inflasi, harga, peringatan dini, proyeksi) menjadi daftar
        fakta. Narasi ditulis oleh LLM Claude bila `ANTHROPIC_API_KEY` dikonfigurasi (model dari
        `LLM_MODEL`, bawaan `claude-opus-5-5`), selain itu oleh templat deterministik. Anti-halusinasi:
        narasi menyebut angka hanya lewat placeholder `{{ID}}` yang diganti server dengan nilai fakta;
        narasi yang menulis angka sendiri atau memakai placeholder tak dikenal ditolak dan digantikan
        templat (alasannya dicatat). Hasil LLM berlabel "Draf AI — wajib ditelaah manusia".

        Brief `GAGAL`, atau `DIPROSES` yang tidak berubah lebih dari 5 menit (proses mati), dapat disusun
        ulang dengan permintaan yang sama. Aksi dicatat di audit trail (`GENERATE_BRIEF`,
        `BRIEF_DRAF_SELESAI`, `BRIEF_DRAF_GAGAL`).
      operationId: generatePolicyBrief
      tags:
        - Policy Brief
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePolicyBriefRequest"
      responses:
        "201":
          description: Penyusunan dimulai (status `DIPROSES`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyBriefCreatedResponse"
        "400":
          description: Periode kosong atau bukan YYYY-MM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `brief.susun`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Periode itu sudah punya brief (bukan GAGAL dan tidak basi)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/policy-brief/bulk:
    post:
      summary: Aksi massal pada policy brief
      description: |
        `telaah` memajukan DRAF menjadi TELAAH (izin `brief.susun`); `setujui` memajukan TELAAH
        menjadi DISETUJUI (izin `brief.setujui`). Brief yang tidak ada atau bukan di status asal
        dihitung gagal. Setiap perubahan dicatat di audit trail.
      operationId: bulkPolicyBrief
      tags:
        - Policy Brief
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPolicyBriefRequest"
      responses:
        "200":
          description: Hasil aksi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Aksi tidak dikenal atau id kosong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin untuk aksi tersebut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi:
    get:
      summary: Proyeksi harga seluruh komoditas
      description: |
        Proyeksi terbaru tiap komoditas dari model berstatus PRODUKSI untuk satu
        kabupaten dan horizon. Baris berpenanda `sumber: DEMO` berasal dari seed
        contoh, bukan model sungguhan.
      operationId: listPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      parameters:
        - name: kabupaten
          in: query
          description: Kode kabupaten/kota BPS (4 digit). Bawaan 1171 (Kota Banda Aceh).
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: horizon
          in: query
          description: Horizon proyeksi dalam hari (1-365). Bawaan 14.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Daftar proyeksi (kosong bila tidak ada proyeksi untuk kombinasi itu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiRingkasanListResponse"
        "400":
          description: Kabupaten atau horizon tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/ml:
    get:
      summary: Status layanan ML
      description: |
        Apakah `ML_SERVICE_URL` dikonfigurasi dan layanan ML menjawab. Layanan mati tidak
        membuat API gagal: pelatihan menjawab 503 dan proyeksi demo tetap tampil.
      operationId: statusMlPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Status layanan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiStatusMlResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/latih:
    post:
      summary: Latih model prediksi satu komoditas
      description: |
        Melatih model dari harga konsumen tervalidasi (rata-rata harian per kabupaten, 180 hari
        terakhir) lewat layanan ML: baseline naif, seasonal naive, Holt, dan Holt-Winters dipilih
        dengan backtest walk-forward. Hasilnya berupa baris registri berstatus KANDIDAT bersumber
        MODEL (MAPE/RMSE dari lipatan uji, MAPE baseline pada lipatan yang sama) dan proyeksi
        horizon 7, 14, 30 hari. Model baru belum dipakai sebelum dipromosikan. Izin `model.kelola`;
        dicatat di audit trail (`LATIH_MODEL`).
      operationId: latihModelPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrediksiKomoditasRequest"
      responses:
        "201":
          description: Model kandidat tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiModelResponse"
        "400":
          description: "`komoditas_kode` kosong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tanpa izin `model.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Entri harga tervalidasi belum cukup untuk dilatih
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Layanan ML menolak permintaan atau menjawab di luar kontrak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Layanan ML tidak dikonfigurasi, mati, atau kehabisan waktu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/segarkan:
    post:
      summary: Segarkan proyeksi model produksi hasil pelatihan
      description: |
        Meramal ulang dari harga terbaru dengan parameter model PRODUKSI yang sudah dilatih
        (tanpa melatih ulang); idempoten menurut tanggal target. Model produksi berupa data demo
        ditolak (409). Izin `model.kelola`; audit `SEGARKAN_PROYEKSI`.
      operationId: segarkanPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrediksiKomoditasRequest"
      responses:
        "200":
          description: Jumlah proyeksi yang ditulis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiSegarkanResponse"
        "403":
          description: "Tanpa izin `model.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Komoditas tanpa model produksi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Model produksi adalah data demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Tidak ada harga terbaru untuk diramal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Layanan ML tidak tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/evaluasi:
    post:
      summary: Evaluasi proyeksi yang sudah jatuh tempo
      description: |
        Membandingkan proyeksi bersumber MODEL yang tanggal targetnya sudah lewat dengan harga
        konsumen rata-rata hari itu (dasar `mape_realisasi` di registri). Idempoten; proyeksi tanpa
        data harga dilewati. Izin `model.kelola`; audit `EVALUASI_PREDIKSI`.
      operationId: evaluasiPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Jumlah proyeksi yang baru dievaluasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiEvaluasiResponse"
        "403":
          description: "Tanpa izin `model.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/registri:
    get:
      summary: Registri model prediksi
      description: Seluruh versi model (produksi, kandidat, arsip) beserta MAPE dan drift.
      operationId: listModelPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Registri model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiModelListResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/registri/bulk:
    post:
      summary: Promosikan atau arsipkan model (aksi massal)
      description: |
        `promosi` menjadikan model KANDIDAT atau ARSIP (rollback) sebagai PRODUKSI dan mengarsipkan
        model produksi komoditas yang sama dalam satu transaksi; `arsip` mengarsipkan KANDIDAT (model
        produksi tidak dapat diarsipkan langsung). Model yang tidak ada, berstatus tidak sesuai, belum
        punya proyeksi, atau (untuk model hasil pelatihan) MAPE backtest-nya lebih buruk dari baseline
        naif dilewati dan dilaporkan di `detail`. Izin `model.kelola`; riwayat di `model_promosi`;
        audit `PROMOSI_MODEL`/`ARSIP_MODEL`.
      operationId: bulkModelPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrediksiBulkModelRequest"
      responses:
        "200":
          description: Hasil aksi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiBulkModelResponse"
        "400":
          description: Aksi tidak dikenal atau id kosong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tanpa izin `model.kelola`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/simulasi:
    post:
      summary: Simulasi skenario what-if
      description: |
        Dihitung di server dari proyeksi model PRODUKSI (bawaan Kota Banda Aceh, 14 hari) ditambah
        efek tiap parameter (koefisien x parameter). Koefisien saat ini berupa asumsi generik
        (`sumber: ASUMSI`) karena riwayat pasokan, cuaca, dan subsidi belum tersedia untuk diestimasi;
        hasilnya diberi `terbatas: true` dan `catatan`. Skenario disimpan di `skenario_simulasi` dan
        dicatat di audit (`SIMULASI_SKENARIO`). Field yang tidak diisi berarti netral.
      operationId: simulasiPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrediksiSimulasiRequest"
      responses:
        "201":
          description: Hasil simulasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiSimulasiResponse"
        "400":
          description: Parameter di luar rentang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Tanpa izin `prediksi.lihat`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tidak ada proyeksi model produksi untuk komoditas, kabupaten, dan horizon itu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/{kode}:
    get:
      summary: Proyeksi harga dan penjelasan faktor satu komoditas
      description: |
        Seri grafik (riwayat harga konsumen tervalidasi bila ada, titik sambung pada
        hari dasar, titik proyeksi), kontribusi faktor ala SHAP, narasi dan rekomendasi
        dari templat aturan (bukan LLM), serta model yang menghasilkannya.
      operationId: getPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      parameters:
        - name: kode
          in: path
          required: true
          schema:
            type: string
          example: CBM-KRT
        - name: kabupaten
          in: query
          description: Kode kabupaten/kota BPS (4 digit). Bawaan 1171 (Kota Banda Aceh).
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: horizon
          in: query
          description: Horizon proyeksi dalam hari (1-365). Bawaan 14.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Proyeksi lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiProyeksiResponse"
        "400":
          description: Kabupaten atau horizon tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tidak ada proyeksi model produksi untuk kombinasi itu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/{kode}/export:
    get:
      summary: Unduh proyeksi satu komoditas (CSV)
      description: |
        Seri grafik `GET /v1/prediksi/{kode}` sebagai lampiran CSV (titik koma, BOM UTF-8):
        satu baris per titik (riwayat aktual, titik sambung, jalur proyeksi). Kolom:
        `komoditas_kode`, `komoditas_nama`, `kabupaten_kode`, `horizon_hari`, `tanggal`,
        `aktual`, `proyeksi`, `bawah`, `atas`, `model_versi`, `sumber`; sel kosong berarti
        titik itu tidak punya nilai tersebut.
      operationId: exportPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      parameters:
        - name: kode
          in: path
          required: true
          schema:
            type: string
        - name: kabupaten
          in: query
          description: Kode kabupaten/kota BPS (4 digit). Bawaan 1171 (Kota Banda Aceh).
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: horizon
          in: query
          description: Horizon proyeksi dalam hari (1-365). Bawaan 14.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Berkas CSV
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="proyeksi_CBM-KRT.csv"
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Kabupaten atau horizon tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tidak ada proyeksi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT yang diperoleh dari endpoint login

  responses:
    AkunTerkunci:
      description: |
        Akun terkunci karena terlalu banyak percobaan gagal (kode `ACCOUNT_LOCKED`). Header `Retry-After` dan
        `data.sisa_detik` memuat sisa kunci. Dijawab sama untuk email terdaftar maupun tidak.
      headers:
        Retry-After:
          description: Sisa kunci dalam detik
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AkunTerkunciResponse"

    BatasLaju:
      description: |
        Terlalu banyak percobaan dari IP klien ini (kode `RATE_LIMITED`; `AUTH_RATE_LIMIT_PER_MENIT`, bawaan 10 per
        menit). Header `Retry-After` dan `data.sisa_detik` memuat lama tunggu. Permintaan yang ditolak tidak
        diperiksa dan tidak dihitung sebagai percobaan lockout akun.
      headers:
        Retry-After:
          description: Lama tunggu dalam detik
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatasLajuResponse"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Kunci unik per kiriman (mis. UUID dari perangkat), maksimal 255 karakter
      schema:
        type: string
        maxLength: 255
    PenggunaSearch:
      name: search
      in: query
      description: Potongan nama, email, peran (id atau dengan spasi), atau lembaga; tak peka huruf besar-kecil, maksimal 100 karakter
      schema:
        type: string
        maxLength: 100
    PenggunaPeran:
      name: peran
      in: query
      description: Peran persis (salah satu dari `GET /v1/roles`)
      schema:
        type: string
        example: ADMIN_SISTEM
    PenggunaStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [AKTIF, NONAKTIF, MENUNGGU]
    PenggunaLapis:
      name: lapis
      in: query
      schema:
        type: string
        enum: [STRATEGIS, MANAJERIAL, OPERASIONAL, SISTEM]
    PenggunaMfa:
      name: mfa
      in: query
      description: "`true` = hanya akun dengan MFA aktif, `false` = hanya yang belum aktif"
      schema:
        type: string
        enum: ["true", "false"]
    PenggunaTerkunci:
      name: terkunci
      in: query
      description: "`true` = hanya akun yang login-nya sedang terkunci (lockout), `false` = hanya yang tidak"
      schema:
        type: string
        enum: ["true", "false"]
    HargaStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [DRAF, DIAJUKAN, DIVALIDASI, DIPUBLIKASI, DITOLAK]
    HargaWilayah:
      name: wilayah
      in: query
      description: Kode kabupaten/kota
      schema:
        type: string
    HargaKomoditas:
      name: komoditas
      in: query
      description: Kode komoditas
      schema:
        type: string

  schemas:
    # ── Kunci primer (docs/SKEMA-DATABASE.md) ──────────────────────────
    IdBigint:
      type: string
      pattern: "^[1-9][0-9]{0,18}$"
      description: >-
        ID BIGINT (identity) yang ditulis sebagai string desimal, agar nilai di atas 2^53 tetap utuh di
        JavaScript. Server juga menerima angka JSON di body. Path parameter yang bukan ID sah dijawab 404.
      example: "1024"
    IdUuid:
      type: string
      format: uuid
      description: ID UUID kanonik (huruf kecil). Path parameter yang bukan UUID sah dijawab 404.
      example: "f2356c7b-bb80-3d01-84c3-ba32f27a2910"
    KodeTampilan:
      type: string
      nullable: true
      maxLength: 64
      description: >-
        Kode tampilan atau ID lama sebelum standardisasi kunci primer (mis. INT-1000, EWS-0901). Unik; rute
        entitas yang punya kode juga menerimanya sebagai alias ID.
      example: "INT-1000"
    # ── Response Envelope ──────────────────────────────────────────────
    Envelope:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          nullable: true

    SuccessResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          nullable: true

    ErrorResponse:
      type: object
      description: |
        Amplop galat. `code` adalah status HTTP sebagai teks ("400", "404", ...) atau, untuk galat auth yang
        perlu dibedakan klien, salah satu kode stabil: `INVALID_CREDENTIALS` (401), `ACCOUNT_LOCKED` (423),
        `ACCOUNT_INACTIVE` (403), `MFA_CODE_INVALID` (401/400), `MFA_CHALLENGE_EXPIRED` (401),
        `PASSWORD_CHANGE_REQUIRED` (403), `MFA_SETUP_REQUIRED` (403), `PERMISSIONS_CHANGED` (401: salinan izin pada
        access token sudah berbeda dari izin efektif akun; klien menyegarkannya lewat refresh), dan untuk RBAC
        (02-C): `ROLE_VERSION_CONFLICT`, `LAST_PERMISSION_HOLDER`, `PERMISSION_ALREADY_VIA_ROLE`,
        `DIRECT_PERMISSION_EXISTS` (409), `UNKNOWN_PERMISSION` (400), `DIRECT_PERMISSION_NOT_FOUND` (404).
        Kode tidak berubah antara API Go dan BFF web.
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"
        data:
          nullable: true

    AkunTerkunciResponse:
      type: object
      description: Galat 423 `ACCOUNT_LOCKED`. Header `Retry-After` berisi `sisa_detik`.
      properties:
        code:
          type: string
          example: ACCOUNT_LOCKED
        message:
          type: string
          example: Akun terkunci karena terlalu banyak percobaan gagal. Coba lagi nanti.
        data:
          type: object
          properties:
            terkunci_sampai:
              type: string
              format: date-time
              description: Akhir kunci (UTC). Tetap sama selama terkunci, berapa pun percobaan yang masuk.
            sisa_detik:
              type: integer
              description: Sisa kunci dibulatkan ke atas
              example: 900

    BatasLajuResponse:
      type: object
      description: Galat 429 `RATE_LIMITED` dari batas laju endpoint auth publik. Header `Retry-After` berisi `sisa_detik`.
      properties:
        code:
          type: string
          example: RATE_LIMITED
        message:
          type: string
          example: Terlalu banyak percobaan dari perangkat ini. Coba lagi nanti.
        data:
          type: object
          properties:
            sisa_detik:
              type: integer
              description: Lama tunggu sampai percobaan berikutnya diizinkan, dibulatkan ke atas (minimal 1)
              example: 42

    UndangPenggunaRequest:
      type: object
      required:
        - nama
        - email
        - peran
        - lembaga
      properties:
        nama:
          type: string
          maxLength: 255
          example: Budi Santoso
        email:
          type: string
          format: email
          maxLength: 254
          example: budi@gardainflasi.id
        peran:
          type: string
          example: OPS_MAHASISWA
          description: Id salah satu peran (lihat `GET /v1/roles`); `lapis` diturunkan dari peran
        lembaga:
          type: string
          maxLength: 255
          example: FMIPA USK
        kabupaten_kode:
          type: string
          example: "1171"
          description: Kode BPS empat digit yang ada di master wilayah; kosong = seluruh Aceh

    UndanganResponse:
      type: object
      properties:
        code:
          type: string
          example: "201"
        message:
          type: string
          example: Created
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/UserObject"
            berlaku_sampai:
              type: string
              format: date-time
              description: Akhir masa berlaku tautan undangan
            email_terkirim:
              type: boolean
              description: |
                `false` bila SMTP tidak dikonfigurasi, menolak, atau tidak menjawab dalam 10 detik; akun dan
                undangan tetap ada dan bisa dikirim ulang
              example: true

    AktivasiRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          maxLength: 512
          description: Token dari tautan di email undangan
        password:
          type: string
          format: password
          minLength: 8
          description: Kata sandi pertama; kebijakan sama dengan atur ulang kata sandi, maksimal 72 karakter

    ImporPenggunaRequest:
      type: object
      required:
        - csv
        - dry_run
      properties:
        csv:
          type: string
          description: Isi berkas CSV sebagai teks (maksimal 512 KB, 500 baris data)
          example: "nama;email;peran;lembaga;kabupaten_kode\nBudi;budi@gardainflasi.id;OPS_MAHASISWA;FMIPA USK;1171\n"
        dry_run:
          type: boolean
          description: |
            Wajib eksplisit. `true` hanya memeriksa; `false` membuat akun undangan untuk baris yang sah

    ImporPenggunaResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            dry_run:
              type: boolean
            total:
              type: integer
              description: Jumlah baris data (baris kosong tidak dihitung)
            valid:
              type: integer
              description: Baris yang lolos pemeriksaan
            galat:
              type: integer
              description: Baris yang ditolak
            dibuat:
              type: integer
              description: Akun yang dibuat (0 pada dry run)
            email_aktif:
              type: boolean
              description: "`false` bila SMTP tidak dikonfigurasi (tidak ada email undangan dikirim)"
            baris:
              type: array
              items:
                type: object
                properties:
                  baris:
                    type: integer
                    description: Nomor baris di berkas (header = 1)
                    example: 2
                  nama:
                    type: string
                  email:
                    type: string
                    description: Huruf kecil
                  peran:
                    type: string
                    description: Huruf besar
                  lembaga:
                    type: string
                  kabupaten_kode:
                    type: string
                  status:
                    type: string
                    enum: [valid, galat, dibuat]
                  galat:
                    type: array
                    items:
                      type: string
                    description: Semua alasan penolakan baris ini (larik kosong bila sah)
                  id:
                    type: string
                    description: Id akun yang dibuat (hanya `status = dibuat`)

    BukaKunciResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 6f1c1a52-0a57-4b9a-8f0e-0d1f6f3c9a11
            terkunci_sebelumnya:
              type: boolean
              description: True bila akun memang sedang terkunci ketika dibuka

    RoleItem:
      type: object
      properties:
        id:
          type: string
          example: OPS_MAHASISWA
        label:
          type: string
          example: Agen Lapangan Mahasiswa
        lapis:
          type: string
          example: OPERASIONAL
        permissions:
          type: array
          items:
            type: string
          description: Izin peran saat ini (basis data)
        bawaan:
          type: array
          items:
            type: string
          description: Izin bawaan di kode (pembanding untuk memulihkan matriks bawaan)
        versi:
          type: integer
          format: int64
          description: Kunci optimistis; naik setiap matriks peran berubah
        diperbarui_pada:
          type: string
          format: date-time
        diperbarui_oleh:
          type: string
          format: uuid
          nullable: true
          description: ID admin yang terakhir mengubah matriks peran

    RoleListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleItem"

    RoleResponseEnvelope:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          $ref: "#/components/schemas/RoleItem"

    UpdateRolePermissionsRequest:
      type: object
      required: [permissions, versi]
      properties:
        permissions:
          type: array
          items:
            type: string
          description: Seluruh izin peran yang baru (menggantikan yang lama; kosong eksplisit sah)
        versi:
          type: integer
          format: int64
          minimum: 1
          description: Versi peran yang dibaca klien (`GET /v1/roles`)

    PermissionItem:
      type: object
      properties:
        id:
          type: string
          example: kpi.lihat
        deskripsi:
          type: string
          example: Melihat indikator kinerja (KPI)
        kelompok:
          type: string
          example: KPI

    PermissionListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: array
          items:
            $ref: "#/components/schemas/PermissionItem"

    DirectPermission:
      type: object
      properties:
        izin:
          type: string
          example: kpi.lihat
        deskripsi:
          type: string
        kelompok:
          type: string
        berlaku_sampai:
          type: string
          format: date-time
          nullable: true
          description: Kosong berarti tanpa batas
        alasan:
          type: string
        diberikan_oleh:
          type: string
          format: uuid
          nullable: true
        diberikan_oleh_nama:
          type: string
          nullable: true
        diberikan_pada:
          type: string
          format: date-time
        aktif:
          type: boolean
          description: False bila masa berlakunya sudah lewat (riwayat sampai dicabut)

    DirectPermissionEnvelope:
      type: object
      properties:
        code:
          type: string
          example: "201"
        message:
          type: string
          example: Created
        data:
          $ref: "#/components/schemas/DirectPermission"

    UserPermissionsResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            peran:
              type: string
            izin_peran:
              type: array
              items:
                type: string
            langsung:
              type: array
              items:
                $ref: "#/components/schemas/DirectPermission"
            efektif:
              type: array
              items:
                type: string
              description: Gabungan izin peran dan izin langsung yang masih berlaku

    GrantUserPermissionRequest:
      type: object
      required: [izin, alasan]
      properties:
        izin:
          type: string
          example: kpi.lihat
        berlaku_sampai:
          type: string
          format: date-time
          nullable: true
          description: Opsional; harus di masa depan. Kosong berarti tanpa batas.
        alasan:
          type: string
          maxLength: 500
          description: Wajib

    RevokeDirectPermissionResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            id:
              type: string
              description: ID pengguna
            izin:
              type: string

    ResetMFAResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 0b6c0d3e-77a3-4f0f-9d2c-1c0a8f6a2b34
            mfa_aktif_sebelumnya:
              type: boolean
              description: False berarti pengguna memang tanpa MFA; tidak ada yang berubah dan sesinya tidak dicabut
            sesi_dicabut:
              type: integer
              description: Jumlah sesi pengguna yang diakhiri (0 bila MFA tidak aktif)

    PerubahanPeran:
      type: object
      properties:
        id:
          type: string
          description: ID baris audit sumber (`GET /v1/audit/{id}`)
        waktu:
          type: string
          format: date-time
        aksi:
          type: string
          description: Aksi audit sumber
          example: ASSIGN_ROLE
        dari:
          type: string
          nullable: true
          description: Peran sebelumnya; null untuk peran awal saat akun dibuat
          example: OPS_MAHASISWA
        ke:
          type: string
          description: Peran sesudahnya
          example: MANAJER_DATA
        aktor:
          type: object
          nullable: true
          description: Pelaku; null bila aksinya tanpa pelaku terautentikasi
          properties:
            id:
              type: string
              nullable: true
              description: Null bila akun pelaku sudah dihapus
            nama:
              type: string
              nullable: true
              description: Nama pelaku saat aksi (snapshot audit)

    RiwayatPeranResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            items:
              type: array
              description: Terbaru lebih dulu
              items:
                $ref: "#/components/schemas/PerubahanPeran"
            terpotong:
              type: boolean
              description: True bila ada entri lebih lama di luar `limit`

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Opsional; menentukan sesi bila access token tidak membawa `sid`

    SessionInfo:
      type: object
      required:
        - id
        - perangkat
        - dibuat_pada
        - terakhir_dipakai_pada
        - kedaluwarsa_pada
        - saat_ini
      properties:
        id:
          type: string
          format: uuid
          description: Id sesi (family refresh token), sama dengan klaim `sid`
        perangkat:
          type: string
          example: Chrome di macOS
          description: Ringkasan user agent
        user_agent:
          type: string
          description: User agent mentah (dipotong 512 karakter)
        ip:
          type: string
          example: 203.0.113.7
          description: IP klien saat sesi dibuat atau token terakhir diputar
        dibuat_pada:
          type: string
          format: date-time
          description: Awal sesi (login)
        terakhir_dipakai_pada:
          type: string
          format: date-time
          description: Terakhir sesi menukar token (login atau refresh)
        kedaluwarsa_pada:
          type: string
          format: date-time
        saat_ini:
          type: boolean
          description: True untuk sesi tempat permintaan ini berasal

    SessionListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    SessionsRevokedResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            dicabut:
              type: integer
              description: Jumlah sesi yang diakhiri

    ForceLogoutResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            id:
              type: string
              description: ID pengguna
            dicabut:
              type: integer
              description: Jumlah sesi yang diakhiri

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: "2026-10-15T03:00:00Z"

    # ── Authentication ─────────────────────────────────────────────────
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@gardainflasi.id
        password:
          type: string
          format: password
          example: "Test1234!"

    LoginResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: Refresh token
            user:
              $ref: "#/components/schemas/UserObject"
            mfa_required:
              type: boolean
              description: True bila akun harus menyelesaikan MFA; token sesi dan user tidak disertakan
            mfa_token:
              type: string
              description: Token tantangan MFA (5 menit), bukan kredensial sesi
            mfa_setup_diwajibkan:
              type: boolean
              description: Sesi hanya membuka endpoint setup MFA sampai MFA diaktifkan

    SSOStatusResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            google:
              type: boolean
              description: SSO Google dikonfigurasi

    SSOAuthorizeResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            authorize_url:
              type: string
              description: URL otorisasi penerbit (response_type=code, state, nonce, code_challenge S256)
            binding:
              type: string
              description: Rahasia pengikat browser; simpan di cookie httpOnly, jangan di URL

    SSOCallbackRequest:
      type: object
      required:
        - code
        - state
        - binding
      properties:
        code:
          type: string
          maxLength: 2048
          description: Kode otorisasi dari penerbit
        state:
          type: string
          maxLength: 128
          description: State dari pengalihan penerbit
        binding:
          type: string
          maxLength: 128
          description: Binding dari respons authorize (cookie browser)

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token dari response login

    RefreshTokenResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
              description: |
                Refresh token pengganti. Tidak ada pada pemutaran ulang dalam jendela toleransi
                (lihat `POST /v1/auth/refresh`): pertahankan token yang sudah Anda miliki.

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: Password saat ini
        new_password:
          type: string
          format: password
          minLength: 8
          description: |
            Password baru. Minimal 8 karakter, mengandung huruf besar,
            angka, dan karakter spesial.

    ChangePasswordResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email pengguna yang terdaftar

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Token reset password dari email
        password:
          type: string
          format: password
          minLength: 8
          description: Password baru

    # ── MFA ────────────────────────────────────────────────────────────
    MFASetupResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            secret:
              type: string
              description: Rahasia base32 (20 byte acak) untuk entri manual di aplikasi autentikator
              example: JBSWY3DPEHPK3PXP
            provisioning_uri:
              type: string
              description: URI otpauth:// untuk kode QR
              example: otpauth://totp/Garda%20Inflasi:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Garda+Inflasi
            qr_svg:
              type: string
              description: Kode QR dari provisioning_uri sebagai dokumen SVG

    MFAVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: Kode TOTP 6 digit dari authenticator app
          example: "123456"

    MFAVerifyResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            kode_cadangan:
              type: array
              description: 10 kode cadangan sekali pakai, format XXXXX-XXXXX; hanya tampil sekali
              items:
                type: string

    MFABackupCodesResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            kode_cadangan:
              type: array
              items:
                type: string

    MFAValidateRequest:
      type: object
      required:
        - mfa_token
        - code
      properties:
        mfa_token:
          type: string
          description: Token tantangan dari respons login (mfa_required)
        code:
          type: string
          maxLength: 32
          description: Kode TOTP 6 digit atau kode cadangan
          example: "123456"

    MeResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          allOf:
            - $ref: "#/components/schemas/UserObject"
            - type: object
              properties:
                mfa_setup_diwajibkan:
                  type: boolean
                  description: Akun wajib MFA tetapi belum mengaktifkannya
                mfa_wajib:
                  type: boolean
                  description: MFA tidak boleh dinonaktifkan oleh pemilik akun
                kode_cadangan_tersisa:
                  type: integer
                  description: Hanya ada bila MFA aktif

    MFADisableRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: Password saat ini untuk konfirmasi

    # ── User ───────────────────────────────────────────────────────────
    UserObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 6f1c1a52-0a57-4b9a-8f0e-0d1f6f3c9a11
        nama:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: user@gardainflasi.id
        peran:
          type: string
          enum:
            - STRATEGIS_FMIPA
            - STRATEGIS_BI
            - STRATEGIS_BPS
            - STRATEGIS_DJPB
            - MANAJER_PROGRAM
            - MANAJER_DATA
            - MANAJER_KEBIJAKAN
            - MANAJER_PEMBIAYAAN
            - MANAJER_RISIKO
            - MANAJER_MUTU
            - OPS_KOORDINATOR
            - OPS_AGREGATOR
            - OPS_MAHASISWA
            - ADMIN_SISTEM
          example: ADMIN_SISTEM
        lapis:
          type: string
          enum:
            - STRATEGIS
            - MANAJERIAL
            - OPERASIONAL
            - SISTEM
          example: SISTEM
        lembaga:
          type: string
          example: BPPSDMP
        kabupaten_kode:
          type: string
          nullable: true
          example: "1171"
        mfa_aktif:
          type: boolean
          example: false
        status:
          type: string
          enum:
            - AKTIF
            - NONAKTIF
            - MENUNGGU
          example: AKTIF
        terakhir_masuk:
          type: string
          format: date-time
          nullable: true
        dibuat_pada:
          type: string
          format: date-time
        wajib_ganti_password:
          type: boolean
          description: |
            True bila kata sandi akun ditetapkan pihak lain (admin awal, akun baru, reset
            administrator). Selama aktif, semua endpoint selain `/v1/auth/change-password`,
            `/v1/auth/logout`, dan `/v1/auth/me` menjawab 403 dengan `code`
            `PASSWORD_CHANGE_REQUIRED`.
          example: false
        terkunci_sampai:
          type: string
          format: date-time
          description: |
            Hanya pada `GET /v1/users` dan `GET /v1/users/{id}` (pengguna.kelola), dan hanya selama login akun
            terkunci karena percobaan gagal berulang: akhir kunci (UTC). Dibuka lewat
            `POST /v1/users/{id}/buka-kunci`.

    UserResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/UserObject"

    CreateUserRequest:
      type: object
      description: |
        Membuat akun dengan kata sandi sementara (jalur kedua; cara utama adalah `POST /v1/users/undang`). `password`
        wajib; akun wajib mengganti kata sandi saat masuk pertama. `id` opsional: kosong berarti server membuat UUID
        acak; bila dikirim harus UUID yang sah (selain itu 400) dan belum dipakai (selain itu 409).
      required:
        - nama
        - email
        - password
        - peran
        - lapis
        - lembaga
      properties:
        id:
          type: string
          format: uuid
          description: Opsional. UUID akun; kosong = dibuat server (gen_random_uuid). Dinormalkan ke huruf kecil.
          example: 6f1c1a52-0a57-4b9a-8f0e-0d1f6f3c9a11
        nama:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@gardainflasi.id
        password:
          type: string
          format: password
          minLength: 8
          description: Kata sandi sementara; harus memenuhi kebijakan kata sandi
        peran:
          type: string
          example: OPS_MAHASISWA
        lapis:
          type: string
          example: OPERASIONAL
        lembaga:
          type: string
          example: BPPSDMP

    UpdateUserRequest:
      type: object
      description: Semua kolom opsional; hanya yang dikirim yang ditulis.
      properties:
        nama:
          type: string
        email:
          type: string
          format: email
        peran:
          type: string
          example: MANAJER_DATA
        lapis:
          type: string
          description: Bila kosong, lapis diturunkan dari `peran` yang baru.
        lembaga:
          type: string
        kabupaten_kode:
          type: string
          example: "1171"
        status:
          type: string
          enum: [AKTIF, NONAKTIF, MENUNGGU]
          description: |
            `MENUNGGU` tidak dapat dipasang manual (400) dan status akun `MENUNGGU` tidak dapat diubah (409).

    AssignRoleRequest:
      type: object
      required:
        - peran
      properties:
        peran:
          type: string
          example: MANAJER_DATA

    ResetPasswordAdminRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          format: password
          minLength: 8

    UserListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserObject"
            total:
              type: integer
              example: 42
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20

    # ── Bulk Operations ────────────────────────────────────────────────
    BulkActionRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          description: Nama aksi massal (bergantung pada modul)
          example: proses
        ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [1, 2, 3]

    BulkUserRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [aktifkan, nonaktifkan, wajibkan_mfa, akhiri_sesi]
        ids:
          type: array
          minItems: 1
          description: ID pengguna (UUID). Satu saja yang bukan UUID membuat seluruh permintaan ditolak (400).
          items:
            type: string
            format: uuid
          example: ["6f1c1a52-0a57-4b9a-8f0e-0d1f6f3c9a11", "0b6c0d3e-77a3-4f0f-9d2c-1c0a8f6a2b34"]

    BulkSumberDataRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [jeda, lanjutkan]
        ids:
          type: array
          minItems: 1
          maxItems: 100
          description: UUID sumber atau kodenya (alias ID lama); entri ganda atau dua entri untuk sumber yang sama dihitung satu
          items:
            anyOf:
              - $ref: "#/components/schemas/IdUuid"
              - type: string
                maxLength: 64
          example: ["SRC-BPS", "SRC-BI"]

    KpiNilai:
      type: object
      properties:
        periode:
          type: string
          format: date
          description: Bulan (tanggal 1)
        nilai:
          type: number
        versi:
          type: integer
          description: Revisi menambah versi; versi terbesar yang berlaku
        dihitung_pada:
          type: string
          format: date-time

    Kpi:
      type: object
      properties:
        kode:
          type: string
          example: LOG-UTILISASI-CS
        kelompok:
          type: string
          enum: [DATA_SISTEM, LOGISTIK, DAMPAK_EKONOMI, TINDAK_LANJUT]
        nama:
          type: string
        deskripsi:
          type: string
        rumus:
          type: string
        satuan:
          type: string
        arah_baik:
          type: string
          enum: [NAIK, TURUN]
        frekuensi:
          type: string
          enum: [HARIAN, MINGGUAN, BULANAN, TRIWULAN]
        otomatis:
          type: boolean
          description: Ada penghitung otomatis; false = menunggu model atau data lain
        target:
          type: object
          nullable: true
          properties:
            nilai:
              type: number
            ambang_waspada:
              type: number
              nullable: true
            baseline:
              type: number
              nullable: true
              description: Kosong sampai ditetapkan pemangku kepentingan
            periode_mulai:
              type: string
              format: date
        nilai:
          allOf:
            - $ref: "#/components/schemas/KpiNilai"
          nullable: true
        tren:
          type: array
          items:
            $ref: "#/components/schemas/KpiNilai"
        status:
          type: string
          enum: [TERCAPAI, WASPADA, TIDAK_TERCAPAI, TANPA_TARGET, MENUNGGU_DATA]

    KpiListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Kpi"

    KpiRiwayatResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            kpi:
              $ref: "#/components/schemas/Kpi"
            riwayat:
              type: array
              items:
                $ref: "#/components/schemas/KpiNilai"

    SumberAngka:
      type: string
      enum: [BPS, BI, DJPB, BAPANAS, DEMO]
      description: Asal angka; DEMO = data contoh, bukan angka resmi

    RingkasanEksekutif:
      type: object
      properties:
        demo:
          type: boolean
          description: Benar bila ada blok ber-sumber DEMO
        inflasi:
          type: object
          nullable: true
          properties:
            periode:
              type: string
              format: date
              description: Bulan data (tanggal 1)
            sumber:
              $ref: "#/components/schemas/SumberAngka"
            diimpor_pada:
              type: string
              format: date-time
            ihk:
              type: number
            yoy:
              type: number
            mtm:
              type: number
            ytd:
              type: number
            sasaran:
              type: object
              properties:
                tahun:
                  type: integer
                bawah:
                  type: number
                atas:
                  type: number
            seri:
              type: array
              description: Paling banyak 12 bulan, urut naik
              items:
                type: object
                properties:
                  periode:
                    type: string
                    format: date
                  yoy:
                    type: number
            penyumbang:
              type: array
              description: Paling banyak 6 komoditas, andil terbesar lebih dulu
              items:
                type: object
                properties:
                  kode:
                    type: string
                  nama:
                    type: string
                  andil:
                    type: number
                    description: Poin persen
        neraca:
          type: object
          nullable: true
          properties:
            periode:
              type: string
              format: date
            sumber:
              $ref: "#/components/schemas/SumberAngka"
            items:
              type: array
              items:
                type: object
                properties:
                  komoditas_kode:
                    type: string
                  nama:
                    type: string
                  produksi_ton:
                    type: number
                  konsumsi_ton:
                    type: number
                  stok_ton:
                    type: number
                    nullable: true
        fiskal:
          type: object
          nullable: true
          description: Null bila belum ada data atau peran tanpa `fiskal.lihat`
          properties:
            sumber:
              $ref: "#/components/schemas/SumberAngka"
            per_tanggal:
              type: string
              format: date
            pagu:
              type: integer
              format: int64
            realisasi:
              type: integer
              format: int64
            skor:
              type: integer
              description: Indikatif, dari porsi pagu yang belum terealisasi (0-100)
            status:
              type: string
              enum: [MEMADAI, TERBATAS, KRITIS]
            instrumen:
              type: array
              items:
                type: object
                properties:
                  nama:
                    type: string
                  pagu:
                    type: integer
                    format: int64
                  realisasi:
                    type: integer
                    format: int64
        ews:
          type: object
          description: Peringatan belum selesai per severity
          additionalProperties:
            type: integer
          example: { INFO: 0, WASPADA: 2, SIAGA: 1, KRITIS: 0 }
        intervensi:
          type: object
          description: Kartu per siklus (normal, tekanan, surplus)
          additionalProperties:
            type: object
            properties:
              aktif:
                type: integer
              selesai:
                type: integer
        siklus_dominan:
          type: string
          enum: [normal, tekanan, surplus]

    RingkasanEksekutifResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
