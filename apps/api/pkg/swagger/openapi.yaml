        cold storage) dari materialized view `mv_kpi_operasional`, yang disegarkan berkala dan setelah
        harga divalidasi atau dipublikasi. `tren` memuat 14 hari terakhir. `tone` mengikuti pencapaian
        target (`target_kpi`); kartu tanpa target bernada `data`. Memerlukan izin `dashboard.operasional`.
