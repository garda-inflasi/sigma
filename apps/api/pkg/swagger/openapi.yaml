                    type: string
                  lat:
                    type: number
                  lng:
                    type: number
                  radius_meter:
                    type: integer
            harga_acuan:
              type: array
              items:
                type: object
                properties:
                  komoditas_kode:
                    type: string
                  kabupaten_kode:
                    type: string
                  tipe:
                    type: string
                    enum: [PRODUSEN, KONSUMEN]
                  median:
                    type: integer
                  bawah:
                    type: integer
                  atas:
                    type: integer
                  sampel:
                    type: integer

    BulkHargaRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [ajukan, validasi, publikasi, tolak, kembalikan]
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          description: >-
            ID BIGINT entri sebagai string angka. ID yang bentuknya salah (mis. kode lama `HRG-...`) menolak
            seluruh permintaan dengan 400.
          items:
            $ref: "#/components/schemas/IdBigint"
        alasan:
          type: string
          maxLength: 1000
          description: Wajib (minimal 3 karakter) untuk aksi tolak; opsional untuk aksi lain

    BulkHargaResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            berhasil:
              type: integer
              description: Entri yang statusnya berubah
            gagal:
              type: integer
              description: Entri yang dilewati
            rincian:
              type: array
              description: Tiap entri yang dilewati beserta sebabnya, urut seperti permintaan
              items:
                type: object
                properties:
                  id:
                    $ref: "#/components/schemas/IdBigint"
                  sebab:
                    type: string
                    enum: [tidak_ditemukan, status_tidak_sesuai, pemisahan_tugas, bukan_pemilik]

    EntriHarga:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/IdBigint"
        kode:
          allOf:
            - $ref: "#/components/schemas/KodeTampilan"
          description: >-
            ID lama entri (mis. `HRG-D00-00-01-K`, atau UUID untuk entri buatan aplikasi lama); null untuk entri
            baru. Teks untuk manusia memakai `kode` bila ada, selain itu `id`.
          example: "HRG-D00-00-01-K"
        komoditas_kode:
          type: string
        komoditas_nama:
          type: string
        pasar_id:
          type: string
        pasar_nama:
          type: string
        kabupaten_kode:
          type: string
        wilayah:
          type: string
          description: Nama resmi kabupaten/kota
          example: KABUPATEN ACEH BESAR
        tipe:
          type: string
          enum: [PRODUSEN, KONSUMEN]
        harga:
          type: integer
        satuan:
          type: string
        kualitas:
          type: string
          enum: [PREMIUM, MEDIUM, ASALAN]
        petugas_id:
          type: string
          format: uuid
          nullable: true
        petugas_nama:
          type: string
          nullable: true
        dicatat_pada:
          type: string
          format: date-time
        status:
          type: string
          enum: [DRAF, DIAJUKAN, DIVALIDASI, DIPUBLIKASI, DITOLAK]
        deviasi_pct:
          type: number
          description: Deviasi terhadap median histori resmi (atau harga acuan master bila histori kurang), dalam persen
        skor_anomali:
          type: number
          description: 0 sampai 1; gabungan deviasi, z-score, dan penalti bendera validasi otomatis
        ada_foto:
          type: boolean
        dalam_geofence:
          type: boolean
        alasan_penolakan:
          type: string
          nullable: true
          description: Terisi untuk entri DITOLAK; terlihat oleh petugas pencatat

    EntriHargaListResponse:
      type: object
      properties:
