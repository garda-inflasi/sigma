    # ── Create Payloads ────────────────────────────────────────────────
    CreateHargaRequest:
      type: object
      required:
        - komoditas_kode
        - pasar_id
        - tipe
        - harga
      properties:
        komoditas_kode:
          type: string
          example: BWM
        pasar_id:
          type: string
          example: PSR-1171-01
        tipe:
          type: string
          enum: [PRODUSEN, KONSUMEN]
        harga:
          type: integer
          minimum: 1
          description: Rupiah per satuan komoditas (satuan diambil dari master komoditas)
          example: 43500
        kualitas:
          type: string
          enum: [PREMIUM, MEDIUM, ASALAN]
          default: MEDIUM
        kode_pedagang:
          type: string
          maxLength: 100
          description: Kode pedagang, bukan nama atau nomor telepon
        catatan:
          type: string
          maxLength: 1000
        dicatat_pada:
          type: string
          format: date-time
          description: Waktu pencatatan di lapangan; bawaan sekarang, tidak boleh di masa depan
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Harus diisi bersamaan dengan `lng`
        lng:
          type: number
          minimum: -180
          maximum: 180
        pertahankan:
          type: boolean
          description: Simpan walau bentrok dengan harga petugas lain

    CreateHargaResponse:
      type: object
      properties:
        code:
          type: string
          example: "201"
        message:
          type: string
        data:
          type: object
          properties:
            id:
