[project]
name = "garda-ml"
version = "0.2.0"
description = "Layanan ML Garda Inflasi: server HTTP tanpa dependensi dan pipeline training multi-model"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Dependensi pipeline tabular (LightGBM + HistGradientBoosting + scikit-learn + statsmodels + SHAP).
tabular = [
    "numpy>=2.1,<2.5",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<1.8",
    "lightgbm>=4.5,<5",
    "statsmodels>=0.14.4,<0.15",
    "shap>=0.48,<1",
    "pymongo>=4.10,<5",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4",
]
# Alias `pipeline` dipertahankan agar Dockerfile & Makefile existing tetap berjalan mulus.
pipeline = [
    "numpy>=2.1,<2.5",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<1.8",
    "lightgbm>=4.5,<5",
    "statsmodels>=0.14.4,<0.15",
    "shap>=0.48,<1",
    "pymongo>=4.10,<5",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4",
]
deep = [
    "torch>=2.5,<3",
]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integrasi: butuh MongoDB sungguhan lewat GARDA_UJI_MONGO_URI",
    "integration: requires real MongoDB via GARDA_UJI_MONGO_URI",
]
