# Garda Inflasi — Infrastruktur (PostgreSQL, Redis, MongoDB, pgAdmin)
# ================================================================
# Compose file terpisah untuk layanan data/infra.
# Port diekspos ke host agar bisa diakses untuk remote data access / tooling.
#
# Jalankan:
#   docker compose -f compose.infra.yaml up -d
#
# Network: garda_inflasi_net (dibuat otomatis, digunakan oleh compose.yaml)

name: garda-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: garda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garda_inflasi}
      POSTGRES_USER: ${POSTGRES_USER:-garda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garda_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-garda} -d ${POSTGRES_DB:-garda_inflasi}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garda_inflasi_net

  # Backup terjadwal (opsional): docker compose -f compose.infra.yaml --profile backup up -d backup
  # Menjalankan scripts/backup/backup.sh tiap BACKUP_INTERVAL_SECONDS (bawaan 24 jam),
  # dump + checksum + manifest ke ./backups dengan retensi. Uji pemulihannya berkala
  # dengan scripts/backup/verify-restore.sh (make db/backup/verify). Lihat docs/DEPLOYMENT.md.
  backup:
    image: postgres:16-alpine
    container_name: garda-backup
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sh /scripts/backup.sh >/dev/null || echo "backup GAGAL" >&2
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-garda}
      PGPASSWORD: ${POSTGRES_PASSWORD:-garda_secret}
      PGDATABASE: ${POSTGRES_DB:-garda_inflasi}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_KEEP_MIN: "${BACKUP_KEEP_MIN:-3}"
    volumes:
      - ./scripts/backup:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      # Sehat bila ada dump yang lebih baru dari 2x interval.
      test:
        [
          "CMD-SHELL",
          "find /backups -name '*.dump' -mmin -$$((BACKUP_INTERVAL_SECONDS * 2 / 60)) | grep -q .",
        ]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garda_inflasi_net

  redis:
    image: redis:7-alpine
    container_name: garda-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garda_inflasi_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: garda-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gardainflasi.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_SERVER_MODE:-False}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: ${PGADMIN_SCRIPT_NAME:-}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garda_inflasi_net

  mongodb:
    image: mongo:7
    container_name: garda-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-garda}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-garda_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-garda_inflasi}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garda_inflasi_net

  # Medallion Object Storage (opsional, nyalakan dengan --profile medallion)
  minio:
    image: minio/minio:latest
    container_name: garda-minio
    profiles: ["medallion"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-garda_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-garda_minio_secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - garda_inflasi_net

  # Experiment tracking server MLflow (opsional, metadata backend di PostgreSQL; nyalakan dengan --profile medallion)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: garda-mlflow
    profiles: ["medallion"]
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-garda}:${POSTGRES_PASSWORD:-garda_secret}@postgres:5432/${POSTGRES_DB:-garda_inflasi}
      --default-artifact-root s3://ml-models/mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-garda_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-garda_minio_secret}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5005}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - garda_inflasi_net

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-garda_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-garda_redis_data}
  pgadmin_data:
    name: ${PGADMIN_VOLUME:-garda_pgadmin_data}
  mongo_data:
    name: ${MONGO_VOLUME:-garda_pipeline_mongo_data}
  minio_data:
    name: ${MINIO_VOLUME:-garda_minio_data}

networks:
  garda_inflasi_net:
    name: garda_inflasi_net
    driver: bridge
    attachable: true
