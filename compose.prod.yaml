# ==============================================================================
#  Garda Inflasi — compose.prod.yaml
#  Production override for the VM.
#
#  Purpose: force `docker compose up` on the VM to run pre-built tagged images
#  (built on the VM from temporary `.build-src` by remote-deploy.sh, after which
#  `.build-src` is removed cleanly), so `build: !reset null` strips inherited
#  build sections and `compose up --no-build` never expects local source code.
#  (`!reset` is the Compose override tag for deleting an inherited key; a plain
#  `build: null` is rejected by Compose v2.20+ with "must be a string".)
#
#  Usage (on the VM):
#      API_IMAGE_TAG=<tag> WEB_IMAGE_TAG=<tag> ML_IMAGE_TAG=<tag> docker compose \
#        -f compose/compose.infra.yaml -f compose/compose.prod.yaml up -d --no-build
#      API_IMAGE_TAG=<tag> WEB_IMAGE_TAG=<tag> ML_IMAGE_TAG=<tag> docker compose \
#        -f compose/compose.yaml -f compose/compose.prod.yaml -f compose/compose.gateway.yaml up -d --no-build
#
#  Each service falls back to IMAGE_TAG then `latest`.
# ==============================================================================

# CATATAN PENTING: file ini dipakai bersama oleh stack infra DAN stack aplikasi
# (-f compose.infra.yaml -f compose.prod.yaml dan -f compose.yaml -f compose.prod.yaml),
# jadi tiap stack melihat juga stub service milik stack lain. SELALU sebut nama
# service pada `up` (lihat scripts/deploy/remote-deploy.sh dan rollback.sh); `up -d`
# tanpa nama akan ikut menaikkan stub tersebut (mis. postgres tanpa volume).
#
# Service `mailpit` di compose.yaml (penangkap email dev/demo) berada di profil `mailpit` dan sengaja
# tidak disebut di sini: tanpa COMPOSE_PROFILES=mailpit ia tidak pernah ikut berjalan di VM.
# Hal yang sama berlaku untuk `sso-mock` (penyedia OIDC palsu untuk masuk dengan Google di dev/demo/e2e,
# profil `sso-mock`): jangan pernah mengisi COMPOSE_PROFILES=sso-mock di .env VM. SSO produksi memakai Google
# sungguhan lewat SSO_GOOGLE_* (lihat docs/DEPLOYMENT.md); prodcheck menolak penerbit/redirect non-https.
#
# Variabel bertanda ":?" WAJIB ada di .env VM; compose berhenti dengan pesan jelas
# bila kosong, sehingga produksi tidak pernah jatuh ke nilai bawaan pengembangan.
# Pemeriksaan kekuatan nilai dilakukan remote-deploy.sh (sebelum deploy) dan API
# sendiri (menolak start bila APP_ENV=production dan rahasia lemah/bawaan).

x-prod-database-url: &prod-database-url
  DATABASE_URL: "postgres://${DB_USER:?DB_USER wajib diisi}:${DB_PASSWORD:?DB_PASSWORD wajib diisi}@postgres:5432/${DB_NAME:?DB_NAME wajib diisi}?sslmode=disable"

services:
  # ── Application stack (compose.yaml) ────────────────────────────────────
  api:
    image: garda-api:${API_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    environment:
      APP_ENV: production
      GIN_MODE: release
      APP_ADDR: ":8080"
      LAPANGAN_UPLOAD_DIR: "/app/uploads"
      # Login berhak minimum (DB_APP_USER/DB_APP_PASSWORD) bila diisi, selain itu pemilik skema.
      DB_PASSWORD: "${DB_APP_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD wajib diisi}}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET wajib diisi}"
      AES_KEY: "${AES_KEY:?AES_KEY wajib diisi}"
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:?APP_ALLOWED_ORIGINS wajib diisi (origin publik)}"
      MONGO_URI: "${MONGO_URI:-}"
      MONGO_DB_UNSEEN: "${MONGO_DB_UNSEEN:-dataunseen}"
      MONGO_DB_SAFE: "${MONGO_DB_PREDICTIONS:-${MONGO_DB_SAFE:-ml_predictions}}"
      MONGO_DB_PREDICTIONS: "${MONGO_DB_PREDICTIONS:-ml_predictions}"
      CRAWLER_SERVICE_URL: "${CRAWLER_SERVICE_URL:-http://crawler:8091}"
      ML_PIPELINE_SERVICE_URL: "${ML_PIPELINE_SERVICE_URL:-http://ml-worker:8092}"
      JOB_ML_JEMBATAN_EWS_INTERVAL: "${JOB_ML_JEMBATAN_EWS_INTERVAL:-30s}"
    volumes:
      - lapangan_uploads:/app/uploads
    restart: unless-stopped

  # Job berkala (refresh dashboard, KPI); api tidak menjalankannya (API_BACKGROUND_JOBS=false).
  worker:
    image: garda-api:${API_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    environment:
      APP_ENV: production
      GIN_MODE: release
      DB_PASSWORD: "${DB_APP_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD wajib diisi}}"
      MONGO_URI: "${MONGO_URI:-}"
      MONGO_DB_UNSEEN: "${MONGO_DB_UNSEEN:-dataunseen}"
      MONGO_DB_SAFE: "${MONGO_DB_PREDICTIONS:-${MONGO_DB_SAFE:-ml_predictions}}"
      MONGO_DB_PREDICTIONS: "${MONGO_DB_PREDICTIONS:-ml_predictions}"
      CRAWLER_SERVICE_URL: "${CRAWLER_SERVICE_URL:-http://crawler:8091}"
      ML_PIPELINE_SERVICE_URL: "${ML_PIPELINE_SERVICE_URL:-http://ml-worker:8092}"
      JOB_ML_JEMBATAN_EWS_INTERVAL: "${JOB_ML_JEMBATAN_EWS_INTERVAL:-30s}"
    restart: unless-stopped

  # Migrasi dijalankan remote-deploy.sh sebelum aplikasi naik; kegagalannya
  # menghentikan deploy.
  migrate:
    image: garda-api:${API_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    environment:
      <<: *prod-database-url
      # Migrasi data MFA menyegel mfa_secret dengan AES_KEY: wajib sama dengan kunci api.
      APP_ENV: production
      AES_KEY: "${AES_KEY:?AES_KEY wajib diisi}"
      DB_APP_USER: "${DB_APP_USER:-}"
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:-}"

  # Produksi hanya mengisi referensi dan admin awal, tidak pernah demo.
  seed:
    image: garda-api:${API_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    command: ["./seed", "reference", "admin"]
    environment:
      <<: *prod-database-url
      APP_ENV: production

  ml:
    image: garda-ml:${ML_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    restart: unless-stopped

  crawler:
    image: garda-crawler:${CRAWLER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    restart: unless-stopped

  ml-worker:
    image: garda-ml-pipeline:${ML_PIPELINE_IMAGE_TAG:-${ML_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    build: !reset null
    restart: unless-stopped

  web:
    image: garda-web:${WEB_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      # Harus sama dengan JWT_SECRET API (verifikasi sesi di server Next.js).
      GARDA_JWT_SECRET: "${JWT_SECRET:?JWT_SECRET wajib diisi}"
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:?APP_ALLOWED_ORIGINS wajib diisi (origin publik)}"
    restart: unless-stopped

  caddy:
    image: garda-caddy:${CADDY_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build: !reset null
    restart: unless-stopped

  # ── Infrastructure stack (compose.infra.yaml) ───────────────────────────
  # Upstream image, ditarik bukan dibangun. Port basis data dan Redis HANYA di
  # loopback VM (akses admin lewat SSH tunnel); Redis tanpa sandi tidak boleh
  # terbuka ke jaringan.
  postgres:
    image: postgres:16-alpine
    build: !reset null
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}"
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    build: !reset null
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  mongodb:
    image: mongo:7
    build: !reset null
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-garda}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:-garda_secret}"
      MONGO_INITDB_DATABASE: "${MONGO_DB:-garda_inflasi}"
    ports: !override
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  pgadmin:
    image: dpage/pgadmin4:latest
    build: !reset null
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@gardainflasi.id}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?PGADMIN_PASSWORD wajib diisi}"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: "${PGADMIN_SCRIPT_NAME:-/pgm}"
    ports: !override
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

volumes:
  lapangan_uploads:
    name: garda_lapangan_uploads

networks:
  garda_inflasi_net:
    name: garda_inflasi_net
    external: true