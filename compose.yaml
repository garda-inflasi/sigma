# Garda Inflasi — Backend (API) + Frontend (Next.js) + Caddy Reverse Proxy
# ==========================================================================
# Compose file untuk layanan aplikasi. Membutuhkan infra (compose.infra.yaml)
# berjalan terlebih dahulu agar network garda_inflasi_net tersedia.
#
# Jalankan:
#   docker compose -f compose.infra.yaml up -d
#   docker compose up -d
#
# Atau via Makefile:
#   make docker/infra/up
#   make docker/up
#
# `docker compose up` juga menjalankan service sekali-jalan:
#   migrate → menerapkan db/migrations (api menunggu sampai selesai)
#   seed    → mengisi data (lokal: reference+demo; produksi: reference+admin)
#
# Caddy menyediakan:
#   http://localhost/       → Next.js frontend
#   http://localhost/api/*  → Go backend API (strips /api prefix)
#   http://localhost/healthz → Go backend health check

name: garda-app

# Satu image berisi api, migrate, dan seed.
x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: garda-api:${IMAGE_TAG:-latest}

# Variabel koneksi basis data yang dipakai api, migrate, dan seed.
x-database-env: &database-env
  DATABASE_URL: "postgres://${DB_USER:-garda}:${DB_PASSWORD:-garda_secret}@postgres:5432/${DB_NAME:-garda_inflasi}?sslmode=disable"

# Pengiriman email (reset kata sandi, notifikasi EWS) dan Web Push. Kosong = tidak dikirim:
# email menjadi no-op dan notifikasi hanya dicatat di outbox.
x-notifikasi-env: &notifikasi-env
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_FROM: "${SMTP_FROM:-}"
  VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
  VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
  VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
  # Origin publik untuk tautan di email (reset kata sandi, notifikasi).
  APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost}"

# EWS dan workflow intervensi. Job berkalanya (evaluasi, notifikasi, SLA) dijalankan worker;
# api memakai nilai yang sama untuk evaluasi manual dan kartu otomatis.
x-ews-env: &ews-env
  EWS_EVAL_INTERVAL: "${EWS_EVAL_INTERVAL:-15m}"
  EWS_NOTIF_INTERVAL: "${EWS_NOTIF_INTERVAL:-30s}"
  EWS_ESKALASI_MENIT: "${EWS_ESKALASI_MENIT:-0}"
  INTERVENSI_KARTU_OTOMATIS_MIN: "${INTERVENSI_KARTU_OTOMATIS_MIN:-SIAGA}"
  INTERVENSI_SLA_INTERVAL: "${INTERVENSI_SLA_INTERVAL:-0}"

services:
  migrate:
    <<: *api-image
    container_name: garda-migrate
    command: ["./migrate", "up"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      <<: *database-env
      # Migrasi data MFA menyegel mfa_secret lama dengan AES_KEY: harus sama dengan kunci api.
      APP_ENV: "${APP_ENV:-development}"
      AES_KEY: "${AES_KEY:-0123456789abcdef0123456789abcdef}"
    networks:
      - garda_inflasi_net

  seed:
    <<: *api-image
    container_name: garda-seed
    # Lokal: reference + demo (demo sudah memuat akun admin demo). Produksi menimpanya di compose.prod.yaml (tanpa demo).
    command: ["./seed", "reference", "demo"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      <<: *database-env
      APP_ENV: "${APP_ENV:-development}"
      # Akun demo ber-MFA disegel dengan kunci yang sama dengan api.
      AES_KEY: "${AES_KEY:-0123456789abcdef0123456789abcdef}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - garda_inflasi_net

  api:
    <<: *api-image
    container_name: garda-api
    restart: unless-stopped
    environment:
      APP_ADDR: ":8080"
      APP_ENV: "${APP_ENV:-development}"
      GIN_MODE: "${GIN_MODE:-release}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-garda}"
      DB_PASSWORD: "${DB_PASSWORD:-garda_secret}"
      DB_NAME: "${DB_NAME:-garda_inflasi}"
      DB_SSLMODE: disable
      <<: [*database-env, *notifikasi-env, *ews-env]
      REDIS_URL: "redis://redis:6379"
      # Origin publik yang boleh mengubah data lewat cookie (proteksi CSRF di Go).
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-http://localhost,https://localhost}"
      JWT_SECRET: "${JWT_SECRET:-garda-inflasi-dev-secret-key-change-in-production}"
      AES_KEY: "${AES_KEY:-0123456789abcdef0123456789abcdef}"
      # Penyegaran berkala dashboard dimiliki service worker (satu pemilik).
      API_BACKGROUND_JOBS: "false"
      # Batas permintaan per menit per IP klien (kosong = 600) dan proxy tepercaya untuk
      # X-Forwarded-For (kosong = jaringan privat, tempat Caddy berada).
      API_RATE_LIMIT_PER_MENIT: "${API_RATE_LIMIT_PER_MENIT:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # Ingestion manual (tombol "Jalankan sekarang" di /sumber-data) berjalan di api.
      BPS_API_KEY: "${BPS_API_KEY:-}"
      INGEST_USER_AGENT: "${INGEST_USER_AGENT:-}"
      INGEST_JEDA_MS: "${INGEST_JEDA_MS:-}"
      # Layanan ML (pelatihan model prediksi). Kosong/mati => pelatihan menjawab 503, API tetap jalan.
      ML_SERVICE_URL: "${ML_SERVICE_URL:-http://ml:8000}"
      # Narasi policy brief oleh LLM aktif hanya bila kunci ada; kosong => templat deterministik.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-claude-opus-5-5}"
      # production mewajibkan MFA bagi peran wajib; lokal/demo tidak dipaksa (MFA_ENFORCE menimpa).
      MFA_ENFORCE: "${MFA_ENFORCE:-}"
      # Masuk dengan Google (OIDC). SSO aktif hanya bila SSO_GOOGLE_CLIENT_ID terisi; kosong = tombol
      # disembunyikan dan rute SSO menjawab 503 SSO_NOT_CONFIGURED. ISSUER kosong = https://accounts.google.com.
      # REDIRECT_URL = <origin publik>/api/auth/sso/google/callback (didaftarkan di Google Cloud Console).
      # Demo (make docker/demo/up) mengisinya untuk mock OIDC lokal (service sso-mock); lihat docs/DEPLOYMENT.md.
      SSO_GOOGLE_CLIENT_ID: "${SSO_GOOGLE_CLIENT_ID:-}"
      SSO_GOOGLE_CLIENT_SECRET: "${SSO_GOOGLE_CLIENT_SECRET:-}"
      SSO_GOOGLE_ISSUER: "${SSO_GOOGLE_ISSUER:-}"
      SSO_GOOGLE_REDIRECT_URL: "${SSO_GOOGLE_REDIRECT_URL:-}"
      SSO_GOOGLE_HOSTED_DOMAIN: "${SSO_GOOGLE_HOSTED_DOMAIN:-}"
    # postgres dan redis berjalan di compose.infra.yaml secara terpisah;
    # api hanya menunggu skema selesai dimigrasi.
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - garda_inflasi_net

  # Job berkala di luar API: refresh materialized view dashboard, perhitungan KPI, pembersihan tabel auth, rule engine
  # dan notifikasi EWS, SLA intervensi, dan penjadwal cron ingestion (bila INGEST_SCHEDULER=on).
  # Interval lewat JOB_<NAMA>_INTERVAL (off = nonaktif). Aman >1 instance (advisory lock).
  worker:
    <<: *api-image
    container_name: garda-worker
    command: ["./worker"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-garda}"
      DB_PASSWORD: "${DB_PASSWORD:-garda_secret}"
      DB_NAME: "${DB_NAME:-garda_inflasi}"
      DB_SSLMODE: disable
      APP_ENV: "${APP_ENV:-development}"
      WORKER_HEALTH_ADDR: ":8081"
      JOB_DASHBOARD_REFRESH_INTERVAL: "${JOB_DASHBOARD_REFRESH_INTERVAL:-5m}"
      JOB_KPI_HITUNG_INTERVAL: "${JOB_KPI_HITUNG_INTERVAL:-1h}"
      JOB_KPI_HITUNG_BULAN: "${JOB_KPI_HITUNG_BULAN:-2}"
      # Pembersihan baris auth kedaluwarsa (jwt_blacklist, refresh_tokens, token reset, login_attempts).
      JOB_AUTH_PEMBERSIHAN_INTERVAL: "${JOB_AUTH_PEMBERSIHAN_INTERVAL:-1h}"
      JOB_AUTH_PEMBERSIHAN_LOGIN_HARI: "${JOB_AUTH_PEMBERSIHAN_LOGIN_HARI:-90}"
      JOB_AUTH_PEMBERSIHAN_RESET_HARI: "${JOB_AUTH_PEMBERSIHAN_RESET_HARI:-7}"
      JOB_AUTH_PEMBERSIHAN_BATCH: "${JOB_AUTH_PEMBERSIHAN_BATCH:-1000}"
      # Penjadwal cron ingestion (PIHPS, BMKG, BPS). Bawaan mati: lokal/demo tidak memanggil internet.
      INGEST_SCHEDULER: "${INGEST_SCHEDULER:-}"
      BPS_API_KEY: "${BPS_API_KEY:-}"
      INGEST_USER_AGENT: "${INGEST_USER_AGENT:-}"
      INGEST_JEDA_MS: "${INGEST_JEDA_MS:-}"
      # Sinyal SSE ke api lewat Redis pub/sub (tanpa Redis, api membaca outbox ews_event).
      REDIS_URL: "redis://redis:6379"
      <<: [*notifikasi-env, *ews-env]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - garda_inflasi_net

  # Layanan ML internal: hanya terhubung ke jaringan compose, tanpa port yang dipublikasikan.
  ml:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    image: garda-ml:${IMAGE_TAG:-latest}
    container_name: garda-ml
    restart: unless-stopped
    networks:
      - garda_inflasi_net

  # Penangkap email untuk dev/demo (profil "mailpit"): menerima SMTP tanpa autentikasi dan menampilkan
  # pesan di UI/API HTTP. TIDAK ikut berjalan tanpa profil (produksi memakai compose.prod.yaml tanpa
  # profil ini dan tidak pernah menyebut `mailpit` di perintah `up`). `make docker/demo/up` menyalakannya
  # dan mengarahkan SMTP_HOST=mailpit SMTP_PORT=1025 ke sini. Port SMTP tidak dipublikasikan.
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: garda-mailpit
    profiles: ["mailpit"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      # UI + API HTTP (mis. GET /api/v1/messages) hanya di loopback host.
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - garda_inflasi_net

  # Penyedia OIDC palsu untuk dev/demo/e2e (profil "sso-mock"): menggantikan Google pada masuk dengan Google.
  # TIDAK ikut berjalan tanpa profil; produksi (compose.prod.yaml, COMPOSE_PROFILES tidak pernah berisi
  # sso-mock) tidak pernah menjalankannya. `make docker/demo/up` menyalakannya dan mengisi SSO_GOOGLE_*.
  #
  # Penerbit (issuer) harus IDENTIK bagi browser dan container api, karena mock menurunkannya dari header
  # Host dan ID token memuat iss yang sama:  http://sso.localhost:${SSO_MOCK_PORT}/default
  #  - browser: *.localhost selalu dipetakan ke loopback (Chromium/Firefox), lalu port host yang dipublikasikan
  #    di bawah (hanya 127.0.0.1) meneruskan ke container;
  #  - api: alias jaringan `sso.localhost` mengarah ke container ini, dan container mendengarkan di port
  #    yang sama (SERVER_PORT = SSO_MOCK_PORT), sehingga host:port yang sama tersambung dari dalam jaringan.
  # Halaman login interaktifnya menerima sembarang username (menjadi klaim sub) dan klaim JSON tambahan.
  sso-mock:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    container_name: garda-sso-mock
    profiles: ["sso-mock"]
    restart: unless-stopped
    environment:
      SERVER_PORT: "${SSO_MOCK_PORT:-8089}"
    ports:
      - "127.0.0.1:${SSO_MOCK_PORT:-8089}:${SSO_MOCK_PORT:-8089}"
    networks:
      garda_inflasi_net:
        aliases:
          - sso.localhost

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Relative base so the browser always calls the same origin it loaded
        # from (http://localhost or https://localhost). An absolute URL here
        # would make the two schemes different origins → CORS failures.
        - NEXT_PUBLIC_API_BASE_URL=/api
        - NEXT_PUBLIC_APP_URL=https://localhost
    container_name: garda-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # BFF (server-only) — internal URL to Go API
      GO_API_BASE_URL: "http://api:8080/v1"
      # Public origins allowed to issue state-changing BFF requests (CSRF
      # origin check). Comma-separated. Must include the origin the browser
      # actually visits (Caddy's public origin), not the internal Next.js one.
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-http://localhost,https://localhost}"
      # Cookie token memakai flag Secure hanya bila true (HTTPS publik). Lokal
      # lewat http://localhost harus false; compose.prod.yaml menyalakannya.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Must match JWT_SECRET in api service
      GARDA_JWT_SECRET: "${JWT_SECRET:-garda-inflasi-dev-secret-key-change-in-production}"
    depends_on:
      - api
    networks:
      - garda_inflasi_net

  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    container_name: garda-caddy
    restart: unless-stopped
    environment:
      # Lokal: localhost + CA internal. Produksi: domain + email ACME (lihat docker/Caddyfile).
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-localhost:80, localhost:443}"
      CADDY_TLS: "${CADDY_TLS:-internal}"
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    depends_on:
      - api
      - web
    networks:
      - garda_inflasi_net

networks:
  garda_inflasi_net:
    name: garda_inflasi_net
    external: true

