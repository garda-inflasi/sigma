openapi: "3.0.3"

info:
  title: Garda Inflasi API
  description: |
    API untuk platform Garda Inflasi — sistem pengendalian inflasi daerah
    terintegrasi dengan AI/ML, real-time monitoring, dan early warning system.

    ## Authentication

    Semua endpoint kecuali `/healthz`, `/v1/auth/login`, `/v1/auth/refresh`,
    `/v1/auth/forgot-password`, dan `/v1/auth/reset-password` memerlukan
    JWT Bearer token yang dikirim via header `Authorization: Bearer <token>`.

    Token diperoleh dari endpoint `POST /v1/auth/login`.
  version: "1.0.0"
  contact:
    name: FMIPA USK × Kanwil DJPb

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.garda-inflasi.dev
    description: Development

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/login:
    post:
      summary: Login pengguna
      description: |
        Akun dengan MFA aktif tidak langsung menerima sesi: respons berisi `mfa_required: true` dan `mfa_token`
        (berlaku 5 menit), yang ditukar dengan kode OTP di `POST /v1/auth/mfa/validate`. Akun yang wajib MFA
        (peran strategis, manajerial, koordinator lapangan, admin, atau bertanda `mfa_wajib`, bila `MFA_ENFORCE`
        menyala; bawaan hanya di produksi) tetapi belum setup menerima sesi dengan `mfa_setup_diwajibkan: true`:
        semua endpoint selain `/v1/auth/mfa/setup`, `/v1/auth/mfa/verify`, ganti password, keluar, dan profil
        menjawab 403 dengan kode `MFA_SETUP_REQUIRED`.
      operationId: authLogin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Akun tidak aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Akun terkunci karena terlalu banyak percobaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/refresh:
    post:
      summary: Refresh token
      operationId: authRefresh
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      summary: Logout pengguna
      operationId: authLogout
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      summary: Mendapatkan profil pengguna saat ini
      operationId: authMe
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/change-password:
    post:
      summary: Mengubah password
      operationId: authChangePassword
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: |
            Password berhasil diubah. Penanda `wajib_ganti_password` dimatikan, semua sesi
            lama dicabut, dan sesi baru dikembalikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          description: Password baru terlalu lemah atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password lama salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/forgot-password:
    post:
      summary: Meminta reset password (mengirim email)
      operationId: authForgotPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: |
            Selalu mengembalikan sukses untuk mencegah email enumeration.
            Email reset akan dikirim jika email terdaftar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/reset-password:
    post:
      summary: Mereset password dengan token dari email
      description: |
        Token berlaku 30 menit dan hanya dapat dipakai satu kali (dipakai secara atomik: permintaan serentak
        dengan token sama hanya satu yang berhasil). Setelah berhasil, penanda wajib ganti password dimatikan,
        seluruh sesi lama dicabut, dan token lain milik akun yang sama dihanguskan. Tautan di email mengarah
        ke halaman web `/reset-password?token=...` (alamat dasar dari env `APP_PUBLIC_URL`).
      operationId: authResetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Password melanggar kebijakan (pesan memuat alasannya) atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid, sudah dipakai, atau kedaluwarsa (pesan membedakan kedaluwarsa dari tidak valid/terpakai)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/setup:
    post:
      summary: Memulai setup MFA (menghasilkan rahasia TOTP dan QR)
      description: |
        Rahasia disimpan bersegel AES (versi kunci tertera) dan belum aktif sampai `/v1/auth/mfa/verify`.
        Memanggil ulang sebelum verifikasi mengganti rahasia. Terbuka juga bagi sesi yang wajib setup MFA.
      operationId: authMFASetup
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rahasia TOTP berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MFA sudah aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Kunci enkripsi MFA (AES_KEY) belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/verify:
    post:
      summary: Memverifikasi kode pertama dan mengaktifkan MFA
      description: |
        Menerbitkan kode cadangan (sekali tampil, hanya hash yang tersimpan) dan sesi baru: semua sesi lama
        dicabut dan sesi baru tidak lagi dibatasi ke setup MFA. Kode salah dihitung terhadap batas kunci akun.
      operationId: authMFAVerify
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA berhasil diaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponse"
        "400":
          description: Kode TOTP tidak valid atau setup belum dimulai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MFA sudah aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Terlalu banyak percobaan salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/validate:
    post:
      summary: Menukar token tantangan MFA dan kode OTP dengan sesi
      description: |
        Publik (belum ada sesi). `code` adalah kode TOTP enam digit atau kode cadangan (huruf besar/kecil dan
        tanda hubung diabaikan). Kode TOTP hanya berlaku sekali per langkah waktu 30 detik; kode cadangan sekali
        pakai. Kode salah dihitung terhadap batas kunci akun yang sama dengan kata sandi salah.
      operationId: authMFAValidate
      tags:
        - Multi-Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAValidateRequest"
      responses:
        "200":
          description: Sesi diterbitkan (bentuk sama dengan login berhasil)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tantangan tidak valid atau kedaluwarsa, atau kode salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Akun terkunci karena terlalu banyak percobaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/backup-codes:
    post:
      summary: Menerbitkan kode cadangan baru
      description: Kode lama hangus. Memerlukan konfirmasi kata sandi. Kode polos hanya tampil sekali.
      operationId: authMFABackupCodes
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: Kode cadangan baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFABackupCodesResponse"
        "400":
          description: MFA belum aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/disable:
    post:
      summary: Menonaktifkan MFA
      description: |
        Memerlukan konfirmasi kata sandi. Rahasia dan semua kode cadangan dihapus. Ditolak (403) untuk akun
        yang MFA-nya diwajibkan.
      operationId: authMFADisable
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA berhasil dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: MFA diwajibkan untuk akun ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users:
    get:
      summary: Mendaftar semua pengguna (dengan paginasi)
      operationId: listUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Halaman
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Jumlah item per halaman
      responses:
        "200":
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Membuat pengguna baru
      operationId: createUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}:
    get:
      summary: Mendapatkan detail pengguna
      operationId: getUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID pengguna
      responses:
        "200":
          description: Detail pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/bulk:
    post:
      summary: Menjalankan aksi massal pada pengguna
      operationId: bulkUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUserRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUserResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga:
    get:
      summary: Mendaftar entri harga
      description: |
        Entri terbaru lebih dulu, disaring dan dipaginasi di server. Memerlukan izin `harga.lihat`.
        Jumlah seluruh hasil filter ada di header `X-Total-Count`.
      operationId: listHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - $ref: "#/components/parameters/HargaWilayah"
        - $ref: "#/components/parameters/HargaKomoditas"
        - name: pasar_id
          in: query
          schema:
            type: string
        - name: urut
          in: query
          description: Kosong untuk entri terbaru lebih dulu; `skor` untuk skor anomali tertinggi lebih dulu (prioritas antrean validasi)
          schema:
            type: string
            enum: [skor]
        - name: dari
          in: query
          description: Tanggal awal (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: sampai
          in: query
          description: Tanggal akhir (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Satu halaman entri harga
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil filter (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Mencatat entri harga baru
      description: |
        Entri disimpan berstatus DIAJUKAN atas nama pengguna. Memerlukan izin `harga.input`. Tercatat di audit trail.
        Header `Idempotency-Key` bersifat opsional di sini; bila dikirim, kiriman ulang oleh pengguna yang sama
        mengembalikan entri semula (200).
      operationId: createHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHargaRequest"
      responses:
        "201":
          description: Entri harga dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "400":
          description: Validasi gagal, komoditas atau pasar tidak ada, atau waktu pencatatan di masa depan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/saya:
    get:
      summary: Mendaftar entri harga milik pengguna yang masuk
      description: Riwayat petugas lapangan. Memerlukan izin `harga.input`. Parameter dan header sama dengan `GET /v1/harga`.
      operationId: listHargaSaya
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Entri milik pengguna
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/ringkasan:
    get:
      summary: Jumlah entri harga per status
      operationId: getHargaRingkasan
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: hari
          in: query
          description: Jendela waktu dalam hari terakhir
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 7
      responses:
        "200":
          description: Ringkasan per status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingkasanHargaResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/tren:
    get:
      summary: Tren harga komoditas di satu kabupaten/kota
      description: Rata-rata harga entri berstatus DIVALIDASI atau DIPUBLIKASI per hari atau pekan, dipisah menurut produsen dan konsumen. Hari tanpa entri tidak muncul.
      operationId: getHargaTren
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: komoditas
          in: query
          required: true
          description: Kode komoditas
          schema:
            type: string
        - name: wilayah
          in: query
          required: true
          description: Kode kabupaten/kota
          schema:
            type: string
        - name: hari
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 45
        - name: interval
          in: query
          schema:
            type: string
            enum: [harian, mingguan]
            default: harian
      responses:
        "200":
          description: Deret tren menaik menurut tanggal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrenHargaResponse"
        "400":
          description: Komoditas atau wilayah kosong, atau interval tidak dikenal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/bulk:
    post:
      summary: Menjalankan aksi massal pada entri harga
      description: |
        State machine entri harga ditegakkan di server. Izin diperiksa per aksi: `harga.input` untuk ajukan
        (hanya petugas pencatat), `harga.validasi` untuk validasi, tolak, dan kembalikan, `harga.publikasi`
        untuk publikasi. Validator dan penerbit tidak boleh sama dengan petugas pencatat (pemisahan tugas,
        juga dijaga CHECK di basis data). Entri yang dilewati dilaporkan di `rincian` beserta sebabnya.
        Alasan wajib untuk tolak (3 sampai 1000 karakter) dan tampil bagi petugas pencatat. Setiap
        perpindahan tercatat di riwayat status dan audit trail.

        | Aksi | Dari status | Ke status |
        | --- | --- | --- |
        | ajukan | DRAF | DIAJUKAN |
        | validasi | DIAJUKAN | DIVALIDASI |
        | publikasi | DIVALIDASI | DIPUBLIKASI |
        | tolak | DIAJUKAN | DITOLAK |
        | kembalikan | DIAJUKAN, DIVALIDASI | DRAF |
      operationId: bulkHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkHargaRequest"
      responses:
        "200":
          description: Aksi massal diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkHargaResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin untuk aksi tersebut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/{id}/riwayat:
    get:
      summary: Riwayat perpindahan status entri harga
      description: |
        Yang terlama lebih dulu. `harga.lihat` membuka semua entri; petugas dengan `harga.input` hanya
        entri yang ia catat sendiri (entri lain tampil sebagai 404).
      operationId: getHargaRiwayat
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Riwayat status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiwayatStatusEntriResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat` maupun `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entri tidak ada atau bukan milik pemanggil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/{id}:
    get:
      summary: Mendapatkan detail entri harga
      operationId: getHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID entri harga
      responses:
        "200":
          description: Detail entri harga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HargaDetailResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entri harga tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews:
    get:
      summary: Mendaftar alert EWS (terbaru dahulu)
      description: Memerlukan izin `ews.lihat`. Filter dan paginasi dijalankan di server.
      operationId: listEwsAlerts
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [BARU, DIAKUI, DIESKALASI, SELESAI]
        - name: severity
          in: query
          schema:
            type: string
            enum: [INFO, WASPADA, SIAGA, KRITIS]
        - name: jenis
          in: query
          schema:
            type: string
            enum: [LONJAKAN_HARGA, KELANGKAAN_STOK, ANOMALI_CUACA, OVER_SUPPLY, ANOMALI_DATA]
        - name: kabupaten_kode
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Ukuran halaman (bawaan 200, maksimum 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Daftar alert
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil filter (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsAlertListResponse"
        "400":
          description: Nilai filter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `ews.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/aturan:
    get:
      summary: Mendaftar aturan ambang EWS beserta kanal notifikasi
      description: Memerlukan izin `ews.lihat`. Ambang bersifat awal dan harus dikalibrasi.
      operationId: listEwsAturan
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar aturan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsAturanListResponse"
        "403":
          description: Tanpa izin `ews.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/{id}:
    get:
      summary: Mendapatkan detail alert EWS
      description: Memerlukan izin `ews.lihat`.
      operationId: getEwsAlert
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID alert, mis. EWS-1000
      responses:
        "200":
          description: Detail alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsAlertResponse"
        "404":
          description: Alert tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/bulk:
    post:
      summary: Menjalankan aksi massal pada alert EWS
      description: |
        `akui` dan `selesai` memerlukan izin `ews.akui`; `eskalasi` memerlukan `ews.eskalasi`.
        Hanya transisi sah yang berlaku (BARU -> DIAKUI, BARU/DIAKUI -> DIESKALASI,
        selain SELESAI -> SELESAI); id yang tidak ada atau tak boleh bertransisi dihitung `gagal`.
        Aksi yang mengubah data dicatat di audit trail.
      operationId: bulkEwsAlerts
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEwsRequest"
      responses:
        "200":
          description: Aksi massal diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsBulkResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin untuk aksi tersebut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi:
    get:
      summary: Mendaftar kartu intervensi (papan kanban)
      description: Memerlukan izin `intervensi.lihat`. Terurut per siklus, tahap, lalu urutan.
      operationId: listIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: siklus
          in: query
          schema:
            type: string
            enum: [NORMAL, TEKANAN, SURPLUS]
        - name: tahap
          in: query
          description: Kode tahap, mis. t-ews
          schema:
            type: string
        - name: prioritas
          in: query
          schema:
            type: string
            enum: [TINGGI, SEDANG, RENDAH]
      responses:
        "200":
          description: Daftar kartu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiListResponse"
        "400":
          description: Nilai filter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `intervensi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Membuat kartu intervensi
      description: |
        Memerlukan izin `intervensi.kelola`. Kartu masuk ke tahap pertama siklusnya di urutan
        paling bawah. Aksi dicatat di audit trail.
      operationId: createIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntervensiRequest"
      responses:
        "201":
          description: Kartu dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIntervensiResponse"
        "400":
          description: Validasi gagal, atau komoditas/kabupaten/alert/penanggung jawab tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `intervensi.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/tahap:
    get:
      summary: Mendaftar definisi tahap per siklus
      description: Memerlukan izin `intervensi.lihat`. Satu sumber untuk tahap, urutan, izin masuk, dan SLA.
      operationId: listIntervensiTahap
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Definisi tahap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiTahapListResponse"
        "403":
          description: Tanpa izin `intervensi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/{id}/tahap:
    patch:
      summary: Memindahkan kartu ke tahap dan posisi lain
      description: |
        Memerlukan salah satu dari `intervensi.kelola`, `intervensi.setujui`, `intervensi.setujui_fiskal`;
        izin yang tepat ditentukan oleh `izin_dibutuhkan` pada tahap tujuan. Kolom tujuan dinomori
        ulang; `urutan` di luar rentang dijepit. Memindahkan ke tahap penutup mengisi `selesai_pada`.
        Pemindahan (juga yang ditolak) dicatat di audit trail.
      operationId: moveIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: INT-301
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveIntervensiRequest"
      responses:
        "200":
          description: Kartu dipindahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Tahap tidak terdefinisi untuk siklus kartu, atau masukan tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Izin tahap tujuan tidak dimiliki
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kartu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data:
    get:
      summary: Mendaftar katalog sumber data
      description: |
        Metadata sumber (API resmi dan scraper). Pengambilan data nyata belum
        berjalan (05-B), jadi sumber yang belum pernah dijalankan berstatus
        `BELUM_AKTIF` dengan `terakhir_jalan` dan `keberhasilan_7h` null.
        Butuh izin `sumber.lihat`.
      operationId: listSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar sumber, terurut menurut id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumberDataListResponse"
        "403":
          description: Tanpa izin `sumber.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/{id}:
    get:
      summary: Mendapatkan detail sumber data
      operationId: getSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SRC-BPS
      responses:
        "200":
          description: Detail sumber data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumberDataResponse"
        "404":
          description: Sumber data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/bulk:
    post:
      summary: Menjeda atau melanjutkan sumber data
      description: |
        Butuh izin `sumber.kelola`; tercatat di audit trail. Baru mengubah status
        di katalog. `jeda` hanya berlaku untuk sumber yang belum dijeda;
        `lanjutkan` hanya untuk yang sedang dijeda dan mengembalikannya ke
        `TERTUNDA` (pernah berjalan) atau `BELUM_AKTIF` (belum pernah).
        Respons memuat `berhasil` dan `gagal` (id yang tidak berubah).
      operationId: bulkSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSumberDataRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/eksekutif:
    get:
      summary: Ringkasan dashboard eksekutif
      description: |
        Satu layar eksekutif untuk Aceh: inflasi bulanan terbaru dengan seri 12
        bulan dan penyumbang, neraca pangan, ruang fiskal, serta hitungan
        peringatan EWS dan kartu intervensi. Butuh izin `dashboard.eksekutif`.

        **Setiap angka membawa `sumber`.** `DEMO` berarti data contoh, bukan angka
        resmi; `demo` bernilai true bila ada blok ber-sumber DEMO dan UI wajib
        menampilkan label demo. Angka resmi (BPS, BI, DJPB) hanya masuk lewat impor.

        Blok yang datanya belum ada bernilai `null` (bukan galat). `fiskal` juga
        `null` untuk peran tanpa izin `fiskal.lihat`.
      operationId: getRingkasanEksekutif
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Ringkasan eksekutif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingkasanEksekutifResponse"
        "403":
          description: Tanpa izin `dashboard.eksekutif`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/kpi:
    get:
      summary: Mendaftar indikator kinerja (KPI)
      description: |
        Semua KPI dengan target berlaku, nilai terbaru yang tidak melewati
        `periode`, tren (paling banyak 6 periode), dan status capaian. Butuh izin
        `kpi.lihat`.

        Nilai dihitung job dari data yang ada (`otomatis`: true). KPI yang butuh
        model atau data yang belum ada bernilai null dengan status
        `MENUNGGU_DATA`, bukan 0. `baseline` kosong sampai ditetapkan pemangku
        kepentingan.
      operationId: listKpi
      tags:
        - KPI
      security:
        - BearerAuth: []
      parameters:
        - name: periode
          in: query
          description: Bulan acuan `YYYY-MM` (bawaan bulan berjalan)
          schema:
            type: string
            example: "2026-10"
        - name: wilayah
          in: query
          description: Kode kabupaten/kota 4 digit (bawaan seluruh provinsi)
          schema:
            type: string
            example: "1171"
      responses:
        "200":
          description: Daftar KPI terurut menurut kelompok dan urutan baku
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiListResponse"
        "400":
          description: Periode atau wilayah tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `kpi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/kpi/{kode}/riwayat:
    get:
      summary: Riwayat satu KPI
      description: Paling banyak 36 periode terakhir (versi berlaku tiap periode), urut naik.
      operationId: getKpiRiwayat
      tags:
        - KPI
      security:
        - BearerAuth: []
      parameters:
        - name: kode
          in: path
          required: true
          schema:
            type: string
          example: LOG-UTILISASI-CS
        - name: periode
          in: query
          schema:
            type: string
            example: "2026-10"
        - name: wilayah
          in: query
          schema:
            type: string
            example: "1171"
      responses:
        "200":
          description: KPI beserta riwayat nilainya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiRiwayatResponse"
        "404":
          description: KPI tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/harga:
    post:
      summary: Mengirim entri harga dari aplikasi lapangan (idempoten)
      description: |
        Dipakai sync engine PWA. Memerlukan izin `harga.input`. Header `Idempotency-Key` wajib dan unik per
        petugas: kiriman ulang dengan kunci yang sama mengembalikan entri semula dengan status 200 dan
        header `Idempotent-Replayed: true`, tanpa menyimpan atau mencatat audit ulang.

        Bila petugas lain sudah mengirim harga yang berbeda untuk pasar, komoditas, dan tipe yang sama dalam
        3 jam dari waktu pencatatan (entri DRAF dan DITOLAK diabaikan), kiriman ditolak dengan 409 beserta
        versi server sebagai pembanding. Kirim ulang dengan `pertahankan: true` untuk tetap menyimpan versi
        sendiri. Entri ditautkan ke tugas lapangan petugas yang meminta pasar, tipe, dan komoditas ini, dan
        progres tugas bertambah satu per komoditas.
      operationId: kirimHargaLapangan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHargaRequest"
      responses:
        "201":
          description: Entri baru tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "200":
          description: Kiriman ulang; entri semula dikembalikan
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                example: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "400":
          description: Validasi gagal, Idempotency-Key tidak ada, komoditas atau pasar tidak ada, atau waktu pencatatan di masa depan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Bentrok dengan harga petugas lain; `data.versi_server` memuat pembandingnya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HargaBentrokResponse"

  /v1/lapangan/acuan:
    get:
      summary: Mengunduh data acuan untuk validasi harga offline
      description: |
        Komoditas aktif, pasar aktif beserta geofence, dan median harga resmi (DIVALIDASI atau DIPUBLIKASI)
        7 hari terakhir per komoditas, kabupaten, dan tipe (hanya bila minimal 3 sampel) dengan rentang wajar
        ±`toleransi`. Memerlukan izin `harga.input`. `versi` juga dikirim sebagai `ETag`; kirim kembali di
        `If-None-Match` agar server menjawab 304 tanpa isi bila data tidak berubah.
      operationId: getDataAcuan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Data acuan
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAcuanResponse"
        "304":
          description: Data tidak berubah sejak versi di If-None-Match
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/tugas/saya:
    get:
      summary: Mendaftar tugas survei milik pengguna yang masuk
      description: |
        Tugas yang belum selesai lebih dulu menurut tenggat, yang selesai di akhir. Memerlukan izin
        `tugas.lihat_sendiri` atau `tugas.kelola`. Status yang dikembalikan dihitung terhadap waktu
        sekarang: tugas belum selesai yang lewat tenggat adalah TERLAMBAT, dan yang sudah mulai
        diisi adalah BERJALAN.
      operationId: listTugasSaya
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tugas milik pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TugasLapanganListResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin tugas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/tugas/bulk:
    post:
      summary: Menjalankan aksi massal pada tugas lapangan
      description: |
        `tandai_selesai` menutup tugas yang targetnya sudah terpenuhi (terisi sama dengan atau lebih
        dari target) dan belum selesai; petugas hanya dapat menutup tugasnya sendiri, pemegang
        `tugas.kelola` dapat menutup tugas petugas lain. Tercatat di audit trail bila ada yang berubah.
        `unduh_data_acuan` tidak mengubah data: `berhasil` menghitung tugas yang boleh diunduh pemanggil.
      operationId: bulkTugasLapangan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTugasRequest"
      responses:
