                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage:
    get:
      summary: Ringkasan cold storage — fasilitas, stok tersimpan, dan agregat food loss
      description: |
        Satu permintaan memuat seluruh data layar Cold storage & food loss:
        kartu fasilitas (selalu semua fasilitas), satu halaman stok yang dapat
        disaring/diurutkan, dan ringkasan seluruh stok.

        `stok` mengikuti filter, urutan, dan halaman. `meta.volume_hasil_ton`
        menjumlahkan seluruh hasil filter. `ringkasan` mencakup seluruh stok dan
        **tidak** terpengaruh filter. Urutan bawaan adalah sisa masa simpan
        tersingkat lebih dulu; id lot menjadi pemutus seri agar urutan antar-halaman stabil.

        Memerlukan izin `coldstorage.lihat`.
      operationId: getColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      parameters:
        - name: cold_storage_id
          in: query
          schema:
            type: string
            maxLength: 255
          description: Hanya stok pada fasilitas ini
          example: CS-03
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Cari pada nama komoditas atau pemilik (tanpa membedakan huruf besar/kecil)
          example: tomat
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                sisa_masa_simpan,
                komoditas,
                fasilitas,
                volume,
                masuk,
                risiko,
                pemilik,
              ]
            default: sisa_masa_simpan
          description: Kolom pengurutan stok
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Jumlah lot stok per halaman
      responses:
        "200":
          description: Data cold storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColdStorageResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `coldstorage.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage/bulk:
    post:
      summary: Menjalankan aksi massal pada lot stok cold storage
      description: |
        Aksi bersifat advisori: tidak mengubah stok, tetapi tercatat di audit trail
        (`BULK_<aksi>`). Lot yang tidak ditemukan dihitung pada `gagal`.

        Izin yang diperlukan bergantung pada aksi:

        | Aksi | Izin |
        |---|---|
        | `rencanakan_distribusi` | `logistik.kelola` |
        | `rekomendasi_olahan` | `coldstorage.kelola` |
      operationId: bulkColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkColdStorageRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkColdStorageResponse"
        "400":
          description: Validasi gagal, aksi tidak valid, atau tidak ada lot yang dipilih
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Peran tidak memiliki izin untuk aksi ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT yang diperoleh dari endpoint login

  parameters:
    HargaStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [DRAF, DIAJUKAN, DIVALIDASI, DIPUBLIKASI, DITOLAK]
    HargaWilayah:
      name: wilayah
      in: query
      description: Kode kabupaten/kota
      schema:
        type: string
    HargaKomoditas:
      name: komoditas
      in: query
      description: Kode komoditas
      schema:
        type: string

  schemas:
    # ── Response Envelope ──────────────────────────────────────────────
    Envelope:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          nullable: true

    SuccessResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"
        data:
          nullable: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: "2026-10-15T03:00:00Z"

    # ── Authentication ─────────────────────────────────────────────────
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@gardainflasi.id
        password:
          type: string
          format: password
          example: "Test1234!"

    LoginResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: Refresh token
            user:
              $ref: "#/components/schemas/UserObject"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token dari response login

    RefreshTokenResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: Password saat ini
        new_password:
          type: string
          format: password
          minLength: 8
          description: |
            Password baru. Minimal 8 karakter, mengandung huruf besar,
            angka, dan karakter spesial.

    ChangePasswordResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email pengguna yang terdaftar

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Token reset password dari email
        password:
          type: string
          format: password
          minLength: 8
          description: Password baru

    # ── MFA ────────────────────────────────────────────────────────────
    MFASetupResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            secret:
              type: string
              description: Base32-encoded secret key untuk ditambahkan ke authenticator app
              example: JBSWY3DPEHPK3PXP
            provisioning_uri:
              type: string
              format: uri
              description: URI untuk QR code (otpauth://)
              example: otpauth://totp/Garda%20Inflasi:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Garda%20Inflasi
            backup_codes:
              type: array
              items:
                type: string
              description: 8 kode cadangan sekali pakai (8 karakter alfanumerik)
              example:
                - F3119FBC
                - 38F46BF0

    MFAVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Kode TOTP 6 digit dari authenticator app
          example: "123456"

    MFAValidateRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Kode TOTP 6 digit atau backup code 8 karakter
          example: "123456"

    MFADisableRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: Password saat ini untuk konfirmasi

    # ── User ───────────────────────────────────────────────────────────
    UserObject:
      type: object
      properties:
        id:
          type: string
          example: test-user-001
        nama:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: user@gardainflasi.id
        peran:
          type: string
          enum:
            - STRATEGIS_FMIPA
            - STRATEGIS_BI
            - STRATEGIS_BPS
            - STRATEGIS_DJPB
            - MANAJER_PROGRAM
            - MANAJER_DATA
            - MANAJER_KEBIJAKAN
            - MANAJER_PEMBIAYAAN
            - MANAJER_RISIKO
            - MANAJER_MUTU
            - OPS_KOORDINATOR
            - OPS_AGREGATOR
            - OPS_MAHASISWA
            - ADMIN_SISTEM
          example: ADMIN_SISTEM
        lapis:
          type: string
          enum:
            - STRATEGIS
            - MANAJERIAL
            - OPERASIONAL
            - SISTEM
          example: SISTEM
        lembaga:
          type: string
          example: BPPSDMP
        kabupaten_kode:
          type: string
          nullable: true
          example: "1171"
        mfa_aktif:
          type: boolean
          example: false
        status:
          type: string
          enum:
            - AKTIF
            - NONAKTIF
            - MENUNGGU
          example: AKTIF
        terakhir_masuk:
          type: string
          format: date-time
          nullable: true
        dibuat_pada:
          type: string
          format: date-time
        wajib_ganti_password:
          type: boolean
          description: |
            True bila kata sandi akun ditetapkan pihak lain (admin awal, akun baru, reset
            administrator). Selama aktif, semua endpoint selain `/v1/auth/change-password`,
            `/v1/auth/logout`, dan `/v1/auth/me` menjawab 403 dengan `code`
            `PASSWORD_CHANGE_REQUIRED`.
          example: false

    UserResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/UserObject"

    CreateUserRequest:
      type: object
      required:
        - nama
        - email
        - peran
        - lapis
        - lembaga
      properties:
        id:
          type: string
          description: ID opsional (akan digenerate jika kosong)
        nama:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@gardainflasi.id
        password:
          type: string
          format: password
          minLength: 8
          description: "Password opsional (default: random)"
        peran:
          type: string
          example: OPS_MAHASISWA
        lapis:
          type: string
          example: OPERASIONAL
        lembaga:
          type: string
          example: BPPSDMP

    UserListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserObject"
            total:
              type: integer
              example: 42
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20

    # ── Bulk Operations ────────────────────────────────────────────────
    BulkActionRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          description: Nama aksi massal (bergantung pada modul)
          example: proses
        ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [1, 2, 3]

    BulkUserRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [aktifkan, nonaktifkan, wajibkan_mfa, akhiri_sesi]
        ids:
          type: array
          minItems: 1
          items:
            type: string
          example: ["user-001", "user-002"]

    BulkSumberDataRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [jalankan, jeda, lanjutkan]
        ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [1, 2]

    BulkKomoditasRequest:
      type: object
      required:
        - action
        - kode
      properties:
        action:
          type: string
          enum: [ajukan_perubahan, setujui, arsipkan]
        kode:
          type: array
          minItems: 1
          items:
            type: string
          example: ["BERAS", "CABAI"]

    BulkResultResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            berhasil:
              type: integer
              example: 3

    BulkUserResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            berhasil:
              type: integer
              example: 3
            gagal:
              type: integer
              example: 0
            errors:
              type: array
              items:
                type: string

    # ── Create Payloads ────────────────────────────────────────────────
    CreateHargaRequest:
      type: object
      required:
        - komoditas_kode
        - pasar_id
        - tipe
        - harga
      properties:
        komoditas_kode:
          type: string
          example: BWM
        pasar_id:
          type: string
          example: PSR-1171-01
        tipe:
          type: string
          enum: [PRODUSEN, KONSUMEN]
        harga:
          type: integer
          minimum: 1
          description: Rupiah per satuan komoditas (satuan diambil dari master komoditas)
          example: 43500
        kualitas:
          type: string
          enum: [PREMIUM, MEDIUM, ASALAN]
          default: MEDIUM
        catatan:
          type: string
          maxLength: 1000
        dicatat_pada:
          type: string
          format: date-time
          description: Waktu pencatatan di lapangan; bawaan sekarang, tidak boleh di masa depan

    CreateHargaResponse:
      type: object
      properties:
        code:
          type: string
          example: "201"
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: string

    BulkHargaRequest:
      type: object
      required:
        - aksi
        - ids
      properties:
        aksi:
          type: string
          enum: [validasi, publikasi, tolak, kembalikan]
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string

    BulkHargaResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            berhasil:
              type: integer
              description: Entri yang statusnya berubah
            gagal:
              type: integer
              description: Entri yang dilewati (id tidak ada, status tidak memenuhi syarat, atau dicatat pelaku sendiri)

    EntriHarga:
      type: object
      properties:
        id:
          type: string
        komoditas_kode:
          type: string
        komoditas_nama:
          type: string
        pasar_id:
          type: string
        pasar_nama:
          type: string
        kabupaten_kode:
          type: string
        wilayah:
          type: string
          description: Nama resmi kabupaten/kota
          example: KABUPATEN ACEH BESAR
        tipe:
          type: string
          enum: [PRODUSEN, KONSUMEN]
        harga:
          type: integer
        satuan:
          type: string
        kualitas:
          type: string
          enum: [PREMIUM, MEDIUM, ASALAN]
        petugas_id:
          type: string
          nullable: true
        petugas_nama:
          type: string
          nullable: true
        dicatat_pada:
          type: string
          format: date-time
        status:
          type: string
          enum: [DRAF, DIAJUKAN, DIVALIDASI, DIPUBLIKASI, DITOLAK]
        deviasi_pct:
          type: number
          description: Deviasi terhadap harga wajar, dalam persen
        skor_anomali:
          type: number
          description: 0 sampai 1
        ada_foto:
          type: boolean
        dalam_geofence:
          type: boolean

    EntriHargaListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntriHarga"

    HargaDetailResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          allOf:
            - $ref: "#/components/schemas/EntriHarga"
            - type: object
              properties:
                sumber:
                  type: string
                  enum: [LAPANGAN, PIHPS, BAPANAS, PORTAL_DAERAH]
                lat:
                  type: number
                  nullable: true
                lng:
                  type: number
                  nullable: true
                foto_url:
                  type: string
                  nullable: true
                catatan:
                  type: string
                  nullable: true
                divalidasi_oleh:
                  type: string
                  nullable: true
                divalidasi_pada:
                  type: string
                  format: date-time
                  nullable: true
                dipublikasi_oleh:
                  type: string
                  nullable: true
                dipublikasi_pada:
                  type: string
                  format: date-time
                  nullable: true
                dibuat_pada:
                  type: string
                  format: date-time
                diupdate_pada:
                  type: string
                  format: date-time

    RingkasanHargaResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            draf:
              type: integer
            diajukan:
              type: integer
            divalidasi:
              type: integer
            dipublikasi:
              type: integer
            ditolak:
              type: integer
            anomali:
              type: integer
              description: Entri dengan deviasi mutlak di atas 25%

    TrenHargaResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              tanggal:
                type: string
                format: date-time
                description: Awal hari atau pekan (waktu Aceh)
              produsen:
                type: number
                nullable: true
              konsumen:
                type: number
                nullable: true

    TugasLapangan:
      type: object
      properties:
        id:
          type: string
          example: TGS-mahasiswa_1-1
        judul:
          type: string
        pasar_id:
          type: string
        pasar_nama:
          type: string
        komoditas:
          type: array
          items:
            type: string
          description: Kode komoditas yang harus disurvei
        tenggat:
          type: string
          format: date-time
        status:
          type: string
          enum: [BELUM, BERJALAN, SELESAI, TERLAMBAT]
        target:
          type: integer
          description: Jumlah komoditas yang harus tercatat
        terisi:
          type: integer
          description: Jumlah komoditas yang sudah tercatat
        tipe:
          type: string
          enum: [PRODUSEN, KONSUMEN]

    TugasLapanganResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TugasLapangan"

    TugasLapanganListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/TugasLapangan"

    BulkTugasRequest:
      type: object
      required:
        - aksi
        - ids
      properties:
        aksi:
          type: string
          enum: [unduh_data_acuan, tandai_selesai]
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string

    BulkTugasResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            berhasil:
              type: integer
            gagal:
              type: integer
              description: Tugas yang dilewati (tidak ada, bukan milik pemanggil, belum memenuhi target, atau sudah selesai)

    CreateIntervensiRequest:
      type: object
      required:
        - judul
        - tipe
      properties:
        judul:
          type: string
          example: Operasi Pasar Beras
        tipe:
          type: string
          example: OPERASI_PASAR
        deskripsi:
          type: string
        wilayah_kode:
          type: string
          example: "1171"

    # ── Cold Storage ───────────────────────────────────────────────────
    AuditRow:
      type: object
      properties:
        id:
          type: string
        waktu:
          type: string
          format: date-time
        aktor_id:
          type: string
          description: Kosong bila tanpa pelaku terautentikasi atau akunnya sudah dihapus
        aktor_nama:
          type: string
          description: Snapshot nama aktor saat aksi
        aktor_email:
          type: string
        aktor_peran:
          type: string
        aksi:
          type: string
          example: ASSIGN_ROLE
        entitas:
          type: string
          example: pengguna
        entitas_id:
          type: string
        hasil:
          type: string
          enum: [BERHASIL, GAGAL, DITOLAK]
        ip:
          type: string
        user_agent:
          type: string
        correlation_id:
          type: string
        sebelum:
          type: object
          description: Keadaan objek sebelum aksi (bila mengubah data)
        sesudah:
          type: object
          description: Keadaan objek sesudah aksi
        metadata:
          type: object

    AuditPageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditRow"
            next_cursor:
              type: string
              description: Kosong pada halaman terakhir

    MasterKomoditasRow:
      type: object
      properties:
        kode:
          type: string
          example: CBM-KRT
        nama:
          type: string
          example: Cabai merah keriting
        kategori:
          type: string
          example: Hortikultura
        satuan:
          type: string
          example: kg
        harga_acuan:
          type: integer
          description: Harga konsumen acuan (Rp)
          example: 52000
        pilot:
          type: boolean
        shelf_life_hari:
          type: integer
        versi:
          type: integer
        status:
          type: string
          enum: [AKTIF, MENUNGGU_PERSETUJUAN, DIARSIPKAN]

    MasterKomoditasListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/MasterKomoditasRow"

    ColdStorageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/ColdStorageData"

    ColdStorageData:
      type: object
      properties:
        fasilitas:
          type: array
          description: Seluruh fasilitas; operasional lebih dulu, lalu perawatan, lalu rencana
          items:
            $ref: "#/components/schemas/FasilitasColdStorage"
        stok:
          type: array
          description: Satu halaman lot stok menurut filter dan urutan
          items:
            $ref: "#/components/schemas/StokColdStorage"
        meta:
          $ref: "#/components/schemas/ColdStoragePageMeta"
        ringkasan:
          $ref: "#/components/schemas/ColdStorageRingkasan"

    FasilitasColdStorage:
      type: object
      properties:
        id:
          type: string
          example: CS-01
        nama:
          type: string
          example: Cold Storage Lambaro
        kabupaten_kode:
          type: string
          example: "1106"
        kabupaten_nama:
          type: string
          description: Nama pada master wilayah
          example: KABUPATEN ACEH BESAR
        lat:
          type: number
          format: double
          example: 5.505
        lng:
          type: number
          format: double
          example: 95.37
        kapasitas_ton:
          type: integer
          example: 400
        terisi_ton:
          type: number
          format: double
          description: Jumlah volume seluruh lot di fasilitas
          example: 347.0
        utilisasi_persen:
          type: number
          format: double
          description: terisi_ton / kapasitas_ton × 100, satu desimal
          example: 86.8
        suhu_target_c:
          type: number
          format: double
          example: 4
        suhu_aktual_c:
          type: number
          format: double
          nullable: true
          description: Pembacaan sensor terakhir; null bila belum ada telemetri
          example: 3.5
        status:
          type: string
          enum: [OPERASIONAL, PERAWATAN, RENCANA]

    StokColdStorage:
      type: object
      properties:
        id:
          type: string
          example: STK-CS01-01
        cold_storage_id:
          type: string
          example: CS-01
        cold_storage_nama:
          type: string
          example: Cold Storage Lambaro
        komoditas_kode:
          type: string
          example: cabai_merah_keriting
        komoditas_nama:
          type: string
          example: Cabai Merah Keriting
        volume_ton:
          type: number
          format: double
          example: 34.9
        masuk_pada:
          type: string
          format: date-time
        kedaluwarsa_pada:
          type: string
          format: date-time
        sisa_masa_simpan_hari:
          type: integer
          description: Dibulatkan ke atas; 0 berarti sudah melewati batas
          example: 5
        risiko_food_loss:
          type: number
          format: double
          description: Pecahan 0–1
          example: 0.68
        pemilik:
          type: string
          example: KUD Pidie Jaya

    ColdStoragePageMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          description: Jumlah lot yang cocok dengan filter
          example: 23
        total_pages:
          type: integer
          example: 3
        volume_hasil_ton:
          type: number
          format: double
          description: Total volume seluruh hasil filter (semua halaman)
          example: 813.0

    ColdStorageRingkasan:
      type: object
      description: Agregat seluruh stok; tidak terpengaruh filter tabel
      properties:
        total_lot:
          type: integer
          format: int64
          example: 23
        total_volume_ton:
          type: number
          format: double
          example: 813.0
        risiko_tinggi_lot:
          type: integer
          format: int64
          example: 4
        risiko_tinggi_ton:
          type: number
          format: double
          example: 172.7
        ambang_risiko_tinggi:
          type: number
          format: double
          description: Lot dengan risiko di atas nilai ini dihitung berisiko tinggi
          example: 0.6

    BulkColdStorageRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [rencanakan_distribusi, rekomendasi_olahan]
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
          example: ["STK-CS01-01", "STK-CS03-01"]

    BulkColdStorageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            berhasil:
              type: integer
              description: Lot yang ditemukan dan diproses
              example: 2
            gagal:
              type: integer
              description: Id yang tidak ditemukan
              example: 0
            volume_ton:
              type: number
              format: double
              description: Total volume lot yang diproses
              example: 65.9
