openapi: "3.0.3"

info:
  title: Garda Inflasi API
  description: |
    API untuk platform Garda Inflasi — sistem pengendalian inflasi daerah
    terintegrasi dengan AI/ML, real-time monitoring, dan early warning system.

    ## Authentication

    Semua endpoint kecuali `/healthz`, `/v1/auth/login`, `/v1/auth/refresh`,
    `/v1/auth/forgot-password`, dan `/v1/auth/reset-password` memerlukan
    JWT Bearer token yang dikirim via header `Authorization: Bearer <token>`.

    Token diperoleh dari endpoint `POST /v1/auth/login`.

    ## Sesi

    Setiap login membuka satu sesi (perangkat). Access token (15 menit) membawa klaim `sid` = id sesi, dan
    refresh token diputar pada setiap `POST /v1/auth/refresh`. Mencabut sesi (keluar, `Cabut`, paksa keluar,
    pemakaian ulang refresh token, ganti atau reset kata sandi) mematikan seluruh access token sesi itu
    seketika: token yang dicabut dijawab 401. Bila status pencabutan tidak dapat diperiksa (basis data
    bermasalah) permintaan dijawab 503, bukan diloloskan.
  version: "1.0.0"
  contact:
    name: FMIPA USK × Kanwil DJPb

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.garda-inflasi.dev
    description: Development

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/login:
    post:
      summary: Login pengguna
      description: |
        Akun dengan MFA aktif tidak langsung menerima sesi: respons berisi `mfa_required: true` dan `mfa_token`
        (berlaku 5 menit), yang ditukar dengan kode OTP di `POST /v1/auth/mfa/validate`. Akun yang wajib MFA
        (peran strategis, manajerial, koordinator lapangan, admin, atau bertanda `mfa_wajib`, bila `MFA_ENFORCE`
        menyala; bawaan hanya di produksi) tetapi belum setup menerima sesi dengan `mfa_setup_diwajibkan: true`:
        semua endpoint selain `/v1/auth/mfa/setup`, `/v1/auth/mfa/verify`, ganti password, keluar, dan profil
        menjawab 403 dengan kode `MFA_SETUP_REQUIRED`.
      operationId: authLogin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Akun tidak aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Akun terkunci karena terlalu banyak percobaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/refresh:
    post:
      summary: Refresh token
      operationId: authRefresh
      description: |
        Menukar refresh token dengan access token baru dan refresh token pengganti (rotasi). Token lama
        langsung hangus; penukaran bersifat atomik sehingga dua permintaan serentak dengan token yang sama
        tidak mungkin keduanya memutar.

        **Jendela toleransi (10 detik).** Token yang baru saja diputar lalu disajikan lagi (mis. dua tab
        menyegarkan sesi bersamaan) dijawab 200 dengan access token baru tetapi **tanpa** `refresh_token`:
        pertahankan refresh token yang diterima permintaan pertama. Setelah jendela itu, menyajikan token yang
        sudah diputar dianggap pencurian: seluruh sesi dicabut (termasuk access token-nya) dan `TOKEN_REUSE`
        dicatat di audit. Token yang dicabut karena keluar atau `Cabut` hanya dijawab 401.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      summary: Logout dari sesi ini
      operationId: authLogout
      description: |
        Mengakhiri hanya sesi yang sedang dipakai (klaim `sid`) dan memasukkan jti access token ke daftar
        cabut; sesi di perangkat lain tetap hidup. Untuk keluar di semua perangkat gunakan
        `POST /v1/auth/logout-all`. Badan opsional `refresh_token` dipakai untuk menentukan sesi bila
        access token tidak membawa `sid` (token terbitan sebelum fitur sesi).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout-all:
    post:
      summary: Keluar dari semua perangkat
      operationId: authLogoutAll
      description: |
        Mengakhiri semua sesi pengguna, termasuk yang sedang dipakai. Seluruh access token dan refresh
        token pengguna berhenti berlaku seketika. Tercatat di audit (`LOGOUT_ALL`).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Semua sesi diakhiri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsRevokedResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/sessions:
    get:
      summary: Daftar sesi aktif milik sendiri
      operationId: authListSessions
      description: |
        Sesi aktif (perangkat yang sedang masuk) milik pengguna yang memanggil, yang terakhir dipakai
        paling awal. `saat_ini` menandai sesi pemanggil. Tersedia untuk semua peran.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/sessions/{id}:
    delete:
      summary: Cabut satu sesi milik sendiri
      operationId: authRevokeSession
      description: |
        Mencabut sesi lain milik pengguna yang memanggil. Access token dan refresh token sesi itu
        berhenti berlaku seketika. Sesi yang sedang dipakai tidak dapat dicabut di sini (gunakan
        `POST /v1/auth/logout`). Tercatat di audit (`REVOKE_SESSION`).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id sesi dari `GET /v1/auth/sessions`
      responses:
        "200":
          description: Sesi dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Sesi yang sedang dipakai tidak dapat dicabut dari daftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Sesi tidak ada, sudah berakhir, atau milik pengguna lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/sessions/revoke-others:
    post:
      summary: Cabut semua sesi lain
      operationId: authRevokeOtherSessions
      description: |
        Mencabut semua sesi pengguna selain yang sedang dipakai ("keluar dari perangkat lain").
        Tercatat di audit (`REVOKE_OTHER_SESSIONS`).
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Jumlah sesi yang dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsRevokedResponse"
        "401":
          description: Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Access token tidak membawa `sid` (terbitan sebelum fitur sesi); masuk ulang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      summary: Mendapatkan profil pengguna saat ini
      operationId: authMe
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/change-password:
    post:
      summary: Mengubah password
      operationId: authChangePassword
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: |
            Password berhasil diubah. Penanda `wajib_ganti_password` dimatikan. Sesi yang sedang dipakai
            tetap hidup (id sesi sama) dengan access dan refresh token baru; semua sesi lain dicabut.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          description: Password baru terlalu lemah atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password lama salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/forgot-password:
    post:
      summary: Meminta reset password (mengirim email)
      operationId: authForgotPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: |
            Selalu mengembalikan sukses untuk mencegah email enumeration.
            Email reset akan dikirim jika email terdaftar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/reset-password:
    post:
      summary: Mereset password dengan token dari email
      description: |
        Token berlaku 30 menit dan hanya dapat dipakai satu kali (dipakai secara atomik: permintaan serentak
        dengan token sama hanya satu yang berhasil). Setelah berhasil, penanda wajib ganti password dimatikan,
        seluruh sesi lama dicabut, dan token lain milik akun yang sama dihanguskan. Tautan di email mengarah
        ke halaman web `/reset-password?token=...` (alamat dasar dari env `APP_PUBLIC_URL`).
      operationId: authResetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Password melanggar kebijakan (pesan memuat alasannya) atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid, sudah dipakai, atau kedaluwarsa (pesan membedakan kedaluwarsa dari tidak valid/terpakai)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/setup:
    post:
      summary: Memulai setup MFA (menghasilkan rahasia TOTP dan QR)
      description: |
        Rahasia disimpan bersegel AES (versi kunci tertera) dan belum aktif sampai `/v1/auth/mfa/verify`.
        Memanggil ulang sebelum verifikasi mengganti rahasia. Terbuka juga bagi sesi yang wajib setup MFA.
      operationId: authMFASetup
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rahasia TOTP berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MFA sudah aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Kunci enkripsi MFA (AES_KEY) belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/verify:
    post:
      summary: Memverifikasi kode pertama dan mengaktifkan MFA
      description: |
        Menerbitkan kode cadangan (sekali tampil, hanya hash yang tersimpan) dan sesi baru: semua sesi lama
        dicabut dan sesi baru tidak lagi dibatasi ke setup MFA. Kode salah dihitung terhadap batas kunci akun.
      operationId: authMFAVerify
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA berhasil diaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponse"
        "400":
          description: Kode TOTP tidak valid atau setup belum dimulai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MFA sudah aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Terlalu banyak percobaan salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/validate:
    post:
      summary: Menukar token tantangan MFA dan kode OTP dengan sesi
      description: |
        Publik (belum ada sesi). `code` adalah kode TOTP enam digit atau kode cadangan (huruf besar/kecil dan
        tanda hubung diabaikan). Kode TOTP hanya berlaku sekali per langkah waktu 30 detik; kode cadangan sekali
        pakai. Kode salah dihitung terhadap batas kunci akun yang sama dengan kata sandi salah.
      operationId: authMFAValidate
      tags:
        - Multi-Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAValidateRequest"
      responses:
        "200":
          description: Sesi diterbitkan (bentuk sama dengan login berhasil)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tantangan tidak valid atau kedaluwarsa, atau kode salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Akun terkunci karena terlalu banyak percobaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/backup-codes:
    post:
      summary: Menerbitkan kode cadangan baru
      description: Kode lama hangus. Memerlukan konfirmasi kata sandi. Kode polos hanya tampil sekali.
      operationId: authMFABackupCodes
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: Kode cadangan baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFABackupCodesResponse"
        "400":
          description: MFA belum aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/disable:
    post:
      summary: Menonaktifkan MFA
      description: |
        Memerlukan konfirmasi kata sandi. Rahasia dan semua kode cadangan dihapus. Ditolak (403) untuk akun
        yang MFA-nya diwajibkan.
      operationId: authMFADisable
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA berhasil dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: MFA diwajibkan untuk akun ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users:
    get:
      summary: Mendaftar semua pengguna (dengan paginasi)
      operationId: listUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Halaman
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Jumlah item per halaman
      responses:
        "200":
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Membuat pengguna baru
      operationId: createUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}:
    get:
      summary: Mendapatkan detail pengguna
      operationId: getUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID pengguna
      responses:
        "200":
          description: Detail pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/revoke-sessions:
    post:
      summary: Paksa keluar seorang pengguna
      operationId: revokeUserSessions
      description: |
        Mengakhiri semua sesi pengguna (izin `pengguna.kelola`). Access token dan refresh token
        pengguna itu berhenti berlaku seketika; ia dapat masuk lagi. Tercatat di audit (`FORCE_LOGOUT`).
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID pengguna
      responses:
        "200":
          description: Jumlah sesi yang dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForceLogoutResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/bulk:
    post:
      summary: Menjalankan aksi massal pada pengguna
      operationId: bulkUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUserRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUserResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga:
    get:
      summary: Mendaftar entri harga
      description: |
        Entri terbaru lebih dulu, disaring dan dipaginasi di server. Memerlukan izin `harga.lihat`.
        Jumlah seluruh hasil filter ada di header `X-Total-Count`.
      operationId: listHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - $ref: "#/components/parameters/HargaWilayah"
        - $ref: "#/components/parameters/HargaKomoditas"
        - name: pasar_id
          in: query
          schema:
            type: string
        - name: urut
          in: query
          description: Kosong untuk entri terbaru lebih dulu; `skor` untuk skor anomali tertinggi lebih dulu (prioritas antrean validasi)
          schema:
            type: string
            enum: [skor]
        - name: dari
          in: query
          description: Tanggal awal (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: sampai
          in: query
          description: Tanggal akhir (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Satu halaman entri harga
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil filter (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Mencatat entri harga baru
      description: |
        Entri disimpan berstatus DIAJUKAN atas nama pengguna. Memerlukan izin `harga.input`. Tercatat di audit trail.
        Header `Idempotency-Key` bersifat opsional di sini; bila dikirim, kiriman ulang oleh pengguna yang sama
        mengembalikan entri semula (200).
      operationId: createHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHargaRequest"
      responses:
        "201":
          description: Entri harga dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "400":
          description: Validasi gagal, komoditas atau pasar tidak ada, atau waktu pencatatan di masa depan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/saya:
    get:
      summary: Mendaftar entri harga milik pengguna yang masuk
      description: Riwayat petugas lapangan. Memerlukan izin `harga.input`. Parameter dan header sama dengan `GET /v1/harga`.
      operationId: listHargaSaya
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Entri milik pengguna
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/ringkasan:
    get:
      summary: Jumlah entri harga per status
      operationId: getHargaRingkasan
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: hari
          in: query
          description: Jendela waktu dalam hari terakhir
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 7
      responses:
        "200":
          description: Ringkasan per status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingkasanHargaResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/tren:
    get:
      summary: Tren harga komoditas di satu kabupaten/kota
      description: Rata-rata harga entri berstatus DIVALIDASI atau DIPUBLIKASI per hari atau pekan, dipisah menurut produsen dan konsumen. Hari tanpa entri tidak muncul.
      operationId: getHargaTren
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: komoditas
          in: query
          required: true
          description: Kode komoditas
          schema:
            type: string
        - name: wilayah
          in: query
          required: true
          description: Kode kabupaten/kota
          schema:
            type: string
        - name: hari
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 45
        - name: interval
          in: query
          schema:
            type: string
            enum: [harian, mingguan]
            default: harian
      responses:
        "200":
          description: Deret tren menaik menurut tanggal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrenHargaResponse"
        "400":
          description: Komoditas atau wilayah kosong, atau interval tidak dikenal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/bulk:
    post:
      summary: Menjalankan aksi massal pada entri harga
      description: |
        State machine entri harga ditegakkan di server. Izin diperiksa per aksi: `harga.input` untuk ajukan
        (hanya petugas pencatat), `harga.validasi` untuk validasi, tolak, dan kembalikan, `harga.publikasi`
        untuk publikasi. Validator dan penerbit tidak boleh sama dengan petugas pencatat (pemisahan tugas,
        juga dijaga CHECK di basis data). Entri yang dilewati dilaporkan di `rincian` beserta sebabnya.
        Alasan wajib untuk tolak (3 sampai 1000 karakter) dan tampil bagi petugas pencatat. Setiap
        perpindahan tercatat di riwayat status dan audit trail.

        | Aksi | Dari status | Ke status |
        | --- | --- | --- |
        | ajukan | DRAF | DIAJUKAN |
        | validasi | DIAJUKAN | DIVALIDASI |
        | publikasi | DIVALIDASI | DIPUBLIKASI |
        | tolak | DIAJUKAN | DITOLAK |
        | kembalikan | DIAJUKAN, DIVALIDASI | DRAF |
      operationId: bulkHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkHargaRequest"
      responses:
        "200":
          description: Aksi massal diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkHargaResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin untuk aksi tersebut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/{id}/riwayat:
    get:
      summary: Riwayat perpindahan status entri harga
      description: |
        Yang terlama lebih dulu. `harga.lihat` membuka semua entri; petugas dengan `harga.input` hanya
        entri yang ia catat sendiri (entri lain tampil sebagai 404).
      operationId: getHargaRiwayat
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Riwayat status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiwayatStatusEntriResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat` maupun `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entri tidak ada atau bukan milik pemanggil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/{id}:
    get:
      summary: Mendapatkan detail entri harga
      operationId: getHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID entri harga
      responses:
        "200":
          description: Detail entri harga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HargaDetailResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entri harga tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews:
    get:
      summary: Mendaftar alert EWS (terbaru dahulu)
      description: Memerlukan izin `ews.lihat`. Filter dan paginasi dijalankan di server.
      operationId: listEwsAlerts
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [BARU, DIAKUI, DIESKALASI, SELESAI]
        - name: severity
          in: query
          schema:
            type: string
            enum: [INFO, WASPADA, SIAGA, KRITIS]
        - name: jenis
          in: query
          schema:
            type: string
            enum: [LONJAKAN_HARGA, KELANGKAAN_STOK, ANOMALI_CUACA, OVER_SUPPLY, ANOMALI_DATA]
        - name: kabupaten_kode
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Ukuran halaman (bawaan 200, maksimum 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Daftar alert
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil filter (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsAlertListResponse"
        "400":
          description: Nilai filter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `ews.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/aturan:
    get:
      summary: Mendaftar aturan ambang EWS beserta kanal notifikasi
      description: Memerlukan izin `ews.lihat`. Ambang bersifat awal dan harus dikalibrasi.
      operationId: listEwsAturan
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar aturan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsAturanListResponse"
        "403":
          description: Tanpa izin `ews.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/stream:
    get:
      summary: Aliran real-time alert EWS (Server-Sent Events)
      description: |
        Memerlukan izin `ews.lihat`. Autentikasi lewat header `Authorization: Bearer` atau cookie
        `garda_access` (EventSource browser). Koneksi tetap terbuka (`Content-Type: text/event-stream`);
        server mengirim `retry: 5000`, komentar `: ping` tiap 25 detik, dan event `alert` setiap
        alert dibuat atau naik tingkat oleh rule engine. `id` event berurut; klien yang menyambung
        ulang mengirim `Last-Event-ID` (otomatis oleh EventSource) dan hanya menerima peristiwa
        setelahnya, tanpa duplikat. Tanpa `Last-Event-ID` aliran dimulai dari sekarang.
        Antar-instance disinkronkan lewat Redis pub/sub bila `REDIS_URL` tersedia, dengan polling
        basis data sebagai cadangan. Proxy tidak boleh mem-buffer respons ini.
      operationId: streamEwsAlerts
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: id event terakhir yang diterima klien
      responses:
        "200":
          description: |
            Aliran SSE. Contoh frame:
            `id: 42` / `event: alert` / `data: {"id":"EWS-2000","severity":"KRITIS", ...}` (bentuk `EwsAlert`).
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Tanpa token atau cookie yang valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `ews.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/notifikasi/preferensi:
    get:
      summary: Preferensi notifikasi milik pengguna yang masuk
      description: |
        Memerlukan izin `ews.akui` (peran penindak alert yang menerima notifikasi). Bawaan bila belum
        diatur: aktif, tingkat minimum SIAGA. `tersedia: false` berarti server belum mengonfigurasi
        pengiriman nyata untuk kanal itu (SMTP_HOST untuk EMAIL, kunci VAPID untuk PUSH): notifikasi
        hanya dicatat di outbox `ews_notifikasi`. `vapid_public_key` dipakai browser untuk berlangganan push.
      operationId: getEwsPreferensi
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Preferensi per kanal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsPreferensiResponse"
        "403":
          description: Tanpa izin `ews.akui`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Menyimpan preferensi notifikasi
      description: Memerlukan izin `ews.akui`. Mengembalikan preferensi terbaru. Dicatat di audit trail.
      operationId: putEwsPreferensi
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimpanEwsPreferensiRequest"
      responses:
        "200":
          description: Preferensi tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsPreferensiResponse"
        "400":
          description: Kanal atau tingkat minimum tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `ews.akui`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/notifikasi/langganan-push:
    put:
      summary: Mendaftarkan perangkat untuk Web Push
      description: |
        Memerlukan izin `ews.akui`. Isi dari `PushSubscription.toJSON()` browser. Endpoint yang sama
        berpindah ke pengguna yang mendaftar terakhir. Dicatat di audit trail.
      operationId: putEwsLanggananPush
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EwsLanggananPushRequest"
      responses:
        "200":
          description: Langganan tersimpan
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `ews.akui`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Membatalkan langganan Web Push perangkat
      description: Memerlukan izin `ews.akui`. Hanya langganan milik pengguna yang masuk.
      operationId: deleteEwsLanggananPush
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
      responses:
        "200":
          description: Langganan dibatalkan
        "403":
          description: Tanpa izin `ews.akui`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Langganan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/aturan/{id}:
    put:
      summary: Mengubah ambang suatu aturan EWS
      description: |
        Memerlukan izin `ews.atur_ambang`. Ambang harus positif dan menaik (waspada < siaga < kritis).
        Optimistic locking: `versi` harus sama dengan versi aturan saat ini, bila tidak 409. Setiap
        perubahan menaikkan versi, menyimpan foto di riwayat, dan dicatat di audit trail.
      operationId: updateEwsAturan
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID aturan, mis. ATR-LH-CBM-KRT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEwsAturanRequest"
      responses:
        "200":
          description: Aturan tersimpan (versi baru)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsAturanResponse"
        "400":
          description: Validasi gagal atau ambang tidak menaik
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `ews.atur_ambang`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Aturan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Aturan sudah diubah pengguna lain (versi usang)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/evaluasi:
    post:
      summary: Menjalankan rule engine EWS sekarang
      description: |
        Memerlukan izin `ews.atur_ambang`. Mengevaluasi semua aturan aktif terhadap data nyata
        (harga tervalidasi, stok cold storage, cuaca harian) di luar jadwal. Idempoten: kondisi
        yang sudah punya alert aktif tidak membuat alert ganda. Dicatat di audit trail.
      operationId: evaluateEws
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Ringkasan satu putaran evaluasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsEvaluasiResponse"
        "403":
          description: Tanpa izin `ews.atur_ambang`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/{id}/riwayat:
    get:
      summary: Riwayat perubahan status alert
      description: Memerlukan izin `ews.lihat`. Terlama dahulu; `oleh_id` kosong berarti sistem.
      operationId: listEwsRiwayat
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Riwayat alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsRiwayatListResponse"
        "403":
          description: Tanpa izin `ews.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Alert tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/{id}:
    get:
      summary: Mendapatkan detail alert EWS
      description: Memerlukan izin `ews.lihat`.
      operationId: getEwsAlert
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID alert, mis. EWS-1000
      responses:
        "200":
          description: Detail alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsAlertResponse"
        "404":
          description: Alert tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/bulk:
    post:
      summary: Menjalankan aksi massal pada alert EWS
      description: |
        `akui` dan `selesai` memerlukan izin `ews.akui`; `eskalasi` memerlukan `ews.eskalasi`.
        Hanya transisi sah yang berlaku (BARU -> DIAKUI, BARU/DIAKUI -> DIESKALASI,
        selain SELESAI -> SELESAI); id yang tidak ada atau tak boleh bertransisi dihitung `gagal`.
        Aksi yang mengubah data dicatat di audit trail.
      operationId: bulkEwsAlerts
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEwsRequest"
      responses:
        "200":
          description: Aksi massal diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwsBulkResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin untuk aksi tersebut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi:
    get:
      summary: Mendaftar kartu intervensi (papan kanban)
      description: Memerlukan izin `intervensi.lihat`. Terurut per siklus, tahap, lalu urutan.
      operationId: listIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: siklus
          in: query
          schema:
            type: string
            enum: [NORMAL, TEKANAN, SURPLUS]
        - name: tahap
          in: query
          description: Kode tahap, mis. t-ews
          schema:
            type: string
        - name: prioritas
          in: query
          schema:
            type: string
            enum: [TINGGI, SEDANG, RENDAH]
      responses:
        "200":
          description: Daftar kartu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiListResponse"
        "400":
          description: Nilai filter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `intervensi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Membuat kartu intervensi
      description: |
        Memerlukan izin `intervensi.kelola`. Kartu masuk ke tahap pertama siklusnya di urutan
        paling bawah. Aksi dicatat di audit trail.
      operationId: createIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntervensiRequest"
      responses:
        "201":
          description: Kartu dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIntervensiResponse"
        "400":
          description: Validasi gagal, atau komoditas/kabupaten/alert/penanggung jawab tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `intervensi.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/tahap:
    get:
      summary: Mendaftar definisi tahap per siklus
      description: Memerlukan izin `intervensi.lihat`. Satu sumber untuk tahap, urutan, izin masuk, dan SLA.
      operationId: listIntervensiTahap
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Definisi tahap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiTahapListResponse"
        "403":
          description: Tanpa izin `intervensi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/{id}/tahap:
    patch:
      summary: Memindahkan kartu ke tahap dan posisi lain
      description: |
        Memerlukan salah satu dari `intervensi.kelola`, `intervensi.setujui`, `intervensi.setujui_fiskal`;
        izin yang tepat ditentukan oleh `izin_dibutuhkan` pada tahap tujuan. Kolom tujuan dinomori
        ulang; `urutan` di luar rentang dijepit. Memindahkan ke tahap penutup mengisi `selesai_pada`.
        Pemindahan maju tidak boleh melompati tahap persetujuan (izin selain `intervensi.kelola`) yang
        izinnya tidak dimiliki pemanggil (persetujuan berjenjang); pesan galat menyebut tahap dan izinnya.
        Optimistic locking: `versi` harus sama dengan versi kartu saat ini, bila tidak 409. Perpindahan
        tahap dicatat di riwayat kartu; pemindahan (juga yang ditolak) dicatat di audit trail.
      operationId: moveIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: INT-301
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveIntervensiRequest"
      responses:
        "200":
          description: Kartu dipindahkan; `versi` adalah versi baru kartu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveIntervensiResponse"
        "400":
          description: Tahap tidak terdefinisi untuk siklus kartu, atau masukan tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Izin tahap tujuan, atau izin tahap persetujuan yang dilompati, tidak dimiliki
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kartu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Kartu sudah diubah pengguna lain (versi usang)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/alur:
    get:
      summary: Definisi alur persetujuan berjenjang
      description: |
        Memerlukan izin `intervensi.lihat`. Alur disimpan sebagai data (dapat diubah tanpa deploy):
        satu alur pemindahan per tahap persetujuan dan satu alur eskalasi, masing-masing dengan langkah
        berurutan dan izin yang dibutuhkan tiap langkah.
      operationId: listIntervensiAlur
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar alur beserta langkahnya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiAlurListResponse"
        "403":
          description: Tanpa izin `intervensi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/persetujuan:
    get:
      summary: Mendaftar permintaan persetujuan (antrean Dewan Pengarah)
      description: |
        Memerlukan izin `intervensi.lihat`. Terbaru dahulu (maksimum 200). `izin_langkah_kini` adalah izin yang
        dibutuhkan untuk memutuskan langkah yang sedang menunggu.
      operationId: listIntervensiPersetujuan
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [MENUNGGU, DISETUJUI, DITOLAK]
      responses:
        "200":
          description: Daftar permintaan beserta rantai langkahnya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiPersetujuanListResponse"
        "400":
          description: Status tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `intervensi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/persetujuan/{pid}/keputusan:
    post:
      summary: Memutuskan langkah persetujuan yang sedang menunggu
      description: |
        Memerlukan `intervensi.setujui` atau `intervensi.setujui_fiskal`; izin yang tepat ditentukan oleh langkah
        yang menunggu (`izin_langkah_kini`). Pemisahan tugas: pengaju dan pemutus langkah sebelumnya tidak boleh
        memutus. `TOLAK` wajib bercatatan dan menutup permintaan (menolak eskalasi mencabut tanda eskalasi kartu).
        `SETUJU` pada langkah terakhir menyelesaikan permintaan dan, untuk pemindahan, memindahkan kartu ke tahap
        tujuan (akhir kolom). Keputusan dicatat di riwayat kartu dan audit trail.
      operationId: decideIntervensiPersetujuan
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutusPersetujuanRequest"
      responses:
        "200":
          description: Keputusan tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiPersetujuanResponse"
        "400":
          description: Masukan tidak valid, atau penolakan tanpa catatan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Izin langkah tidak dimiliki, atau melanggar pemisahan tugas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Permintaan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Permintaan sudah diputuskan atau langkahnya telah berpindah, atau kartu sudah selesai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/{id}/persetujuan:
    post:
      summary: Mengajukan persetujuan memindahkan kartu
      description: |
        Memerlukan izin `intervensi.kelola`. Untuk kartu yang hendak maju ke tahap persetujuan atau sesudahnya
        dan pemanggil tidak berwenang memindahkannya langsung. Rantai persetujuan adalah gabungan langkah alur
        tiap tahap persetujuan dari tahap kartu (tidak termasuk) sampai tahap tujuan (termasuk). Setelah semua
        langkah disetujui kartu dipindahkan otomatis. Hanya satu permintaan terbuka per kartu.
      operationId: ajukanIntervensiPersetujuan
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: INT-301
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjukanPersetujuanRequest"
      responses:
        "201":
          description: Permintaan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiPersetujuanResponse"
        "400":
          description: Tahap tidak valid, atau perpindahan tidak melewati tahap persetujuan (pindahkan langsung)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `intervensi.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kartu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Kartu sudah selesai, atau masih ada permintaan yang menunggu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/bulk:
    post:
      summary: Aksi massal pada kartu (tugaskan ke saya, eskalasi)
      description: |
        Memerlukan izin `intervensi.kelola`. `tugaskan` menambahkan pemanggil sebagai penanggung jawab;
        `eskalasi` menandai kartu dieskalasi ke Dewan Pengarah, menaikkan prioritasnya ke TINGGI, dan membuka
        permintaan telaah di antrean persetujuan (alur `eskalasi`).
        Hasil dikembalikan per kartu (urut sesuai `ids`, id ganda dibuang); kartu yang tidak ada, sudah
        selesai, sudah ditugaskan, atau sudah dieskalasi dilewati tanpa menggagalkan kartu lain. Kartu yang
        berubah naik versi, tercatat di riwayat kartu, dan aksinya di audit trail.
      operationId: bulkIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIntervensiRequest"
      responses:
        "200":
          description: Aksi diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIntervensiResponse"
        "400":
          description: Aksi atau daftar id tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `intervensi.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/{id}/riwayat:
    get:
      summary: Riwayat kartu intervensi
      description: Memerlukan izin `intervensi.lihat`. Terlama dahulu; `oleh_id` kosong berarti sistem.
      operationId: listIntervensiRiwayat
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: INT-301
      responses:
        "200":
          description: Riwayat kartu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervensiRiwayatListResponse"
        "403":
          description: Tanpa izin `intervensi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kartu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data:
    get:
      summary: Mendaftar katalog sumber data
      description: |
        Metadata sumber (API resmi dan scraper). Sumber yang belum pernah
        dijalankan berstatus `BELUM_AKTIF` dengan `terakhir_jalan` dan
        `keberhasilan_7h` null. Sesudah ada eksekusi, status, `terakhir_jalan`,
        `keberhasilan_7h` (persen run SUKSES dalam 7 hari), dan `latensi_ms`
        dihitung dari riwayat eksekusi. `bisa_dijalankan` benar bila sumber
        punya konektor ingestion. Butuh izin `sumber.lihat`.
      operationId: listSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar sumber, terurut menurut id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumberDataListResponse"
        "403":
          description: Tanpa izin `sumber.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/{id}:
    get:
      summary: Mendapatkan detail sumber data
      operationId: getSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SRC-BPS
      responses:
        "200":
          description: Detail sumber data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumberDataResponse"
        "404":
          description: Sumber data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/pipeline:
    get:
      summary: Isi lapisan bronze/silver/gold dan mutu data
      description: |
        Jumlah baris per lapisan dan empat ukuran mutu (persen 0-100) yang dihitung dari
        eksekusi ingestion nyata. `null` berarti belum ada bahan untuk menghitung (bukan 100%).

        - `bronze`: payload mentah (`data_mentah`).
        - `silver`: `harga_eksternal` + `cuaca_harian` hasil ingestion + `inflasi_bulanan` dan
          `andil_inflasi` bersumber BPS.
        - `gold`: baris `gold_harga_harian` (harga lapangan vs eksternal per hari).
        - `kelengkapan`: baris valid dari seluruh baris dibaca, 7 hari. `konsistensi`: baris
          yang kode wilayah/komoditasnya terpetakan ke master, 7 hari. `akurasi`: pasangan
          harga lapangan vs eksternal dengan selisih paling banyak 10%, 14 hari.
          `ketepatan_waktu`: sumber ber-konektor (tidak dijeda) yang eksekusi suksesnya terakhir
          tidak lebih tua dari dua kali selang jadwal.
        - `demo`: benar bila hitungan memuat eksekusi contoh (pemicu `DEMO`).

        Butuh izin `sumber.lihat`.
      operationId: getPipelineSumber
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Hitungan lapisan dan mutu data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSumberResponse"
        "403":
          description: Tanpa izin `sumber.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/{id}/eksekusi:
    get:
      summary: Riwayat eksekusi ingestion sebuah sumber
      description: |
        Terbaru lebih dulu. `ringkasan` memuat rincian baris yang ditolak:
        `tak_terpetakan` (alias sumber yang belum ada di pemetaan, dengan jumlah
        baris) dan `tidak_valid` (alasan dengan jumlah baris). Butuh izin `sumber.lihat`.
      operationId: listEksekusiSumber
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SRC-BI
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Riwayat eksekusi (larik kosong bila belum pernah dijalankan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EksekusiSumberListResponse"
        "400":
          description: limit di luar 1-100
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Sumber data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/{id}/sampel:
    get:
      summary: Cuplikan payload mentah (bronze) terbaru sebuah sumber
      description: |
        Awal payload (maks 2000 karakter) beserta ukuran utuhnya. Butuh izin `sumber.lihat`.
      operationId: listSampelSumber
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SRC-BI
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Cuplikan payload mentah, terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampelSumberListResponse"
        "400":
          description: limit di luar 1-100
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Sumber data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/{id}/jalankan:
    post:
      summary: Menjalankan ingestion sebuah sumber sekarang
      description: |
        Butuh izin `sumber.kelola`; tercatat di audit trail (`JALANKAN_SUMBER`,
        termasuk penolakan). Mengembalikan segera dengan eksekusi berstatus
        `BERJALAN`; pengambilan data berlanjut di latar belakang dan hasilnya
        dibaca dari `GET /v1/sumber-data/{id}/eksekusi`. Hanya satu eksekusi
        per sumber pada satu waktu.
      operationId: jalankanSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SRC-BI
      responses:
        "202":
          description: Eksekusi dimulai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EksekusiSumberResponse"
        "403":
          description: Tanpa izin `sumber.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Sumber data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Sumber sedang dijeda atau masih berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Sumber belum memiliki konektor ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/bulk:
    post:
      summary: Menjeda atau melanjutkan sumber data
      description: |
        Butuh izin `sumber.kelola`; tercatat di audit trail. Mengubah status
        di katalog; sumber dijeda tidak dijadwalkan dan tidak bisa dijalankan
        manual. `jeda` hanya berlaku untuk sumber yang belum dijeda;
        `lanjutkan` hanya untuk yang sedang dijeda dan mengembalikannya ke
        `TERTUNDA` (pernah berjalan) atau `BELUM_AKTIF` (belum pernah).
        Respons memuat `berhasil` dan `gagal` (id yang tidak berubah).
      operationId: bulkSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSumberDataRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/eksekutif:
    get:
      summary: Ringkasan dashboard eksekutif
      description: |
        Satu layar eksekutif untuk Aceh: inflasi bulanan terbaru dengan seri 12
        bulan dan penyumbang, neraca pangan, ruang fiskal, serta hitungan
        peringatan EWS dan kartu intervensi. Butuh izin `dashboard.eksekutif`.

        **Setiap angka membawa `sumber`.** `DEMO` berarti data contoh, bukan angka
        resmi; `demo` bernilai true bila ada blok ber-sumber DEMO dan UI wajib
        menampilkan label demo. Angka resmi (BPS, BI, DJPB, BAPANAS) hanya masuk lewat impor
        (ingestion BPS: `POST /v1/sumber-data/SRC-BPS/jalankan`).

        **Angka resmi didahulukan.** Bila sebuah blok punya baris resmi, baris contoh
        (DEMO) tidak dipakai sama sekali, walau lebih baru; seri 12 bulan dan penyumbang
        hanya dari golongan yang sama dengan bulan terbaru, jadi satu blok tidak pernah
        mencampur angka resmi dan contoh. Blok lain boleh tetap contoh (label demo tetap
        menyala untuk blok itu saja). `inflasi.diimpor_pada` menunjukkan kapan angka masuk.

        Blok yang datanya belum ada bernilai `null` (bukan galat). `fiskal` juga
        `null` untuk peran tanpa izin `fiskal.lihat`.
      operationId: getRingkasanEksekutif
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Ringkasan eksekutif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingkasanEksekutifResponse"
        "403":
          description: Tanpa izin `dashboard.eksekutif`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/kpi:
    get:
      summary: Mendaftar indikator kinerja (KPI)
      description: |
        Semua KPI dengan target berlaku, nilai terbaru yang tidak melewati
        `periode`, tren (paling banyak 6 periode), dan status capaian. Butuh izin
        `kpi.lihat`.

        Nilai dihitung job dari data yang ada (`otomatis`: true). KPI yang butuh
        model atau data yang belum ada bernilai null dengan status
        `MENUNGGU_DATA`, bukan 0. `baseline` kosong sampai ditetapkan pemangku
        kepentingan.
      operationId: listKpi
      tags:
        - KPI
      security:
        - BearerAuth: []
      parameters:
        - name: periode
          in: query
          description: Bulan acuan `YYYY-MM` (bawaan bulan berjalan)
          schema:
            type: string
            example: "2026-10"
        - name: wilayah
          in: query
          description: Kode kabupaten/kota 4 digit (bawaan seluruh provinsi)
          schema:
            type: string
            example: "1171"
      responses:
        "200":
          description: Daftar KPI terurut menurut kelompok dan urutan baku
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiListResponse"
        "400":
          description: Periode atau wilayah tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `kpi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/kpi/export:
    get:
      summary: Laporan KPI satu periode (CSV)
      description: |
        Isi sama dengan `/v1/kpi` untuk `periode` dan `wilayah` yang sama: satu baris per KPI,
        kolom `kelompok, kode, nama, satuan, arah_baik, otomatis, periode_nilai, nilai, target,
        ambang_waspada, baseline, status`. KPI tanpa nilai memiliki `nilai` kosong (bukan 0) dan
        status `MENUNGGU_DATA`. CSV bertitik koma dengan BOM UTF-8. Ekspor dicatat sebagai
        `EKSPOR_DATA` di audit trail. Butuh izin `kpi.lihat`.

        KPI otomatis 16-B: MAPE prediksi harga (proyeksi bertanggal target lewat vs harga konsumen
        tervalidasi), volatilitas (CV harga produsen), margin produsen-konsumen, volume masuk cold
        storage, dan efisiensi biaya rute (rencana optimal vs pembanding serakah). Utilisasi dan
        risiko food loss memakai buku besar transaksi stok. F1/AUC EWS, RMSE shelf-life, akurasi
        produksi, penurunan food loss, dan indeks koordinasi belum punya dasar data.
      operationId: exportKpi
      tags:
        - KPI
      security:
        - BearerAuth: []
      parameters:
        - name: periode
          in: query
          description: Bulan acuan `YYYY-MM` (bawaan bulan berjalan)
          schema:
            type: string
            example: "2026-10"
        - name: wilayah
          in: query
          description: Kode kabupaten/kota 4 digit (bawaan seluruh provinsi)
          schema:
            type: string
            example: "1171"
      responses:
        "200":
          description: Berkas CSV
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Periode atau wilayah tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `kpi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/kpi/{kode}/riwayat:
    get:
      summary: Riwayat satu KPI
      description: Paling banyak 36 periode terakhir (versi berlaku tiap periode), urut naik.
      operationId: getKpiRiwayat
      tags:
        - KPI
      security:
        - BearerAuth: []
      parameters:
        - name: kode
          in: path
          required: true
          schema:
            type: string
          example: LOG-UTILISASI-CS
        - name: periode
          in: query
          schema:
            type: string
            example: "2026-10"
        - name: wilayah
          in: query
          schema:
            type: string
            example: "1171"
      responses:
        "200":
          description: KPI beserta riwayat nilainya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiRiwayatResponse"
        "404":
          description: KPI tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/harga:
    post:
      summary: Mengirim entri harga dari aplikasi lapangan (idempoten)
      description: |
        Dipakai sync engine PWA. Memerlukan izin `harga.input`. Header `Idempotency-Key` wajib dan unik per
        petugas: kiriman ulang dengan kunci yang sama mengembalikan entri semula dengan status 200 dan
        header `Idempotent-Replayed: true`, tanpa menyimpan atau mencatat audit ulang.

        Bila petugas lain sudah mengirim harga yang berbeda untuk pasar, komoditas, dan tipe yang sama dalam
        3 jam dari waktu pencatatan (entri DRAF dan DITOLAK diabaikan), kiriman ditolak dengan 409 beserta
        versi server sebagai pembanding. Kirim ulang dengan `pertahankan: true` untuk tetap menyimpan versi
        sendiri. Entri ditautkan ke tugas lapangan petugas yang meminta pasar, tipe, dan komoditas ini, dan
        progres tugas bertambah satu per komoditas.
      operationId: kirimHargaLapangan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHargaRequest"
      responses:
        "201":
          description: Entri baru tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "200":
          description: Kiriman ulang; entri semula dikembalikan
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                example: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "400":
          description: Validasi gagal, Idempotency-Key tidak ada, komoditas atau pasar tidak ada, atau waktu pencatatan di masa depan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Bentrok dengan harga petugas lain; `data.versi_server` memuat pembandingnya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HargaBentrokResponse"

  /v1/lapangan/acuan:
    get:
      summary: Mengunduh data acuan untuk validasi harga offline
      description: |
        Komoditas aktif, pasar aktif beserta geofence, dan median harga resmi (DIVALIDASI atau DIPUBLIKASI)
        7 hari terakhir per komoditas, kabupaten, dan tipe (hanya bila minimal 3 sampel) dengan rentang wajar
        ±`toleransi`. Memerlukan izin `harga.input`. `versi` juga dikirim sebagai `ETag`; kirim kembali di
        `If-None-Match` agar server menjawab 304 tanpa isi bila data tidak berubah.
      operationId: getDataAcuan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Data acuan
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAcuanResponse"
        "304":
          description: Data tidak berubah sejak versi di If-None-Match
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/tugas/saya:
    get:
      summary: Mendaftar tugas survei milik pengguna yang masuk
      description: |
        Tugas yang belum selesai lebih dulu menurut tenggat, yang selesai di akhir. Memerlukan izin
        `tugas.lihat_sendiri` atau `tugas.kelola`. Status yang dikembalikan dihitung terhadap waktu
        sekarang: tugas belum selesai yang lewat tenggat adalah TERLAMBAT, dan yang sudah mulai
        diisi adalah BERJALAN.
      operationId: listTugasSaya
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tugas milik pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TugasLapanganListResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin tugas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/tugas/bulk:
    post:
      summary: Menjalankan aksi massal pada tugas lapangan
      description: |
        `tandai_selesai` menutup tugas yang targetnya sudah terpenuhi (terisi sama dengan atau lebih
        dari target) dan belum selesai; petugas hanya dapat menutup tugasnya sendiri, pemegang
        `tugas.kelola` dapat menutup tugas petugas lain. Tercatat di audit trail bila ada yang berubah.
        `unduh_data_acuan` tidak mengubah data: `berhasil` menghitung tugas yang boleh diunduh pemanggil.
      operationId: bulkTugasLapangan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTugasRequest"
      responses:
        "200":
          description: Aksi massal diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTugasResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin tugas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/tugas/{id}:
    get:
      summary: Mendapatkan detail tugas lapangan
      description: |
        Tugas milik petugas lain tampil sebagai 404 kecuali pemanggil memegang `tugas.kelola`.
        Selain bidang daftar, detail memuat `rincian_komoditas`: nama tiap komoditas tugas (urutan
        sama dengan `komoditas`) dan apakah sudah ada entri harga yang tertaut ke tugas untuk komoditas itu.
      operationId: getTugasLapangan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail tugas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TugasLapanganDetailResponse"
        "403":
          description: Tanpa izin tugas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/siklus/aktif:
    get:
      summary: Siklus ekonomi aktif suatu wilayah
      description: |
        Siklus dominan yang mewarnai seluruh antarmuka. Tanpa `wilayah_kode`, yang dipakai adalah
        provinsi Aceh (`11`). Memerlukan izin `dashboard.operasional`.
      operationId: getSiklusAktif
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: wilayah_kode
          in: query
          description: Kode provinsi
          schema:
            type: string
            default: "11"
      responses:
        "200":
          description: Siklus aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiklusAktifResponse"
        "403":
          description: Tanpa izin `dashboard.operasional`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Wilayah tidak punya siklus aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/operasional/kpi:
    get:
      summary: Kartu KPI dashboard operasional
      description: |
        Empat kartu (entri harga hari ini, tingkat validasi, komoditas di atas ambang, utilisasi
        cold storage) dari materialized view `mv_kpi_operasional`, yang disegarkan berkala dan setelah
        harga divalidasi atau dipublikasi. `tren` memuat 14 hari terakhir. `tone` mengikuti pencapaian
        target (`target_kpi`); kartu tanpa target bernada `data`. Memerlukan izin `dashboard.operasional`.
      operationId: getKpiOperasional
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Kartu KPI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiOperasionalListResponse"
        "403":
          description: Tanpa izin `dashboard.operasional`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/operasional/heatmap:
    get:
      summary: Peta panas harga konsumen
      description: |
        Perubahan harga konsumen terakhir terhadap rata-rata tertimbang tujuh hari sebelumnya,
        per komoditas dan kabupaten/kota, dari `mv_heatmap_harga` (entri lapangan tervalidasi).
        Sel yang belum punya data lapangan dilengkapi dari harga eksternal hasil ingestion
        (`gold_harga_harian`) dan ditandai `sumber: EKSTERNAL`; sel dengan data lapangan tidak
        pernah digantikan. Hanya kabupaten dan komoditas yang punya data yang dikembalikan.
        Memerlukan izin `dashboard.operasional`.
      operationId: getHeatmapHarga
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Kabupaten, komoditas, dan sel peta panas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapResponse"
        "403":
          description: Tanpa izin `dashboard.operasional`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/operasional/aktivitas-lapangan:
    get:
      summary: Capaian entri harga hari ini per kabupaten/kota
      description: |
        Entri harga konsumen (selain DRAF) hari ini menurut waktu Aceh terhadap target harian:
        jumlah petugas lapangan aktif kali jumlah komoditas aktif. Memerlukan izin `dashboard.operasional`.
      operationId: getAktivitasLapangan
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aktivitas per kabupaten/kota berpetugas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AktivitasLapanganListResponse"
        "403":
          description: Tanpa izin `dashboard.operasional`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/operasional/pembanding-harga:
    get:
      summary: Validasi silang harga lapangan vs eksternal
      description: |
        Pasangan terbaru (7 hari terakhir, waktu Aceh) harga konsumen lapangan tervalidasi dan
        harga eksternal hasil ingestion (PIHPS) per komoditas dan kabupaten/kota, dari
        `gold_harga_harian`. Sepakat bila selisih paling banyak `batas_pct` (10%).
        Memerlukan izin `dashboard.operasional`.
      operationId: getPembandingHarga
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Ringkasan pasangan dan selisih terbesar (kosong bila belum ada pasangan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PembandingHargaResponse"
        "403":
          description: Tanpa izin `dashboard.operasional`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/operasional/cuaca:
    get:
      summary: Cuaca harian terbaru per kabupaten/kota
      description: |
        Cuaca harian terbaru (hari ini atau sampai 3 hari ke belakang, waktu Aceh) hasil
        ingestion BMKG dari `cuaca_harian`. Prakiraan hari-hari mendatang tidak dipakai.
        Memerlukan izin `dashboard.operasional`.
      operationId: getCuacaWilayah
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cuaca per kabupaten/kota yang punya data (kosong bila belum ada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuacaWilayahListResponse"
        "403":
          description: Tanpa izin `dashboard.operasional`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/audit:
    get:
      summary: Daftar jejak audit (terbaru lebih dulu)
      description: |
        Filter dijalankan di server dan hasilnya dipaginasi dengan cursor. Butuh izin `audit.lihat`.
        Tabel `audit_log` bersifat append-only.
      operationId: auditList
      tags:
        - Audit
      security:
        - BearerAuth: []
      parameters:
        - name: dari
          in: query
          description: Batas bawah waktu (inklusif), RFC 3339 atau YYYY-MM-DD
          schema:
            type: string
        - name: sampai
          in: query
          description: Batas atas waktu (eksklusif); bila bertanggal YYYY-MM-DD mencakup seluruh hari itu
          schema:
            type: string
        - name: aktor
          in: query
          description: ID akun persis, atau potongan nama/email aktor
          schema:
            type: string
        - name: aksi
          in: query
          schema:
            type: string
            example: ASSIGN_ROLE
        - name: entitas
          in: query
          schema:
            type: string
            example: pengguna
        - name: hasil
          in: query
          schema:
            type: string
            enum: [BERHASIL, GAGAL, DITOLAK]
        - name: entitas_id
          in: query
          description: ID objek persis (jejak satu objek)
          schema:
            type: string
        - name: peran
          in: query
          description: Peran aktor persis (snapshot saat aksi)
          schema:
            type: string
        - name: correlation_id
          in: query
          description: Semua baris dari satu permintaan
          schema:
            type: string
        - name: q
          in: query
          description: Pencarian bebas (tak peka huruf besar-kecil) pada aksi, entitas, id entitas, nama/email aktor, dan correlation id
          schema:
            type: string
        - name: limit
          in: query
          description: Ukuran halaman (bawaan 50, maksimum 200)
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          description: Nilai `next_cursor` dari halaman sebelumnya
          schema:
            type: string
      responses:
        "200":
          description: Satu halaman jejak audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPageResponse"
        "400":
          description: Filter atau cursor tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `audit.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/audit/export:
    get:
      summary: Ekspor jejak audit ke CSV
      description: |
        Memakai filter yang sama dengan `/v1/audit` (limit dan cursor diabaikan). CSV bertitik koma
        dengan BOM UTF-8, terbaru lebih dulu, paling banyak 20.000 baris (`X-Export-Truncated: true`
        bila terpotong; persempit filter). Sel yang diawali `=`, `+`, `-`, `@` diberi awalan `'`
        agar tidak dibaca sebagai rumus. Ekspor dicatat sebagai `EKSPOR_DATA`. Butuh izin `audit.lihat`.
      operationId: auditExport
      tags:
        - Audit
      security:
        - BearerAuth: []
      parameters:
        - name: dari
          in: query
          schema:
            type: string
        - name: sampai
          in: query
          schema:
            type: string
        - name: aktor
          in: query
          schema:
            type: string
        - name: aksi
          in: query
          schema:
            type: string
        - name: entitas
          in: query
          schema:
            type: string
        - name: hasil
          in: query
          schema:
            type: string
            enum: [BERHASIL, GAGAL, DITOLAK]
        - name: entitas_id
          in: query
          schema:
            type: string
        - name: peran
          in: query
          schema:
            type: string
        - name: correlation_id
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Berkas CSV
          headers:
            X-Export-Rows:
              description: Jumlah baris data
              schema:
                type: integer
            X-Export-Truncated:
              description: "`true` bila hasil dipotong pada batas baris"
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
