          in: query
          schema:
            type: string
        - name: wilayah_kode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Data tren harga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
