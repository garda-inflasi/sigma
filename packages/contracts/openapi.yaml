                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Tugas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/tugas/bulk:
    post:
      summary: Menjalankan aksi massal pada tugas lapangan
      operationId: bulkTugasLapangan
      tags:
        - Lapangan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/master/wilayah:
    get:
      summary: Mendaftar wilayah (kabupaten/kota)
      operationId: listWilayah
      tags:
        - Master Data
      security:
        - BearerAuth: []
      parameters:
        - name: provinsi_kode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daftar wilayah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/master/pasar:
    get:
      summary: Mendaftar pasar
      operationId: listPasar
      tags:
        - Master Data
      security:
        - BearerAuth: []
      parameters:
        - name: kabupaten_kode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daftar pasar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/master/komoditas/bulk:
    post:
      summary: Menjalankan aksi massal pada master komoditas
      operationId: bulkKomoditas
      tags:
        - Master Data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkKomoditasRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage:
    get:
      summary: Ringkasan cold storage — fasilitas, stok tersimpan, dan agregat food loss
      description: |
        Satu permintaan memuat seluruh data layar Cold storage & food loss:
        kartu fasilitas (selalu semua fasilitas), satu halaman stok yang dapat
        disaring/diurutkan, dan ringkasan seluruh stok.

        `stok` mengikuti filter, urutan, dan halaman. `meta.volume_hasil_ton`
        menjumlahkan seluruh hasil filter. `ringkasan` mencakup seluruh stok dan
        **tidak** terpengaruh filter. Urutan bawaan adalah sisa masa simpan
        tersingkat lebih dulu; id lot menjadi pemutus seri agar urutan antar-halaman stabil.

        Memerlukan izin `coldstorage.lihat`.
      operationId: getColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      parameters: 
        - name: cold_storage_id
          in: query
          schema:
            type: string
            maxLength: 255
          description: Hanya stok pada fasilitas ini
          example: CS-03
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Cari pada nama komoditas atau pemilik (tanpa membedakan huruf besar/kecil)
          example: tomat
        - name: sort
          in: query
          schema:
            type: string
            enum: [sisa_masa_simpan, komoditas, fasilitas, volume, masuk, risiko, pemilik]
            default: sisa_masa_simpan
          description: Kolom pengurutan stok
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Jumlah lot stok per halaman
      responses:
        "200":
          description: Data cold storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColdStorageResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin `coldstorage.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/cold-storage/bulk:
    post:
      summary: Menjalankan aksi massal pada lot stok cold storage
      description: |
        Aksi bersifat advisori: tidak mengubah stok, tetapi tercatat di audit trail
        (`BULK_<aksi>`). Lot yang tidak ditemukan dihitung pada `gagal`.

        Izin yang diperlukan bergantung pada aksi:

        | Aksi | Izin |
        |---|---|
        | `rencanakan_distribusi` | `logistik.kelola` |
        | `rekomendasi_olahan` | `coldstorage.kelola` |
      operationId: bulkColdStorage
      tags:
        - Cold Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkColdStorageRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkColdStorageResponse"
        "400":
          description: Validasi gagal, aksi tidak valid, atau tidak ada lot yang dipilih
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Peran tidak memiliki izin untuk aksi ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT yang diperoleh dari endpoint login

  schemas:
    # ── Response Envelope ──────────────────────────────────────────────
    Envelope:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          nullable: true

    SuccessResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"
        data:
          nullable: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: "2026-10-15T03:00:00Z"

    # ── Authentication ─────────────────────────────────────────────────
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@garda-inflasi.id
        password:
          type: string
          format: password
          example: "Test1234!"

    LoginResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: Refresh token
            user:
              $ref: "#/components/schemas/UserObject"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token dari response login

    RefreshTokenResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: Password saat ini
        new_password:
          type: string
          format: password
          minLength: 8
          description: |
            Password baru. Minimal 8 karakter, mengandung huruf besar,
            angka, dan karakter spesial.

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email pengguna yang terdaftar

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Token reset password dari email
        password:
          type: string
          format: password
          minLength: 8
          description: Password baru

    # ── MFA ────────────────────────────────────────────────────────────
    MFASetupResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            secret:
              type: string
              description: Base32-encoded secret key untuk ditambahkan ke authenticator app
              example: JBSWY3DPEHPK3PXP
            provisioning_uri:
              type: string
              format: uri
              description: URI untuk QR code (otpauth://)
              example: otpauth://totp/Garda%20Inflasi:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Garda%20Inflasi
            backup_codes:
              type: array
              items:
                type: string
              description: 8 kode cadangan sekali pakai (8 karakter alfanumerik)
              example:
                - F3119FBC
                - 38F46BF0

    MFAVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Kode TOTP 6 digit dari authenticator app
          example: "123456"

    MFAValidateRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Kode TOTP 6 digit atau backup code 8 karakter
          example: "123456"

    MFADisableRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: Password saat ini untuk konfirmasi

    # ── User ───────────────────────────────────────────────────────────
    UserObject:
      type: object
      properties:
        id:
          type: string
          example: test-user-001
        nama:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: user@garda-inflasi.id
        peran:
          type: string
          enum:
            - STRATEGIS_FMIPA
            - STRATEGIS_BI
            - STRATEGIS_BPS
            - STRATEGIS_DJPB
            - MANAJER_PROGRAM
            - MANAJER_DATA
            - MANAJER_KEBIJAKAN
            - MANAJER_PEMBIAYAAN
            - MANAJER_RISIKO
            - MANAJER_MUTU
            - OPS_KOORDINATOR
            - OPS_AGREGATOR
            - OPS_MAHASISWA
            - ADMIN_SISTEM
          example: ADMIN_SISTEM
        lapis:
          type: string
          enum:
            - STRATEGIS
            - MANAJERIAL
            - OPERASIONAL
            - SISTEM
          example: SISTEM
        lembaga:
          type: string
          example: BPPSDMP
        kabupaten_kode:
          type: string
          nullable: true
          example: "1171"
        mfa_aktif:
          type: boolean
          example: false
        status:
          type: string
          enum:
            - AKTIF
            - NONAKTIF
            - MENUNGGU
          example: AKTIF
        terakhir_masuk:
          type: string
          format: date-time
          nullable: true
        dibuat_pada:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/UserObject"

    CreateUserRequest:
      type: object
      required:
        - nama
        - email
        - peran
        - lapis
        - lembaga
      properties:
        id:
          type: string
          description: ID opsional (akan digenerate jika kosong)
        nama:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@garda-inflasi.id
        password:
          type: string
          format: password
          minLength: 8
          description: "Password opsional (default: random)"
        peran:
          type: string
          example: OPS_MAHASISWA
        lapis:
          type: string
          example: OPERASIONAL
        lembaga:
          type: string
          example: BPPSDMP

    UserListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserObject"
            total:
              type: integer
              example: 42
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20

    # ── Bulk Operations ────────────────────────────────────────────────
    BulkActionRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          description: Nama aksi massal (bergantung pada modul)
          example: proses
        ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [1, 2, 3]

    BulkUserRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [aktifkan, nonaktifkan, wajibkan_mfa, akhiri_sesi]
        ids:
          type: array
          minItems: 1
          items:
            type: string
          example: ["user-001", "user-002"]

    BulkSumberDataRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [jalankan, jeda, lanjutkan]
        ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [1, 2]

    BulkKomoditasRequest:
      type: object
      required:
        - action
        - kode
      properties:
        action:
          type: string
          enum: [ajukan_perubahan, setujui, arsipkan]
        kode:
          type: array
          minItems: 1
          items:
            type: string
          example: ["BERAS", "CABAI"]

    BulkResultResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            berhasil:
              type: integer
              example: 3

    BulkUserResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            berhasil:
              type: integer
              example: 3
            gagal:
              type: integer
              example: 0
            errors:
              type: array
              items:
                type: string

    # ── Create Payloads ────────────────────────────────────────────────
    CreateHargaRequest:
      type: object
      required:
        - komoditas_kode
        - pasar_id
        - harga
      properties:
        komoditas_kode:
          type: string
          example: BERAS
        pasar_id:
          type: string
          example: P1
        harga:
          type: integer
          example: 12000
        tipe:
          type: string
          example: HARIAN
        tanggal:
          type: string
          format: date-time

    CreateIntervensiRequest:
      type: object
      required:
        - judul
        - tipe
      properties:
        judul:
          type: string
          example: Operasi Pasar Beras
        tipe:
          type: string
          example: OPERASI_PASAR
        deskripsi:
          type: string
        wilayah_kode:
          type: string
          example: "1171"

    # ── Cold Storage ───────────────────────────────────────────────────
    ColdStorageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/ColdStorageData"

    ColdStorageData:
      type: object
      properties:
        fasilitas:
          type: array
          description: Seluruh fasilitas; operasional lebih dulu, lalu perawatan, lalu rencana
          items:
            $ref: "#/components/schemas/FasilitasColdStorage"
        stok:
          type: array
          description: Satu halaman lot stok menurut filter dan urutan
          items:
            $ref: "#/components/schemas/StokColdStorage"
        meta:
          $ref: "#/components/schemas/ColdStoragePageMeta"
        ringkasan:
          $ref: "#/components/schemas/ColdStorageRingkasan"

    FasilitasColdStorage:
      type: object
      properties:
        id:
          type: string
          example: CS-01
        nama:
          type: string
          example: Cold Storage Lambaro
        kabupaten_kode:
          type: string
          example: "1106"
        kabupaten_nama:
          type: string
          description: Nama pada master wilayah
          example: KABUPATEN ACEH BESAR
        lat:
          type: number
          format: double
          example: 5.505
        lng:
          type: number
          format: double
          example: 95.37
        kapasitas_ton:
          type: integer
          example: 400
        terisi_ton:
          type: number
          format: double
          description: Jumlah volume seluruh lot di fasilitas
          example: 347.0
        utilisasi_persen:
          type: number
          format: double
          description: terisi_ton / kapasitas_ton × 100, satu desimal
          example: 86.8
        suhu_target_c:
          type: number
          format: double
          example: 4
        suhu_aktual_c:
          type: number
          format: double
          nullable: true
          description: Pembacaan sensor terakhir; null bila belum ada telemetri
          example: 3.5
        status:
          type: string
          enum: [OPERASIONAL, PERAWATAN, RENCANA]

    StokColdStorage:
      type: object
      properties:
        id:
          type: string
          example: STK-CS01-01
        cold_storage_id:
          type: string
          example: CS-01
        cold_storage_nama:
          type: string
          example: Cold Storage Lambaro
        komoditas_kode:
          type: string
          example: cabai_merah_keriting
        komoditas_nama:
          type: string
          example: Cabai Merah Keriting
        volume_ton:
          type: number
          format: double
          example: 34.9
        masuk_pada:
          type: string
          format: date-time
        kedaluwarsa_pada:
          type: string
          format: date-time
        sisa_masa_simpan_hari:
          type: integer
          description: Dibulatkan ke atas; 0 berarti sudah melewati batas
          example: 5
        risiko_food_loss:
          type: number
          format: double
          description: Pecahan 0–1
          example: 0.68
        pemilik:
          type: string
          example: KUD Pidie Jaya

    ColdStoragePageMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          description: Jumlah lot yang cocok dengan filter
          example: 23
        total_pages:
          type: integer
          example: 3
        volume_hasil_ton:
          type: number
          format: double
          description: Total volume seluruh hasil filter (semua halaman)
          example: 813.0

    ColdStorageRingkasan:
      type: object
      description: Agregat seluruh stok; tidak terpengaruh filter tabel
      properties:
        total_lot:
          type: integer
          format: int64
          example: 23
        total_volume_ton:
          type: number
          format: double
          example: 813.0
        risiko_tinggi_lot:
          type: integer
          format: int64
          example: 4
        risiko_tinggi_ton:
          type: number
          format: double
          example: 172.7
        ambang_risiko_tinggi:
          type: number
          format: double
          description: Lot dengan risiko di atas nilai ini dihitung berisiko tinggi
          example: 0.6

    BulkColdStorageRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [rencanakan_distribusi, rekomendasi_olahan]
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
          example: ["STK-CS01-01", "STK-CS03-01"]

    BulkColdStorageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            berhasil:
              type: integer
              description: Lot yang ditemukan dan diproses
              example: 2
            gagal:
              type: integer
              description: Id yang tidak ditemukan
              example: 0
            volume_ton:
              type: number
              format: double
              description: Total volume lot yang diproses
              example: 65.9
