openapi: "3.0.3"

info:
  title: Garda Inflasi API
  description: |
    API untuk platform Garda Inflasi — sistem pengendalian inflasi daerah
    terintegrasi dengan AI/ML, real-time monitoring, dan early warning system.

    ## Authentication

    Semua endpoint kecuali `/healthz`, `/v1/auth/login`, `/v1/auth/refresh`,
    `/v1/auth/forgot-password`, dan `/v1/auth/reset-password` memerlukan
    JWT Bearer token yang dikirim via header `Authorization: Bearer <token>`.

    Token diperoleh dari endpoint `POST /v1/auth/login`.
  version: "1.0.0"
  contact:
    name: FMIPA USK × Kanwil DJPb

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.garda-inflasi.dev
    description: Development

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/login:
    post:
      summary: Login pengguna
      operationId: authLogin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Akun tidak aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Akun terkunci karena terlalu banyak percobaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/refresh:
    post:
      summary: Refresh token
      operationId: authRefresh
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      summary: Logout pengguna
      operationId: authLogout
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      summary: Mendapatkan profil pengguna saat ini
      operationId: authMe
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/change-password:
    post:
      summary: Mengubah password
      operationId: authChangePassword
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: |
            Password berhasil diubah. Penanda `wajib_ganti_password` dimatikan, semua sesi
            lama dicabut, dan sesi baru dikembalikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          description: Password baru terlalu lemah atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password lama salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/forgot-password:
    post:
      summary: Meminta reset password (mengirim email)
      operationId: authForgotPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: |
            Selalu mengembalikan sukses untuk mencegah email enumeration.
            Email reset akan dikirim jika email terdaftar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/reset-password:
    post:
      summary: Mereset password dengan token dari email
      operationId: authResetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Password terlalu lemah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token reset tidak valid atau sudah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/setup:
    post:
      summary: Memulai setup MFA (menghasilkan secret TOTP)
      operationId: authMFASetup
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Secret TOTP berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupResponse"
        "400":
          description: MFA sudah aktif atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/verify:
    post:
      summary: Memverifikasi dan mengaktifkan MFA dengan kode TOTP
      operationId: authMFAVerify
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA berhasil diaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Kode TOTP tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/validate:
    post:
      summary: Memvalidasi kode MFA (TOTP atau backup code)
      operationId: authMFAValidate
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAValidateRequest"
      responses:
        "200":
          description: Kode MFA valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Kode MFA tidak valid (error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Kode MFA tidak valid (unauthorized) atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/disable:
    post:
      summary: Menonaktifkan MFA
      operationId: authMFADisable
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA berhasil dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Gagal menonaktifkan MFA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users:
    get:
      summary: Mendaftar semua pengguna (dengan paginasi)
      operationId: listUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Halaman
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Jumlah item per halaman
      responses:
        "200":
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Membuat pengguna baru
      operationId: createUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}:
    get:
      summary: Mendapatkan detail pengguna
      operationId: getUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID pengguna
      responses:
        "200":
          description: Detail pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/bulk:
    post:
      summary: Menjalankan aksi massal pada pengguna
      operationId: bulkUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUserRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUserResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga:
    get:
      summary: Mendaftar entri harga
      description: |
        Entri terbaru lebih dulu, disaring dan dipaginasi di server. Memerlukan izin `harga.lihat`.
        Jumlah seluruh hasil filter ada di header `X-Total-Count`.
      operationId: listHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - $ref: "#/components/parameters/HargaWilayah"
        - $ref: "#/components/parameters/HargaKomoditas"
        - name: pasar_id
          in: query
          schema:
            type: string
        - name: dari
          in: query
          description: Tanggal awal (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: sampai
          in: query
          description: Tanggal akhir (inklusif), YYYY-MM-DD waktu Aceh
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Satu halaman entri harga
          headers:
            X-Total-Count:
              description: Jumlah seluruh hasil filter (bukan hanya halaman ini)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Mencatat entri harga baru
      description: Entri disimpan berstatus DIAJUKAN atas nama pengguna. Memerlukan izin `harga.input`. Tercatat di audit trail.
      operationId: createHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHargaRequest"
      responses:
        "201":
          description: Entri harga dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHargaResponse"
        "400":
          description: Validasi gagal, komoditas atau pasar tidak ada, atau waktu pencatatan di masa depan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/saya:
    get:
      summary: Mendaftar entri harga milik pengguna yang masuk
      description: Riwayat petugas lapangan. Memerlukan izin `harga.input`. Parameter dan header sama dengan `GET /v1/harga`.
      operationId: listHargaSaya
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HargaStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Entri milik pengguna
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriHargaListResponse"
        "403":
          description: Tanpa izin `harga.input`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/ringkasan:
    get:
      summary: Jumlah entri harga per status
      operationId: getHargaRingkasan
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: hari
          in: query
          description: Jendela waktu dalam hari terakhir
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 7
      responses:
        "200":
          description: Ringkasan per status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingkasanHargaResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/tren:
    get:
      summary: Tren harga komoditas di satu kabupaten/kota
      description: Rata-rata harga entri berstatus DIVALIDASI atau DIPUBLIKASI per hari atau pekan, dipisah menurut produsen dan konsumen. Hari tanpa entri tidak muncul.
      operationId: getHargaTren
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: komoditas
          in: query
          required: true
          description: Kode komoditas
          schema:
            type: string
        - name: wilayah
          in: query
          required: true
          description: Kode kabupaten/kota
          schema:
            type: string
        - name: hari
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 45
        - name: interval
          in: query
          schema:
            type: string
            enum: [harian, mingguan]
            default: harian
      responses:
        "200":
          description: Deret tren menaik menurut tanggal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrenHargaResponse"
        "400":
          description: Komoditas atau wilayah kosong, atau interval tidak dikenal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/bulk:
    post:
      summary: Menjalankan aksi massal pada entri harga
      description: |
        Memerlukan `harga.validasi` untuk aksi validasi, tolak, dan kembalikan, atau `harga.publikasi` untuk aksi publikasi.
        Entri yang statusnya tidak memenuhi syarat, atau yang dicatat oleh pelaku sendiri
        (validasi dan publikasi), dilewati dan dihitung di `gagal`. Tercatat di audit trail.

        | Aksi | Dari status | Ke status |
        | --- | --- | --- |
        | validasi | DIAJUKAN | DIVALIDASI |
        | publikasi | DIVALIDASI | DIPUBLIKASI |
        | tolak | DIAJUKAN | DITOLAK |
        | kembalikan | DIAJUKAN, DIVALIDASI | DRAF |
      operationId: bulkHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkHargaRequest"
      responses:
        "200":
          description: Aksi massal diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkHargaResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin untuk aksi tersebut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/{id}:
    get:
      summary: Mendapatkan detail entri harga
      operationId: getHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID entri harga
      responses:
        "200":
          description: Detail entri harga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HargaDetailResponse"
        "403":
          description: Tanpa izin `harga.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entri harga tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/{id}:
    get:
      summary: Mendapatkan detail alert EWS
      operationId: getEwsAlert
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID alert
      responses:
        "200":
          description: Detail alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Alert tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/bulk:
    post:
      summary: Menjalankan aksi massal pada alert EWS
      operationId: bulkEwsAlerts
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi:
    post:
      summary: Membuat intervensi baru
      operationId: createIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntervensiRequest"
      responses:
        "201":
          description: Intervensi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
