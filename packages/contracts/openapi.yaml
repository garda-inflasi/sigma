openapi: "3.0.3"

info:
  title: Garda Inflasi API
  description: |
    API untuk platform Garda Inflasi — sistem pengendalian inflasi daerah
    terintegrasi dengan AI/ML, real-time monitoring, dan early warning system.

    ## Authentication

    Semua endpoint kecuali `/healthz`, `/v1/auth/login`, `/v1/auth/refresh`,
    `/v1/auth/forgot-password`, dan `/v1/auth/reset-password` memerlukan
    JWT Bearer token yang dikirim via header `Authorization: Bearer <token>`.

    Token diperoleh dari endpoint `POST /v1/auth/login`.
  version: "1.0.0"
  contact:
    name: FMIPA USK × Kanwil DJPb

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.garda-inflasi.dev
    description: Development

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/login:
    post:
      summary: Login pengguna
      operationId: authLogin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Akun tidak aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Akun terkunci karena terlalu banyak percobaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/refresh:
    post:
      summary: Refresh token
      operationId: authRefresh
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      summary: Logout pengguna
      operationId: authLogout
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      summary: Mendapatkan profil pengguna saat ini
      operationId: authMe
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/change-password:
    post:
      summary: Mengubah password
      operationId: authChangePassword
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Password baru terlalu lemah atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password lama salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/forgot-password:
    post:
      summary: Meminta reset password (mengirim email)
      operationId: authForgotPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: |
            Selalu mengembalikan sukses untuk mencegah email enumeration.
            Email reset akan dikirim jika email terdaftar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/reset-password:
    post:
      summary: Mereset password dengan token dari email
      operationId: authResetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Password terlalu lemah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token reset tidak valid atau sudah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/setup:
    post:
      summary: Memulai setup MFA (menghasilkan secret TOTP)
      operationId: authMFASetup
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Secret TOTP berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupResponse"
        "400":
          description: MFA sudah aktif atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/verify:
    post:
      summary: Memverifikasi dan mengaktifkan MFA dengan kode TOTP
      operationId: authMFAVerify
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA berhasil diaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Kode TOTP tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/validate:
    post:
      summary: Memvalidasi kode MFA (TOTP atau backup code)
      operationId: authMFAValidate
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAValidateRequest"
      responses:
        "200":
          description: Kode MFA valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Kode MFA tidak valid (error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Kode MFA tidak valid (unauthorized) atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/mfa/disable:
    post:
      summary: Menonaktifkan MFA
      operationId: authMFADisable
      tags:
        - Multi-Factor Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA berhasil dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Gagal menonaktifkan MFA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password salah atau token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users:
    get:
      summary: Mendaftar semua pengguna (dengan paginasi)
      operationId: listUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Halaman
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Jumlah item per halaman
      responses:
        "200":
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Membuat pengguna baru
      operationId: createUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}:
    get:
      summary: Mendapatkan detail pengguna
      operationId: getUser
      tags:
        - User Management
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID pengguna
      responses:
        "200":
          description: Detail pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/bulk:
    post:
      summary: Menjalankan aksi massal pada pengguna
      operationId: bulkUsers
      tags:
        - User Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUserRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUserResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga:
    post:
      summary: Mencatat entri harga baru
      operationId: createHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHargaRequest"
      responses:
        "201":
          description: Entri harga dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/bulk:
    post:
      summary: Menjalankan aksi massal pada entri harga
      operationId: bulkHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tidak memiliki izin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/{id}:
    get:
      summary: Mendapatkan detail entri harga
      operationId: getHarga
      tags:
        - Harga
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID entri harga
      responses:
        "200":
          description: Detail entri harga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Entri harga tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/harga/tren:
    get:
      summary: Mendapatkan tren harga per komoditas/wilayah
      operationId: getHargaTren
      tags:
        - Harga
      security:
