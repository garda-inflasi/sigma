  /v1/prediksi:
    get:
      summary: Proyeksi harga seluruh komoditas
      description: |
        Proyeksi terbaru tiap komoditas dari model berstatus PRODUKSI untuk satu
        kabupaten dan horizon. Baris berpenanda `sumber: DEMO` berasal dari seed
        contoh, bukan model sungguhan.
      operationId: listPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      parameters:
        - name: kabupaten
          in: query
          description: Kode kabupaten/kota BPS (4 digit). Bawaan 1171 (Kota Banda Aceh).
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: horizon
          in: query
          description: Horizon proyeksi dalam hari (1-365). Bawaan 14.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Daftar proyeksi (kosong bila tidak ada proyeksi untuk kombinasi itu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiRingkasanListResponse"
        "400":
          description: Kabupaten atau horizon tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/registri:
    get:
      summary: Registri model prediksi
      description: Seluruh versi model (produksi, kandidat, arsip) beserta MAPE dan drift.
      operationId: listModelPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Registri model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiModelListResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/{kode}:
    get:
      summary: Proyeksi harga dan penjelasan faktor satu komoditas
      description: |
        Seri grafik (riwayat harga konsumen tervalidasi bila ada, titik sambung pada
        hari dasar, titik proyeksi), kontribusi faktor ala SHAP, narasi dan rekomendasi
        dari templat aturan (bukan LLM), serta model yang menghasilkannya.
      operationId: getPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      parameters:
        - name: kode
          in: path
          required: true
          schema:
            type: string
          example: CBM-KRT
        - name: kabupaten
          in: query
          description: Kode kabupaten/kota BPS (4 digit). Bawaan 1171 (Kota Banda Aceh).
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: horizon
          in: query
          description: Horizon proyeksi dalam hari (1-365). Bawaan 14.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Proyeksi lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiProyeksiResponse"
        "400":
          description: Kabupaten atau horizon tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tidak ada proyeksi model produksi untuk kombinasi itu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/prediksi/{kode}/export:
    get:
      summary: Unduh proyeksi satu komoditas (JSON)
      description: Isi sama dengan `GET /v1/prediksi/{kode}`, tanpa envelope, sebagai lampiran berkas.
      operationId: exportPrediksi
      tags:
        - Prediksi
      security:
        - BearerAuth: []
      parameters:
        - name: kode
          in: path
          required: true
          schema:
            type: string
        - name: kabupaten
          in: query
          description: Kode kabupaten/kota BPS (4 digit). Bawaan 1171 (Kota Banda Aceh).
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: horizon
          in: query
          description: Horizon proyeksi dalam hari (1-365). Bawaan 14.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Berkas JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrediksiProyeksi"
        "403":
          description: Tanpa izin `prediksi.lihat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tidak ada proyeksi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT yang diperoleh dari endpoint login

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Kunci unik per kiriman (mis. UUID dari perangkat), maksimal 255 karakter
      schema:
        type: string
        maxLength: 255
    HargaStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [DRAF, DIAJUKAN, DIVALIDASI, DIPUBLIKASI, DITOLAK]
    HargaWilayah:
      name: wilayah
      in: query
      description: Kode kabupaten/kota
      schema:
        type: string
    HargaKomoditas:
      name: komoditas
      in: query
      description: Kode komoditas
      schema:
        type: string

  schemas:
    # ── Response Envelope ──────────────────────────────────────────────
    Envelope:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          nullable: true

    SuccessResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"
        data:
          nullable: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: "2026-10-15T03:00:00Z"

    # ── Authentication ─────────────────────────────────────────────────
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@gardainflasi.id
        password:
          type: string
          format: password
          example: "Test1234!"

    LoginResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: Refresh token
            user:
              $ref: "#/components/schemas/UserObject"
            mfa_required:
              type: boolean
              description: True bila akun harus menyelesaikan MFA; token sesi dan user tidak disertakan
            mfa_token:
              type: string
              description: Token tantangan MFA (5 menit), bukan kredensial sesi
            mfa_setup_diwajibkan:
              type: boolean
              description: Sesi hanya membuka endpoint setup MFA sampai MFA diaktifkan

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token dari response login

    RefreshTokenResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: Password saat ini
        new_password:
          type: string
          format: password
          minLength: 8
          description: |
            Password baru. Minimal 8 karakter, mengandung huruf besar,
            angka, dan karakter spesial.

    ChangePasswordResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email pengguna yang terdaftar

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Token reset password dari email
        password:
          type: string
          format: password
          minLength: 8
          description: Password baru

    # ── MFA ────────────────────────────────────────────────────────────
    MFASetupResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            secret:
              type: string
              description: Rahasia base32 (20 byte acak) untuk entri manual di aplikasi autentikator
              example: JBSWY3DPEHPK3PXP
            provisioning_uri:
              type: string
              description: URI otpauth:// untuk kode QR
              example: otpauth://totp/Garda%20Inflasi:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Garda+Inflasi
            qr_svg:
              type: string
              description: Kode QR dari provisioning_uri sebagai dokumen SVG

    MFAVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: Kode TOTP 6 digit dari authenticator app
          example: "123456"

    MFAVerifyResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            kode_cadangan:
              type: array
              description: 10 kode cadangan sekali pakai, format XXXXX-XXXXX; hanya tampil sekali
              items:
                type: string

    MFABackupCodesResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          type: object
          properties:
            kode_cadangan:
              type: array
              items:
                type: string

    MFAValidateRequest:
      type: object
      required:
        - mfa_token
        - code
      properties:
        mfa_token:
          type: string
          description: Token tantangan dari respons login (mfa_required)
        code:
          type: string
          maxLength: 32
          description: Kode TOTP 6 digit atau kode cadangan
          example: "123456"

    MeResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
        data:
          allOf:
            - $ref: "#/components/schemas/UserObject"
            - type: object
              properties:
                mfa_setup_diwajibkan:
                  type: boolean
                  description: Akun wajib MFA tetapi belum mengaktifkannya
                mfa_wajib:
                  type: boolean
                  description: MFA tidak boleh dinonaktifkan oleh pemilik akun
                kode_cadangan_tersisa:
                  type: integer
                  description: Hanya ada bila MFA aktif

    MFADisableRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: Password saat ini untuk konfirmasi

    # ── User ───────────────────────────────────────────────────────────
    UserObject:
      type: object
      properties:
        id:
          type: string
          example: test-user-001
        nama:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: user@gardainflasi.id
        peran:
          type: string
          enum:
            - STRATEGIS_FMIPA
            - STRATEGIS_BI
            - STRATEGIS_BPS
            - STRATEGIS_DJPB
            - MANAJER_PROGRAM
            - MANAJER_DATA
            - MANAJER_KEBIJAKAN
            - MANAJER_PEMBIAYAAN
            - MANAJER_RISIKO
            - MANAJER_MUTU
            - OPS_KOORDINATOR
            - OPS_AGREGATOR
            - OPS_MAHASISWA
            - ADMIN_SISTEM
          example: ADMIN_SISTEM
        lapis:
          type: string
          enum:
            - STRATEGIS
            - MANAJERIAL
            - OPERASIONAL
            - SISTEM
          example: SISTEM
        lembaga:
          type: string
          example: BPPSDMP
        kabupaten_kode:
          type: string
          nullable: true
          example: "1171"
        mfa_aktif:
          type: boolean
          example: false
        status:
          type: string
          enum:
            - AKTIF
            - NONAKTIF
            - MENUNGGU
          example: AKTIF
        terakhir_masuk:
          type: string
          format: date-time
          nullable: true
        dibuat_pada:
          type: string
          format: date-time
        wajib_ganti_password:
          type: boolean
          description: |
            True bila kata sandi akun ditetapkan pihak lain (admin awal, akun baru, reset
            administrator). Selama aktif, semua endpoint selain `/v1/auth/change-password`,
            `/v1/auth/logout`, dan `/v1/auth/me` menjawab 403 dengan `code`
            `PASSWORD_CHANGE_REQUIRED`.
          example: false

    UserResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/UserObject"

    CreateUserRequest:
      type: object
      required:
        - nama
        - email
        - peran
        - lapis
        - lembaga
      properties:
        id:
          type: string
          description: ID opsional (akan digenerate jika kosong)
        nama:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@gardainflasi.id
        password:
          type: string
          format: password
          minLength: 8
          description: "Password opsional (default: random)"
        peran:
          type: string
          example: OPS_MAHASISWA
        lapis:
          type: string
          example: OPERASIONAL
        lembaga:
          type: string
          example: BPPSDMP

    UserListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserObject"
            total:
              type: integer
              example: 42
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20

    # ── Bulk Operations ────────────────────────────────────────────────
    BulkActionRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          description: Nama aksi massal (bergantung pada modul)
          example: proses
        ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [1, 2, 3]

    BulkUserRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [aktifkan, nonaktifkan, wajibkan_mfa, akhiri_sesi]
        ids:
          type: array
          minItems: 1
          items:
            type: string
          example: ["user-001", "user-002"]

    BulkSumberDataRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [jeda, lanjutkan]
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
          example: ["SRC-BPS", "SRC-BI"]

    KpiNilai:
      type: object
      properties:
        periode:
          type: string
          format: date
          description: Bulan (tanggal 1)
        nilai:
          type: number
        versi:
          type: integer
          description: Revisi menambah versi; versi terbesar yang berlaku
        dihitung_pada:
          type: string
          format: date-time

    Kpi:
      type: object
      properties:
        kode:
          type: string
          example: LOG-UTILISASI-CS
        kelompok:
          type: string
          enum: [DATA_SISTEM, LOGISTIK, DAMPAK_EKONOMI, TINDAK_LANJUT]
        nama:
          type: string
        deskripsi:
          type: string
        rumus:
          type: string
        satuan:
          type: string
        arah_baik:
          type: string
          enum: [NAIK, TURUN]
        frekuensi:
          type: string
          enum: [HARIAN, MINGGUAN, BULANAN, TRIWULAN]
        otomatis:
          type: boolean
          description: Ada penghitung otomatis; false = menunggu model atau data lain
        target:
          type: object
          nullable: true
          properties:
            nilai:
              type: number
            ambang_waspada:
              type: number
              nullable: true
            baseline:
              type: number
              nullable: true
              description: Kosong sampai ditetapkan pemangku kepentingan
            periode_mulai:
              type: string
              format: date
        nilai:
          allOf:
            - $ref: "#/components/schemas/KpiNilai"
          nullable: true
        tren:
          type: array
          items:
            $ref: "#/components/schemas/KpiNilai"
        status:
          type: string
          enum: [TERCAPAI, WASPADA, TIDAK_TERCAPAI, TANPA_TARGET, MENUNGGU_DATA]

    KpiListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Kpi"

    KpiRiwayatResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            kpi:
              $ref: "#/components/schemas/Kpi"
            riwayat:
              type: array
              items:
                $ref: "#/components/schemas/KpiNilai"

    SumberAngka:
      type: string
      enum: [BPS, BI, DJPB, BAPANAS, DEMO]
      description: Asal angka; DEMO = data contoh, bukan angka resmi

    RingkasanEksekutif:
      type: object
      properties:
        demo:
          type: boolean
          description: Benar bila ada blok ber-sumber DEMO
        inflasi:
          type: object
          nullable: true
          properties:
            periode:
              type: string
              format: date
              description: Bulan data (tanggal 1)
            sumber:
              $ref: "#/components/schemas/SumberAngka"
            diimpor_pada:
              type: string
              format: date-time
            ihk:
              type: number
            yoy:
              type: number
            mtm:
              type: number
            ytd:
              type: number
            sasaran:
              type: object
              properties:
                tahun:
                  type: integer
                bawah:
                  type: number
                atas:
                  type: number
            seri:
              type: array
              description: Paling banyak 12 bulan, urut naik
              items:
                type: object
                properties:
                  periode:
                    type: string
                    format: date
                  yoy:
                    type: number
            penyumbang:
              type: array
              description: Paling banyak 6 komoditas, andil terbesar lebih dulu
              items:
                type: object
                properties:
                  kode:
                    type: string
                  nama:
                    type: string
                  andil:
                    type: number
                    description: Poin persen
        neraca:
          type: object
          nullable: true
          properties:
            periode:
              type: string
              format: date
            sumber:
              $ref: "#/components/schemas/SumberAngka"
            items:
              type: array
              items:
                type: object
                properties:
                  komoditas_kode:
                    type: string
                  nama:
                    type: string
                  produksi_ton:
                    type: number
                  konsumsi_ton:
                    type: number
                  stok_ton:
                    type: number
                    nullable: true
        fiskal:
          type: object
          nullable: true
          description: Null bila belum ada data atau peran tanpa `fiskal.lihat`
          properties:
            sumber:
              $ref: "#/components/schemas/SumberAngka"
            per_tanggal:
              type: string
              format: date
            pagu:
              type: integer
              format: int64
            realisasi:
              type: integer
              format: int64
            skor:
              type: integer
              description: Indikatif, dari porsi pagu yang belum terealisasi (0-100)
            status:
              type: string
              enum: [MEMADAI, TERBATAS, KRITIS]
            instrumen:
              type: array
              items:
                type: object
                properties:
                  nama:
                    type: string
                  pagu:
                    type: integer
                    format: int64
                  realisasi:
                    type: integer
                    format: int64
        ews:
          type: object
          description: Peringatan belum selesai per severity
          additionalProperties:
            type: integer
          example: { INFO: 0, WASPADA: 2, SIAGA: 1, KRITIS: 0 }
        intervensi:
          type: object
          description: Kartu per siklus (normal, tekanan, surplus)
          additionalProperties:
            type: object
            properties:
              aktif:
                type: integer
              selesai:
                type: integer
        siklus_dominan:
          type: string
          enum: [normal, tekanan, surplus]

    RingkasanEksekutifResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/RingkasanEksekutif"

    SumberData:
      type: object
      properties:
        id:
          type: string
          example: SRC-BPS
        nama:
          type: string
        penyedia:
          type: string
        jenis:
          type: string
          enum: [API, SCRAPER]
        cakupan:
          type: string
        jadwal_cron:
          type: string
          description: Cron lima kolom dalam zona waktu WIB (Asia/Jakarta)
          example: "0 6 * * *"
        status:
          type: string
          enum: [BELUM_AKTIF, SEHAT, TERTUNDA, GAGAL, DIJEDA]
        terakhir_jalan:
          type: string
          format: date-time
          nullable: true
        keberhasilan_7h:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Persen; null bila belum ada eksekusi
        latensi_ms:
          type: integer
        robots_txt_patuh:
          type: boolean
        atribusi:
          type: string
        url_dasar:
          type: string
          nullable: true

    SumberDataResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/SumberData"

    SumberDataListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/SumberData"

    BulkKomoditasRequest:
      type: object
      required:
        - action
        - kode
      properties:
        action:
          type: string
          enum: [ajukan_perubahan, setujui, arsipkan]
        kode:
          type: array
          minItems: 1
