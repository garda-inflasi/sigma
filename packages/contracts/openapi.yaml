      operationId: createIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntervensiRequest"
      responses:
        "201":
          description: Intervensi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/intervensi/bulk:
    post:
      summary: Menjalankan aksi massal pada intervensi
      operationId: bulkIntervensi
      tags:
        - Intervensi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/{id}:
    get:
      summary: Mendapatkan detail sumber data
      operationId: getSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detail sumber data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Sumber data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/sumber-data/bulk:
    post:
      summary: Menjalankan aksi massal pada pipeline sumber data
      operationId: bulkSumberData
      tags:
        - Sumber Data
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSumberDataRequest"
      responses:
        "200":
          description: Aksi massal berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultResponse"
        "400":
          description: Validasi gagal atau aksi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/lapangan/tugas/{id}:
