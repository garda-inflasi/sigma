            gagal:
              type: integer

    # ── Spasial ────────────────────────────────────────────────────────
    SpasialMarker:
      type: object
      properties:
        kode:
          type: string
          example: "1171"
        nama:
          type: string
          example: KOTA BANDA ACEH
        level:
          type: string
          enum: [kabupaten, kota]
        lat:
          type: number
        lng:
          type: number
        delta:
          type: number
          description: Deviasi harga (persen) komoditas teratas; 0 bila wilayah belum punya neraca
        komoditas:
          type: string
          description: Nama komoditas teratas, "—" bila belum ada neraca
        status:
          type: string
          enum: [defisit, waspada, normal, surplus]
        punya_pasar:
          type: boolean

    SpasialMarkerListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpasialMarker"

    SpasialNeraca:
      type: object
      properties:
        komoditas_kode:
          type: string
        komoditas_nama:
          type: string
        kabupaten_kode:
          type: string
        wilayah:
          type: string
        periode:
          type: string
          format: date
        surplus_defisit_ton:
          type: number
          description: Positif = surplus, negatif = defisit
        delta_harga_pct:
          type: number
        sumber:
          type: string
          example: DEMO

    SpasialNeracaListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpasialNeraca"

    SpasialRute:
      type: object
      properties:
        id:
          type: string
          example: RT-1106-1171
        asal_kode:
          type: string
        asal:
          type: string
        tujuan_kode:
          type: string
        tujuan:
          type: string
        komoditas_kode:
          type: string
        komoditas_nama:
          type: string
        volume_ton:
          type: number
        jarak_km:
          type: integer
        jam_tempuh:
          type: number
        biaya:
          type: integer
          format: int64
          description: Rupiah
        status:
          type: string
          example: USULAN
        sumber:
          type: string
        dibuat_pada:
          type: string
          format: date-time

    SpasialRuteListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpasialRute"

    SpasialKandidat:
      type: object
      properties:
        id:
          type: string
          example: KC-1173
        kabupaten_kode:
          type: string
        wilayah:
          type: string
        lokasi:
          type: string
        skor:
          type: integer
          minimum: 0
          maximum: 100
        komponen_skor:
          type: object
          additionalProperties:
            type: number
        alasan:
          type: string
        status:
          type: string
          enum: [RENCANA, USULAN_BARU]
        sumber:
          type: string

    SpasialKandidatListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: OK
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpasialKandidat"

    # ── Cold Storage ───────────────────────────────────────────────────
    AuditRow:
      type: object
      properties:
        id:
          type: string
        waktu:
          type: string
          format: date-time
        aktor_id:
          type: string
          description: Kosong bila tanpa pelaku terautentikasi atau akunnya sudah dihapus
        aktor_nama:
          type: string
          description: Snapshot nama aktor saat aksi
        aktor_email:
          type: string
        aktor_peran:
          type: string
        aksi:
          type: string
          example: ASSIGN_ROLE
        entitas:
          type: string
          example: pengguna
        entitas_id:
          type: string
        hasil:
          type: string
          enum: [BERHASIL, GAGAL, DITOLAK]
        ip:
          type: string
        user_agent:
          type: string
        correlation_id:
          type: string
        sebelum:
          type: object
          description: Keadaan objek sebelum aksi (bila mengubah data)
        sesudah:
          type: object
          description: Keadaan objek sesudah aksi
        metadata:
          type: object

    AuditPageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditRow"
            next_cursor:
              type: string
              description: Kosong pada halaman terakhir

    MasterKomoditasRow:
      type: object
      properties:
        kode:
          type: string
          example: CBM-KRT
        nama:
          type: string
          example: Cabai merah keriting
        kategori:
          type: string
          example: Hortikultura
        satuan:
          type: string
          example: kg
        harga_acuan:
          type: integer
          description: Harga konsumen acuan (Rp)
          example: 52000
        pilot:
          type: boolean
        shelf_life_hari:
          type: integer
        versi:
          type: integer
        status:
          type: string
          enum: [AKTIF, MENUNGGU_PERSETUJUAN, DIARSIPKAN]

    MasterKomoditasListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/MasterKomoditasRow"

    ColdStorageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          $ref: "#/components/schemas/ColdStorageData"

    ColdStorageData:
      type: object
      properties:
        fasilitas:
          type: array
          description: Seluruh fasilitas; operasional lebih dulu, lalu perawatan, lalu rencana
          items:
            $ref: "#/components/schemas/FasilitasColdStorage"
        stok:
          type: array
          description: Satu halaman lot stok menurut filter dan urutan
          items:
            $ref: "#/components/schemas/StokColdStorage"
        meta:
          $ref: "#/components/schemas/ColdStoragePageMeta"
        ringkasan:
          $ref: "#/components/schemas/ColdStorageRingkasan"

    FasilitasColdStorage:
      type: object
      properties:
        id:
          type: string
          example: CS-01
        nama:
          type: string
          example: Cold Storage Lambaro
        kabupaten_kode:
          type: string
          example: "1106"
        kabupaten_nama:
          type: string
          description: Nama pada master wilayah
          example: KABUPATEN ACEH BESAR
        lat:
          type: number
          format: double
          example: 5.505
        lng:
          type: number
          format: double
          example: 95.37
        kapasitas_ton:
          type: integer
          example: 400
        terisi_ton:
          type: number
          format: double
          description: Jumlah volume seluruh lot di fasilitas
          example: 347.0
        utilisasi_persen:
          type: number
          format: double
          description: terisi_ton / kapasitas_ton × 100, satu desimal
          example: 86.8
        suhu_target_c:
          type: number
          format: double
          example: 4
        suhu_aktual_c:
          type: number
          format: double
          nullable: true
          description: Pembacaan sensor terakhir; null bila belum ada telemetri
          example: 3.5
        status:
          type: string
          enum: [OPERASIONAL, PERAWATAN, RENCANA]

    StokColdStorage:
      type: object
      properties:
        id:
          type: string
          example: STK-CS01-01
        cold_storage_id:
          type: string
          example: CS-01
        cold_storage_nama:
          type: string
          example: Cold Storage Lambaro
        komoditas_kode:
          type: string
          example: cabai_merah_keriting
        komoditas_nama:
          type: string
          example: Cabai Merah Keriting
        volume_ton:
          type: number
          format: double
          example: 34.9
        masuk_pada:
          type: string
          format: date-time
        kedaluwarsa_pada:
          type: string
          format: date-time
        sisa_masa_simpan_hari:
          type: integer
          description: Dibulatkan ke atas; 0 berarti sudah melewati batas
          example: 5
        risiko_food_loss:
          type: number
          format: double
          description: Pecahan 0–1
          example: 0.68
        pemilik:
          type: string
          example: KUD Pidie Jaya

    ColdStoragePageMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          description: Jumlah lot yang cocok dengan filter
          example: 23
        total_pages:
          type: integer
          example: 3
        volume_hasil_ton:
          type: number
          format: double
          description: Total volume seluruh hasil filter (semua halaman)
          example: 813.0

    ColdStorageRingkasan:
      type: object
      description: Agregat seluruh stok; tidak terpengaruh filter tabel
      properties:
        total_lot:
          type: integer
          format: int64
          example: 23
        total_volume_ton:
          type: number
          format: double
          example: 813.0
        risiko_tinggi_lot:
          type: integer
          format: int64
          example: 4
        risiko_tinggi_ton:
          type: number
          format: double
          example: 172.7
        ambang_risiko_tinggi:
          type: number
          format: double
          description: Lot dengan risiko di atas nilai ini dihitung berisiko tinggi
          example: 0.6

    BulkColdStorageRequest:
      type: object
      required:
        - action
        - ids
      properties:
        action:
          type: string
          enum: [rencanakan_distribusi, rekomendasi_olahan]
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
          example: ["STK-CS01-01", "STK-CS03-01"]

    BulkColdStorageResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
          properties:
            berhasil:
              type: integer
              description: Lot yang ditemukan dan diproses
              example: 2
            gagal:
              type: integer
              description: Id yang tidak ditemukan
              example: 0
            volume_ton:
              type: number
              format: double
              description: Total volume lot yang diproses
              example: 65.9

    PolicyBrief:
      type: object
      properties:
        id:
          type: string
          description: PB-YYYY-MM
          example: PB-2026-10
        periode:
          type: string
          example: Oktober 2026
        judul:
          type: string
        status:
          type: string
          enum: [DRAF, TELAAH, DISETUJUI, DIDISTRIBUSIKAN]
        ringkasan:
          type: string
        disusun_oleh:
          type: string
          description: Nama penyusun
        jumlah_rekomendasi:
          type: integer
        halaman:
          type: integer
        dibuat_pada:
          type: string
          format: date-time
        diperbarui:
          type: string
          format: date-time

    PolicyBriefListResponse:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/PolicyBrief"

    PolicyBriefCreatedResponse:
      type: object
      properties:
        code:
          type: string
          example: "201"
        message:
          type: string
        data:
          $ref: "#/components/schemas/PolicyBrief"

    GeneratePolicyBriefRequest:
      type: object
      required: [periode]
      properties:
        periode:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: Periode bulanan YYYY-MM
          example: "2026-11"

    PrediksiRingkasan:
      type: object
      properties:
        komoditas_kode: {type: string, example: CBM-KRT}
        komoditas_nama: {type: string, example: Cabai merah keriting}
        kabupaten_kode: {type: string, example: "1171"}
        horizon_hari: {type: integer, example: 14}
        harga_kini: {type: integer, description: Harga dasar saat proyeksi dibuat (Rp), example: 50000}
        proyeksi: {type: integer, description: Harga proyeksi (Rp), example: 57100}
        perubahan_pct: {type: number, format: double, example: 14.2}
        bawah_pct: {type: number, format: double, description: Batas bawah rentang 80% terhadap harga dasar (persen)}
        atas_pct: {type: number, format: double, description: Batas atas rentang 80% terhadap harga dasar (persen)}
        model_versi: {type: string, example: v2.3.1}
        mape: {type: number, format: double, example: 7.6}
        sumber: {type: string, enum: [MODEL, DEMO]}

    PrediksiTitik:
      type: object
      description: Titik seri grafik. Riwayat hanya `aktual`; titik sambung memuat keduanya; proyeksi memuat `proyeksi`, `bawah`, `atas`.
      properties:
        tanggal: {type: string, format: date}
        aktual: {type: integer}
        proyeksi: {type: integer}
        bawah: {type: integer}
        atas: {type: integer}

    PrediksiFaktor:
      type: object
      properties:
        nama: {type: string}
        kontribusi: {type: number, format: double, description: Poin persen terhadap perubahan harga proyeksi}
        detail: {type: string}

    PrediksiProyeksi:
      type: object
      properties:
        komoditas_kode: {type: string}
        komoditas_nama: {type: string}
        kabupaten_kode: {type: string}
        kabupaten_nama: {type: string}
        horizon_hari: {type: integer}
        harga_kini: {type: integer}
        perubahan_pct: {type: number, format: double}
        bawah_pct: {type: number, format: double}
        atas_pct: {type: number, format: double}
        seri:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiTitik"
        faktor:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiFaktor"
        narasi: {type: string}
        model:
          type: object
          properties:
            nama: {type: string}
            versi: {type: string}
            mape: {type: number, format: double}
            dilatih: {type: string, format: date}
        rekomendasi:
          type: array
          items: {type: string}
        sumber: {type: string, enum: [MODEL, DEMO]}

    PrediksiModel:
      type: object
      properties:
        id: {type: string, example: MDL-CBM-KRT-v2.3.1}
        komoditas_kode: {type: string}
        komoditas_nama: {type: string}
        nama: {type: string}
        versi: {type: string}
        mape: {type: number, format: double}
        drift: {type: number, format: double}
        status: {type: string, enum: [PRODUKSI, KANDIDAT, ARSIP]}
        dilatih_pada: {type: string, format: date-time}
        sumber: {type: string, enum: [MODEL, DEMO]}

    PrediksiRingkasanListResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiRingkasan"

    PrediksiProyeksiResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          $ref: "#/components/schemas/PrediksiProyeksi"

    PrediksiModelListResponse:
      type: object
      properties:
        code: {type: string, example: "200"}
        message: {type: string, example: "OK"}
        data:
          type: array
          items:
            $ref: "#/components/schemas/PrediksiModel"
