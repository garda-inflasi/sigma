          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ews/{id}:
    get:
      summary: Mendapatkan detail alert EWS
      operationId: getEwsAlert
      tags:
        - Early Warning System
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID alert
      responses:
        "200":
          description: Detail alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
