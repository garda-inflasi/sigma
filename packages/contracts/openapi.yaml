openapi: "3.0.3"
info:
  title: Garda Inflasi API
  description: API for Garda Inflasi — platform pengendalian inflasi daerah
  version: "1.0.0"
  contact:
    name: FMIPA USK × Kanwil DJPb

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.garda-inflasi.dev
    description: Development

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: "2026-10-15T03:00:00Z"

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"

    Envelope:
      type: object
      properties:
        code:
          type: string
          example: "200"
        message:
          type: string
          example: "OK"
        data:
          type: object
