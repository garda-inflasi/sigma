        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UbahFasilitasRequest"
      responses:
        "200":
          description: Fasilitas setelah perubahan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FasilitasColdStorageResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Tanpa izin `coldstorage.kelola`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Fasilitas tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
